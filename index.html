r Infektion. Immunsuppression war in den adjustierten Analysen mit einem schwereren Verlauf, nicht mit einer höheren Infektionshäufigkeit verbunden.","evidenceNote":"Registerdaten von Mai 2020 bis Juni 2021; Assoziationen erlauben keine kausale Zuweisung und keine unmittelbare Übertragung auf spätere Impf- und Variantenkontexte.","featured":false,"authors":["Frauke Stascheit","Ulrike Grittner","Sarah Hoffmann","Philipp Mergenthaler","Michael Schroeter","Tobias Ruck","Mark Pawlitzki","Franz Blaes","Julia Kaiser","Ulrike Schara","Adela Della-Marina","Andrea Thieme","Tim Hagenacker","Christian Jacobi","Benjamin Berger","Peter P Urban","Karl Christian Knop","Berthold Schalke","De-Hyung Lee","Petra Kalischewski","Heinz Wiendl","Andreas Meisel"],"authorAnchors":["pawlitzki"],"topics":["neuroimmunology","care"],"sourceUrls":["https://pubmed.ncbi.nlm.nih.gov/36166068/","https://doi.org/10.1007/s00415-022-11389-0"],"url":"https://pubmed.ncbi.nlm.nih.gov/36166068/"},{"id":"pmid-36336685","pmid":"36336685","title":"Real-world evidence on siponimod treatment in patients with secondary progressive multiple sclerosis","year":2022,"journal":"Neurological research and practice","date":"2022-11-07","doi":"10.1186/s42466-022-00219-3","status":"published","onlineYear":2022,"onlineDate":"2022-11-07","journalAbbreviation":"Neurol Res Pract","volume":"4","issue":"1","pages":"55","pmcid":"PMC9639325","type":"Originalarbeit","scope":"Kooperation / klinische Forschung","summaryDe":"Die multizentrische Routinedatenanalyse beschreibt den Verlauf von 227 Menschen mit sekundär progredienter MS unter Siponimod. Sie erfasst Behinderung, MRT-Aktivität, Verträglichkeit und Therapieabbrüche; die Verläufe waren unterschiedlich.","evidenceNote":"Retrospektive Beobachtung ohne unbehandelte Vergleichsgruppe. Fehlende spätere Verlaufsmessungen begrenzen Aussagen zur längerfristigen Wirksamkeit.","featured":false,"authors":["Liesa Regner-Nelke","Marc Pawlitzki","Alice Willison","Leoni Rolfes","Sinem-Hilal 95/"},{"id":"pmid-35965205","pmid":"35965205","title":"Cellular senescence in neuroinflammatory disease: new therapies for old cells?","year":2022,"journal":"Trends in molecular medicine","date":"2022-10","doi":"10.1016/j.molmed.2022.07.003","status":"published","onlineYear":2022,"onlineDate":"2022-08-12","journalAbbreviation":"Trends Mol Med","volume":"28","issue":"10","pages":"850-863","pmcid":null,"type":"Review","scope":"Kooperation / klinische Forschung","summaryDe":"Die Übersichtsarbeit diskutiert zelluläre Seneszenz als möglichen Bestandteil chronischer Neuroinflammation und Neurodegeneration. Sie fragt, ob seneszente Zellen zur MS-Progression beitragen und therapeutisch adressierbar sein könnten.","evidenceNote":"Mechanistische und therapeutische Perspektive aus der Literatur; kein Nachweis einer wirksamen seneszenzgerichteten Therapie bei MS.","featured":false,"authors":["Christopher Nelke","Christina B Schroeter","Marc Pawlitzki","Sven G Meuth","Tobias Ruck"],"authorAnchors":["pawlitzki"],"topics":["neuroimmunology"],"sourceUrls":["https://pubmed.ncbi.nlm.nih.gov/35965205/","https://doi.org/10.1016/j.molmed.2022.07.003"],"url":"https://pubmed.ncbi.nlm.nih.gov/35965205/"},{"id":"pmid-36071461","pmid":"36071461","title":"Immunoadsorption versus double-dose methylprednisolone in refractory multiple sclerosis relapses","year":2022,"journal":"Journal of neuroinflammation","date":"2022-09-07","doi":"10.1186/s12974-022-02583-y","status":"published","onlineYear":2022,"onlineDate":"2022-09-07","journalAbbreviation":"J Neuroinflammation","volume":"19","issue":"1","pages":"220","pmcid":"PMC9450381","type":"Originalarbeit","scope":"Kooperation / klinische Forschung","summaryDe":"Bei 42 Menschen mit steroidrefraktärem MS-Schub wurden Immunadsorption und eine erneute, höher dosierte Methylprednisolonbehandlung verglichen. Immunadsorption war mit günstigeren funktionellen Ergebnissen verbunden; begleitend wurden Immunzell- und Proteinveränderungen untersucht.","evidenceNote":"Kleine, nicht randomisierte Beobachtungsstudie mit 16 beziehungsweise 26 Behandelten. Gruppenunterschiede können trotz Adjustierung durch die Behandlungswahl beeinflusst sein.","featured":false,"authors":["Steffen Pfeuffer","Leoni Rolfes","Timo Wirth","Falk Steffen","Marc Pawlitzki","Andreas Schulte-Mecklenbeck","Catharina C Gross","Marcus Brand","Stefan Bittner","Tobias Ruck","Luisa Klotz","Heinz Wiendl","Sven G Meuth"],"authorAnchors":["pawlitzki"],"topics":["neuroimmunology","biomarkers"],"sourceUrls":["https://pubmed.ncbi.nlm.nih.gov/36071461/","https://doi.org/10.1186/s12974-022-02583-y"],"url":"https://pubmed.ncbi.nlm.nih.gov/36071461/"},{"id":"pmid-35193952","pmid":"35193952","title":"Immune response to SARS-CoV-2 vaccination in relation to peripheral immune cell profiles among patients with multiple sclerosis receiving ocrelizumab","year":2022,"journal":"Journal of neurology, neurosurgery, and psychiatry","date":"2022-09","doi":"10.1136/jnnp-2021-328197","status":"published","onlineYear":2022,"onlineDate":"2022-02-22","journalAbbreviation":"J Neurol Neurosurg Psychiatry","volume":"93","issue":"9","pages":"978-985","pmcid":"PMC8889453","type":"Originalarbeit","scope":"Kooperation / klinische Forschung","summaryDe":"Bei 59 Menschen mit MS unter Ocrelizumab wurden Impfantworten gegen SARS-CoV-2 mit peripheren Immunzellprofilen verknüpft. Antikörperantworten waren seltener nachweisbar als T-Zell-Antworten; B-Zellzahlen und der zeitliche Abstand zur Infusion standen mit Antikörpertitern in Beziehung.","evidenceNote":"Retrospektive Immunogenitätsstudie nach zwei Impfungen. Die gemessenen Immunantworten sind kein unmittelbarer Nachweis des klinischen Infektionsschutzes.","featured":false,"authors":["Saskia Räuber","Melanie Korsen","Niklas Huntemann","Leoni Rolfes","Thomas Müntefering","Vera Dobelmann","Alexander M Hermann","Tristan Kölsche","Karin von Wnuck Lipinski","Christina B Schroeter","Christopher Nelke","Liesa Regner-Nelke","Jens Ingwersen","Marc Pawlitzki","Bianca Teegen","Michael Harry Barnett","Hans-Peter Hartung","Orhan Aktas","Philipp Albrecht","Bodo Levkau","Nico Melzer","Tobias Ruck","Sven G Meuth","David Kremer"],"authorAnchors":["pawlitzki"],"topics":["neuroimmunology","biomarkers"],"sourceUrls":["https://pubmed.ncbi.nlm.nih.gov/35193952/","https://doi.org/10.1136/jnnp-2021-328197"],"url":"https://pubmed.ncbi.nlm.nih.gov/35193952/"},{"id":"pmid-35690010","pmid":"35690010","title":"Immunological consequences of cladribine treatment in multiple sclerosis: A real-world study","year":2022,"journal":"Multiple sclerosis and related disorders","date":"2022-08","doi":"10.1016/j.msard.2022.103931","status":"published","onlineYear":2022,"onlineDate":"2022-05-29","journalAbbreviation":"Mult Scler Relat Disord","volume":"64","issue":"","pages":"103931","pmcid":null,"type":"Originalarbeit","scope":"Kooperation / klinische Forschung","summaryDe":"Eine prospektive Untersuchung begleitete 80 Menschen mit MS während der ersten zwei Jahre einer Cladribintherapie mit regelmäßigen Laboranalysen. Sie beschreibt Veränderungen verschiedener Immunzellpopulationen, Lymphopenien und Infektionen; die Zellveränderungen waren nicht mit der erfassten Krankheitsaktivität assoziiert.","evidenceNote":"Beobachtungsstudie an zwei Zentren; fehlende Assoziation mit Krankheitsaktivität belegt weder Gleichwertigkeit der Zellprofile noch eine individuelle Vorhersagefähigkeit.","featured":false,"authors":["Leoni Rolfes","Steffen Pfeuffer","Niklas Huntemann","Mariella Schmidt","Chuanxin Su","Jelena Skuljec","Derya Aslan","Jana Hackert","Konstanze Kleinschnitz","Tim Hagenacker","Marc Pawlitzki","Tobias Ruck","Christoph Kleinschnitz","Sven G Meuth","Refik Pul"],"authorAnchors":["pawlitzki"],"topics":["neuroimmunology","biomarkers"],"sourceUrls":["https://pubmed.ncbi.nlm.nih.gov/35690010/","https://doi.org/10.1016/j.msard.2022.103931"],"url":"https://pubmed.ncbi.nlm.nih.gov/35690010/"},{"id":"pmid-35612662","pmid":"35612662","title":"Skeletal muscle provides the immunological micro-milieu for specific plasma cells in anti-synthetase syndrome-associated myositis","year":2022,"journal":"Acta neuropathologica","date":"2022-08","doi":"10.1007/s00401-022-02438-z","status":"published","onlineYear":2022,"onlineDate":"2022-05-25","journalAbbreviation":"Acta Neuropathol","volume":"144","issue":"2","pages":"353-372","pmcid":"PMC9288384","type":"Originalarbeit","scope":"Grundlagen / frühe Arbeiten","summaryDe":"Bei Antisynthetase-Syndrom-assoziierter Myositis wurden Muskelgewebe und periphere Immunzellen untersucht. Histologie und Proteomanalysen beschreiben ein entzündliches Gewebemilieu, das mit lokalen B- und Plasmazellen in Verbindung steht.","evidenceNote":"Mechanistische Untersuchung mit erkrankten und gesunden Kontrollgruppen; eine gegen diese Nische gerichtete Therapie wurde nicht klinisch getestet.","featured":false,"authors":["Corinna Preuße","Barbara Paesler","Christopher Nelke","Derya Cengiz","Thomas Müntefering","Andreas Roos","Damien Amelin","Yves Allenbach","Akinori Uruha","Carsten Dittmayer","Andreas Hentschel","Marc Pawlitzki","Sarah Hoffmann","Sara Timm","Sarah Leonard Louis","Nora F Dengler","Heinz Wiendl","Jan D Lünemann","Albert Sickmann","Baptiste Hervier","Sven G Meuth","Udo Schneider","Anne Schänzer","Sabine Krause","Stylianos Tomaras","Eugen Feist","Rebecca Hasseli","Hans-Hilmar Goebel","Laure Gallay","Nathalie Streichenberger","Olivier Benveniste","Werner Stenzel","Tobias Ruck"],"authorAnchors":["pawlitzki"],"topics":["neuroimmunology","biomarkers"],"sourceUrls":["https://pubmed.ncbi.nlm.nih.gov/35612662/","https://doi.org/10.1007/s00401-022-02438-z"],"url":"https://pubmed.ncbi.nlm.nih.gov/35612662/"},{"id":"pmid-35246490","pmid":"35246490","title":"Eculizumab versus rituximab in generalised myasthenia gravis","year":2022,"journal":"Journal of neurology, neurosurgery, and psychiatry","date":"2022-05","doi":"10.1136/jnnp-2021-328665","status":"published","onlineYear":2022,"onlineDate":"2022-03-04","journalAbbreviation":"J Neurol Neurosurg Psychiatry","volume":"93","issue":"5","pages":"548-554","pmcid":"PMC9016243","type":"Originalarbeit","scope":"Kooperation / klinische Forschung","summaryDe":"Die retrospektive Studie verglich 57 Rituximab- und 20 Eculizumab-Behandlungen bei refraktärer, AChR-Antikörper-positiver generalisierter Myasthenie. Eculizumab war mit günstigeren Ergebnissen im QMG-Score und häufigerem minimalem Manifestationsstatus verbunden; eine Verringerung des Krisenrisikos wurde nicht gezeigt.","evidenceNote":"Beobachtungsvergleich über 24 Monate mit Propensity-Score-Matching; verbleibende Unterschiede zwischen den Behandlungsgruppen begrenzen kausale Schlussfolgerungen.","featured":false,"authors":["Christopher Nelke","Christina B Schroeter","Frauke Stascheit","Marc Pawlitzki","Liesa Regner-Nelke","Niklas Huntemann","Ercan Arat","Menekse Öztürk","Nico Melzer","Philipp Mergenthaler","Asmae Gassa","Henning Stetefeld","Michael Schroeter","Benjamin Berger","Andreas Totzeck","Tim Hagenacker","Stefanie Schreiber","Stefan Vielhaber","Hans-Peter Hartung","Andreas Meisel","Heinz Wiendl","Sven G Meuth","Tobias Ruck"],"authorAnchors":["pawlitzki"],"topics":["neuroimmunology","care"],"sourceUrls":["https://pubmed.ncbi.nlm.nih.gov/35246490/","https://doi.org/10.1136/jnnp-2021-328665"],"url":"https://pubmed.ncbi.nlm.nih.gov/35246490/"},{"id":"pmid-35413850","pmid":"35413850","title":"Independent risk factors for myasthenic crisis and disease exacerbation in a retrospective cohort of myasthenia gravis patients","year":2022,"journal":"Journal of neuroinflammation","date":"2022-04-12","doi":"10.1186/s12974-022-02448-4","status":"published","onlineYear":2022,"onlineDate":"2022-04-12","journalAbbreviation":"J Neuroinflammation","volume":"19","issue":"1","pages":"89","pmcid":"PMC9005160","type":"Originalarbeit","scope":"Kooperation / klinische Forschung","summaryDe":"In einer retrospektiven Kohorte mit 815 Menschen mit Myasthenia gravis aus acht deutschen Zentren waren höhere Krankheitsschwere bei Diagnose, Thymom und MuSK-Antikörper mit späteren Krisen oder Exazerbationen verbunden. Bei myasthenen Krisen gingen unter anderem Infektionen und eingeschränkte Vitalkapazität mit ungünstigeren Verläufen einher.","evidenceNote":"Retrospektive Daten aus tertiären Zentren; die Risikofaktoren ergeben noch kein extern validiertes Vorhersageinstrument. Der fehlende beobachtete Unterschied zwischen IVIG und Plasmaaustausch belegt keine Gleichwertigkeit der Behandlungen.","featured":false,"authors":["Christopher Nelke","Frauke Stascheit","Carmen Eckert","Marc Pawlitzki","Christina B Schroeter","Niklas Huntemann","Philipp Mergenthaler","Ercan Arat","Menekse Öztürk","Dirk Foell","Stefanie Schreiber","Stefan Vielhaber","Asmae Gassa","Henning Stetefeld","Michael Schroeter","Benjamin Berger","Andreas Totzeck","Tim Hagenacker","Sven G Meuth","Andreas Meisel","Heinz Wiendl","Tobias Ruck"],"authorAnchors":["pawlitzki"],"topics":["neuroimmunology","care"],"sourceUrls":["https://pubmed.ncbi.nlm.nih.gov/35413850/","https://doi.org/10.1186/s12974-022-02448-4"],"url":"https://pubmed.ncbi.nlm.nih.gov/35413850/"},{"id":"pmid-35253967","pmid":"35253967","title":"Sirolimus leads to rapid and sustained clinical improvement of motor deficits in a patient with inclusion body myositis","year":2022,"journal":"European journal of neurology","date":"2022-04","doi":"10.1111/ene.15231","status":"published","onlineYear":null,"onlineDate":null,"journalAbbreviation":"Eur J Neurol","volume":"29","issue":"4","pages":"1284-1287","pmcid":null,"type":"Fallbericht","scope":"Kooperation / klinische Forschung","summaryDe":"Der Fallbericht beschreibt eine über mehr als ein Jahr anhaltende motorische Besserung unter Sirolimus bei Einschlusskörpermyositis. Die untersuchten peripheren CD8-T-Zell-Untergruppen zeigten nach neun und zwölf Monaten keine wesentliche Veränderung gegenüber dem Ausgangsbefund.","evidenceNote":"Beobachtung einer einzelnen Person ohne Kontrollbehandlung; daraus lassen sich weder allgemeine Wirksamkeit und Sicherheit noch ein immunologischer Wirkmechanismus ableiten.","featured":false,"authors":["Marc Pawlitzki","Christopher Nelke","Melanie Korsen","Sven G Meuth","Tobias Ruck"],"authorAnchors":["pawlitzki"],"topics":["neuroimmunology"],"sourceUrls":["https://pubmed.ncbi.nlm.nih.gov/35253967/","https://doi.org/10.1111/ene.15231"],"url":"https://pubmed.ncbi.nlm.nih.gov/35253967/"},{"id":"pmid-35082170","pmid":"35082170","title":"Costs and Health-Related Quality of Life in Patients With NMO Spectrum Disorders and MOG-Antibody-Associated Disease: CHANCENMO Study","year":2022,"journal":"Neurology","date":"2022-03-15","doi":"10.1212/WNL.0000000000200052","status":"published","onlineYear":2022,"onlineDate":"2022-01-26","journalAbbreviation":"Neurology","volume":"98","issue":"11","pages":"e1184-e1196","pmcid":"PMC8935443","type":"Originalarbeit","scope":"Kooperation / klinische Forschung","summaryDe":"Die CHANCENMO-Querschnittsstudie erfasste bei 212 Menschen mit NMOSD oder MOGAD Krankheitskosten und gesundheitsbezogene Lebensqualität. Die mittleren jährlichen Kosten betrugen aus gesellschaftlicher Perspektive 59.574 Euro zu Preisen von 2018; stärkere Behinderung war mit höheren Kosten und niedrigerer Lebensqualität verbunden.","evidenceNote":"Die Kosten beruhen auf Fragebogenangaben und einer historischen deutschen Versorgungssituation vor zugelassenen präventiven Immuntherapien für NMOSD. Sie sind keine aktuellen Behandlungskosten oder individuelle Kostenvorhersagen.","featured":false,"authors":["Martin W Hümmert","Louisa M Schöppe","Judith Bellmann-Strobl","Nadja Siebert","Friedemann Paul","Ankelien Duchow","Hannah Pellkofer","Tania Kümpfel","Joachim Havla","Sven Jarius","Brigitte Wildemann","Achim Berthele","Florian Then Bergh","Marc Pawlitzki","Luisa Klotz","Ingo Kleiter","Martin Stangel","Stefan Gingele","Martin S Weber","Juergen H Faiss","Refik Pul","Annette Walter","Uwe K Zettl","Makbule Senel","Jan-Patrick Stellmann","Vivien Häußler","Kerstin Hellwig","Ilya Ayzenberg","Orhan Aktas","Marius Ringelstein","Olivia Schreiber-Katz","Corinna Trebst","Neuromyelitis Optica Study Group (NEMOS)"],"authorAnchors":["pawlitzki"],"topics":["care","neuroimmunology"],"sourceUrls":["https://pubmed.ncbi.nlm.nih.gov/35082170/","https://doi.org/10.1212/WNL.0000000000200052"],"url":"https://pubmed.ncbi.nlm.nih.gov/35082170/"},{"id":"pmid-35150978","pmid":"35150978","title":"A national, multi-center study in Germany to assess implementation of infusion management, treatment satisfaction and quality of life in MS patients receiving alemtuzumab","year":2022,"journal":"Multiple sclerosis and related disorders","date":"2022-03","doi":"10.1016/j.msard.2022.103670","status":"published","onlineYear":2022,"onlineDate":"2022-02-05","journalAbbreviation":"Mult Scler Relat Disord","volume":"59","issue":"","pages":"103670","pmcid":null,"type":"Originalarbeit","scope":"Kooperation / klinische Forschung","summaryDe":"Die multizentrische Beobachtungsstudie INFUSE-MS untersuchte das Infusionsmanagement bei 140 Menschen mit schubförmiger MS unter Alemtuzumab. Die Abläufe entsprachen weitgehend der Fachinformation; dokumentierte Infusionsreaktionen waren meist mild, und die Befragten berichteten hohe Behandlungszufriedenheit.","evidenceNote":"Die Studie beschreibt die damalige Versorgungspraxis ohne randomisierten Vergleich. Seltene schwere Nebenwirkungen und langfristige Sicherheitsrisiken lassen sich aus dieser Kohorte nicht ausschließen.","featured":false,"authors":["Saskia Räuber","Marc Pawlitzki","Melanie Korsen","Jennifer S Kullmann","Daniela Thoene","Steffen Pfeuffer","Leoni Rolfes","Christopher Nelke","Nico Melzer","Tobias Ruck","Sven G Meuth","INFUSE-MS study group"],"authorAnchors":["pawlitzki"],"topics":["care","neuroimmunology"],"sourceUrls":["https://pubmed.ncbi.nlm.nih.gov/35150978/","https://doi.org/10.1016/j.msard.2022.103670"],"url":"https://pubmed.ncbi.nlm.nih.gov/35150978/"},{"id":"pmid-34702947","pmid":"34702947","title":"K2P18.1 translates T cell receptor signals into thymic regulatory T cell development","year":2022,"journal":"Cell research","date":"2022-01","doi":"10.1038/s41422-021-00580-z","status":"published","onlineYear":2021,"onlineDate":"2021-10-26","journalAbbreviation":"Cell Res","volume":"32","issue":"1","pages":"72-88","pmcid":"PMC8547300","type":"Originalarbeit","scope":"Grundlagen / frühe Arbeiten","summaryDe":"Die mechanistische Arbeit verbindet den Kaliumkanal K2P18.1 mit der Signalübertragung bei der Entwicklung regulatorischer T-Zellen im Thymus. Zell- und Mausversuche sowie ergänzende humane Befunde zeigen eine Kopplung an Kalziumeinstrom und FoxP3-Expression; unter Nitroxolin wurde bei Menschen mit Harnwegsinfektionen ein reversibler Anstieg regulatorischer T-Zellen beobachtet.","evidenceNote":"Die therapeutischen Schlussfolgerungen stützen sich überwiegend auf mechanistische und präklinische Experimente. Der beobachtete T-Zell-Anstieg unter Nitroxolin ist kein Wirksamkeitsnachweis für die Behandlung von MS.","featured":false,"authors":["Tobias Ruck","Stefanie Bock","Steffen Pfeuffer","Christina B Schroeter","Derya Cengiz","Paul Marciniak","Maren Lindner","Alexander Herrmann","Marie Liebmann","Stjepana Kovac","Lukas Gola","Leoni Rolfes","Marc Pawlitzki","Nils Opel","Tim Hahn","Udo Dannlowski","Thomas Pap","Felix Luessi","Julian A Schreiber","Bernhard Wünsch","Tanja Kuhlmann","Guiscard Seebohm","Björn Tackenberg","Patricia Seja","Frank Döring","Erhard Wischmeyer","Achmet Imam Chasan","Johannes Roth","Luisa Klotz","Gerd Meyer Zu Hörste","Heinz Wiendl","Tobias Marschall","Stefan Floess","Jochen Huehn","Thomas Budde","Tobias Bopp","Stefan Bittner","Sven G Meuth"],"authorAnchors":["pawlitzki"],"topics":["neuroimmunology"],"sourceUrls":["https://pubmed.ncbi.nlm.nih.gov/34702947/","https://doi.org/10.1038/s41422-021-00580-z"],"url":"https://pubmed.ncbi.nlm.nih.gov/34702947/"},{"id":"pmid-34667129","pmid":"34667129","title":"Evaluation of Age-Dependent Immune Signatures in Patients With Multiple Sclerosis","year":2021,"journal":"Neurology(R) neuroimmunology & neuroinflammation","date":"2021-11","doi":"10.1212/NXI.0000000000001094","status":"published","onlineYear":2021,"onlineDate":"2021-10-19","journalAbbreviation":"Neurol Neuroimmunol Neuroinflamm","volume":"8","issue":"6","pages":"","pmcid":"PMC8529419","type":"Originalarbeit","scope":"Kooperation / klinische Forschung","summaryDe":"Durchflusszytometrische Untersuchungen von Blut und Liquor verglichen altersabhängige Immunprofile bei schubförmiger und primär progredienter MS mit Kontrollen. Besonders bei CD8-T-Zellen unterschieden sich altersbezogene ko-stimulatorische und immunregulatorische Muster; im Liquor zeigte sich ein altersabhängiger Rückgang mehrerer Zellpopulationen bei PPMS, nicht bei RRMS.","evidenceNote":"Altersunterschiede zwischen untersuchten Personen belegen keinen individuellen Alterungsverlauf. Blut- und Liquoranalysen hatten unterschiedliche Gruppengrößen; die Befunde definieren keinen validierten klinischen Immunalter-Test.","featured":false,"authors":["Melanie Eschborn","Marc Pawlitzki","Timo Wirth","Christopher Nelke","Steffen Pfeuffer","Andreas Schulte-Mecklenbeck","Lisa Lohmann","Leoni Rolfes","Katrin Pape","Maria Eveslage","Stefan Bittner","Catharina C Gross","Tobias Ruck","Heinz Wiendl","Sven G Meuth","Luisa Klotz"],"authorAnchors":["pawlitzki"],"topics":["biomarkers","neuroimmunology"],"sourceUrls":["https://pubmed.ncbi.nlm.nih.gov/34667129/","https://doi.org/10.1212/NXI.0000000000001094"],"url":"https://pubmed.ncbi.nlm.nih.gov/34667129/"},{"id":"pmid-33848319","pmid":"33848319","title":"Classification of neurological diseases using multi-dimensional CSF analysis","year":2021,"journal":"Brain : a journal of neurology","date":"2021-10-22","doi":"10.1093/brain/awab147","status":"published","onlineYear":null,"onlineDate":null,"journalAbbreviation":"Brain","volume":"144","issue":"9","pages":"2625-2634","pmcid":"PMC8557345","type":"Originalarbeit","scope":"Kernportfolio","summaryDe":"Eine retrospektive Querschnittsstudie kombinierte Blut- und Liquorparameter von 546 neurologischen Patientinnen und Patienten mit Merkmalsauswahl und maschinellem Lernen. Zusammengesetzte Scores unterstützten die Unterscheidung neuroinflammatorischer von anderen Erkrankungen und wurden in einer unabhängigen Kohorte von 231 Personen geprüft.","evidenceNote":"Die unabhängige Validierung betrifft die untersuchte diagnostische Klassifikation. Eine prospektive Prüfung des Nutzens für Behandlungsentscheidungen oder der Übertragbarkeit auf andere Versorgungskontexte ist damit nicht ersetzt.","featured":false,"authors":["Catharina C Gross","Andreas Schulte-Mecklenbeck","Lohith Madireddy","Marc Pawlitzki","Christine Strippel","Saskia Räuber","Julia Krämer","Leoni Rolfes","Tobias Ruck","Carolin Beuker","Antje Schmidt-Pogoda","Lisa Lohmann","Tilman Schneider-Hohendorf","Tim Hahn","Nicholas Schwab","Jens Minnerup","Nico Melzer","Luisa Klotz","Sven G Meuth","Gerd Meyer Zu Hörste","Sergio E Baranzini","Heinz Wiendl"],"authorAnchors":["pawlitzki"],"topics":["ai","biomarkers","neuroimmunology"],"sourceUrls":["https://pubmed.ncbi.nlm.nih.gov/33848319/","https://doi.org/10.1093/brain/awab147"],"url":"https://pubmed.ncbi.nlm.nih.gov/33848319/"},{"id":"pmid-34685530","pmid":"34685530","title":"NK Cell Patterns in Idiopathic Inflammatory Myopathies with Pulmonary Affection","year":2021,"journal":"Cells","date":"2021-09-27","doi":"10.3390/cells10102551","status":"published","onlineYear":2021,"onlineDate":"2021-09-27","journalAbbreviation":"Cells","volume":"10","issue":"10","pages":"","pmcid":"PMC8534165","type":"Originalarbeit","scope":"Kooperation / klinische Forschung","summaryDe":"Bei je zwölf Menschen mit idiopathischer entzündlicher Myopathie mit oder ohne Lungenbeteiligung wurden periphere NK-Zellen verglichen. Lungenbeteiligung ging mit weniger CD56dim-NK-Zellen und höherer NKG2D-Expression einher; bestimmte Rezeptorsignale waren mit geringerer Vitalkapazität verbunden.","evidenceNote":"Kleine Gruppen mit unterschiedlichen Myositisformen und Messung im peripheren Blut. Die Zusammenhänge belegen weder eine ursächliche Rolle der NK-Zellen im Lungengewebe noch den Nutzen einer gezielten Therapie.","featured":false,"authors":["Marc Pawlitzki","Christopher Nelke","Leoni Rolfes","Rebecca Hasseli","Stylianos Tomaras","Eugen Feist","Anne Schänzer","Saskia Räuber","Liesa Regner","Corinna Preuße","Yves Allenbach","Olivier Benveniste","Heinz Wiendl","Werner Stenzel","Sven G Meuth","Tobias Ruck"],"authorAnchors":["pawlitzki"],"topics":["biomarkers","neuroimmunology"],"sourceUrls":["https://pubmed.ncbi.nlm.nih.gov/34685530/","https://doi.org/10.3390/cells10102551"],"url":"https://pubmed.ncbi.nlm.nih.gov/34685530/"},{"id":"pmid-34261812","pmid":"34261812","title":"Ocrelizumab Extended Interval Dosing in Multiple Sclerosis in Times of COVID-19","year":2021,"journal":"Neurology(R) neuroimmunology & neuroinflammation","date":"2021-09","doi":"10.1212/NXI.0000000000001035","status":"published","onlineYear":2021,"onlineDate":"2021-07-14","journalAbbreviation":"Neurol Neuroimmunol Neuroinflamm","volume":"8","issue":"5","pages":"","pmcid":"PMC8362352","type":"Originalarbeit","scope":"Kooperation / klinische Forschung","summaryDe":"Die retrospektive Multizenterstudie verglich während der COVID-19-Pandemie Ocrelizumab-Standardintervalle mit um mindestens vier Wochen verlängerten Intervallen bei 318 Menschen mit RRMS. Beim dreimonatigen Follow-up zeigten sich keine statistisch gesicherten Unterschiede bei Schüben, bestätigter Behinderungsprogression oder MRT-Progression.","evidenceNote":"Beobachtungsdaten mit kurzer Nachbeobachtung und nicht randomisierter Intervallwahl; ein nicht signifikanter Gruppenunterschied beweist keine langfristige Gleichwertigkeit oder Sicherheit beliebiger Intervallverlängerungen.","featured":false,"authors":["Leoni Rolfes","Marc Pawlitzki","Steffen Pfeuffer","Christopher Nelke","Anke Lux","Refik Pul","Christoph Kleinschnitz","Konstanze Kleinschnitz","Rebeca Rogall","Katrin Pape","Stefan Bittner","Frauke Zipp","Clemens Warnke","Yasemin Goereci","Michael Schroeter","Jens Ingwersen","Orhan Aktas","Luisa Klotz","Tobias Ruck","Heinz Wiendl","Sven G Meuth"],"authorAnchors":["pawlitzki"],"topics":["care","neuroimmunology"],"sourceUrls":["https://pubmed.ncbi.nlm.nih.gov/34261812/","https://doi.org/10.1212/NXI.0000000000001035"],"url":"https://pubmed.ncbi.nlm.nih.gov/34261812/"},{"id":"pmid-33712515","pmid":"33712515","title":"Impact of previous disease-modifying treatment on effectiveness and safety outcomes, among patients with multiple sclerosis treated with alemtuzumab","year":2021,"journal":"Journal of neurology, neurosurgery, and psychiatry","date":"2021-09","doi":"10.1136/jnnp-2020-325304","status":"published","onlineYear":2021,"onlineDate":"2021-03-12","journalAbbreviation":"J Neurol Neurosurg Psychiatry","volume":"92","issue":"9","pages":"1007-1013","pmcid":"PMC8372391","type":"Originalarbeit","scope":"Kooperation / klinische Forschung","summaryDe":"Eine retrospektive Auswertung einer prospektiven Zwei-Zentren-Kohorte mit 170 Alemtuzumab-behandelten MS-Betroffenen untersuchte den Einfluss vorheriger Therapien. Die mit Fingolimod vorbehandelte Gruppe zeigte höhere Risiken für spätere Schübe, bestätigte Behinderungszunahme und sekundäre Autoimmunität.","evidenceNote":"Die Vorbehandlungen waren nicht randomisiert; Unterschiede der Krankheitsaktivität und der Therapiesequenzen können die Vergleiche beeinflussen. Die Ergebnisse beschreiben Risiken in dieser Kohorte und keine individuellen Wahrscheinlichkeiten.","featured":false,"authors":["Steffen Pfeuffer","Tobias Ruck","Refik Pul","Leoni Rolfes","Catharina Korsukewitz","Marc Pawlitzki","Brigitte Wildemann","Luisa Klotz","Christoph Kleinschnitz","Antonio Scalfari","Heinz Wiendl","Sven G Meuth"],"authorAnchors":["pawlitzki"],"topics":["care","neuroimmunology"],"sourceUrls":["https://pubmed.ncbi.nlm.nih.gov/33712515/","https://doi.org/10.1136/jnnp-2020-325304"],"url":"https://pubmed.ncbi.nlm.nih.gov/33712515/"},{"id":"pmid-33150829","pmid":"33150829","title":"High anti-JCPyV serum titers coincide with high CSF cell counts in RRMS patients","year":2021,"journal":"Multiple sclerosis (Houndmills, Basingstoke, England)","date":"2021-09","doi":"10.1177/1352458520970103","status":"published","onlineYear":2020,"onlineDate":"2020-11-05","journalAbbreviation":"Mult Scler","volume":"27","issue":"10","pages":"1491-1496","pmcid":"PMC8414828","type":"Originalarbeit","scope":"Kooperation / klinische Forschung","summaryDe":"Bei 145 Menschen mit RRMS wurden Liquorzellpopulationen in Bezug auf JCPyV-Antikörpertiter, Krankheitsaktivität und Therapie untersucht. Hohe Antikörpertiter waren mit höheren Liquor-T-Zellzahlen verbunden, während Natalizumab die meisten untersuchten Zellpopulationen verringerte.","evidenceNote":"Die ergänzenden PML-Beobachtungen umfassen nur wenige Personen vor oder bei Diagnose. Aus den Liquor- und Antikörperassoziationen lässt sich kein validierter individueller PML-Risikotest ableiten.","featured":false,"authors":["Tilman Schneider-Hohendorf","Andreas Schulte-Mecklenbeck","Patrick Ostkamp","Claudia Janoschka","Marc Pawlitzki","Felix Luessi","Frauke Zipp","Sven G Meuth","Luisa Klotz","Heinz Wiendl","Catharina C Gross","Nicholas Schwab"],"authorAnchors":["pawlitzki"],"topics":["biomarkers","neuroimmunology"],"sourceUrls":["https://pubmed.ncbi.nlm.nih.gov/33150829/","https://doi.org/10.1177/1352458520970103"],"url":"https://pubmed.ncbi.nlm.nih.gov/33150829/"},{"id":"pmid-34572153","pmid":"34572153","title":"Clinical Course, Myopathology and Challenge of Therapeutic Intervention in Pediatric Patients with Autoimmune-Mediated Necrotizing Myopathy","year":2021,"journal":"Children (Basel, Switzerland)","date":"2021-08-24","doi":"10.3390/children8090721","status":"published","onlineYear":2021,"onlineDate":"2021-08-24","journalAbbreviation":"Children (Basel)","volume":"8","issue":"9","pages":"","pmcid":"PMC8470706","type":"Fallbericht","scope":"Kooperation / klinische Forschung","summaryDe":"Die Arbeit beschreibt Verlauf, Muskelpathologie und Therapie zweier Jugendlicher mit immunvermittelter nekrotisierender Myopathie und SRP54- beziehungsweise HMGCR-Antikörpern. Merkmale wie fehlende Hautzeichen und geringe Entzündung in der Biopsie erschwerten die Abgrenzung zur Muskeldystrophie; trotz Therapieeskalation blieben Kraftverlust und Muskelatrophie bestehen.","evidenceNote":"Zwei klinische Fälle veranschaulichen diagnostische Fallstricke. Sie erlauben keinen Wirksamkeitsvergleich der eingesetzten Therapien und keine Häufigkeitsschätzung für juvenile Myopathien.","featured":false,"authors":["Adela Della Marina","Marc Pawlitzki","Tobias Ruck","Andreas van Baalen","Nadine Vogt","Bernd Schweiger","Swantje Hertel","Heike Kölbel","Heinz Wiendl","Corinna Preuße","Andreas Roos","Ulrike Schara-Schmidt"],"authorAnchors":["pawlitzki"],"topics":["neuroimmunology"],"sourceUrls":["https://pubmed.ncbi.nlm.nih.gov/34572153/","https://doi.org/10.3390/children8090721"],"url":"https://pubmed.ncbi.nlm.nih.gov/34572153/"},{"id":"pmid-34390148","pmid":"34390148","title":"Alemtuzumab-induzierte Alopecia areata - Fallbericht und systematische Literaturübersicht zu Alemtuzumab-assoziierten kutanen Nebenwirkungen","titleEnglish":"[Not Available]","year":2021,"journal":"Journal der Deutschen Dermatologischen Gesellschaft = Journal of the German Society of Dermatology : JDDG","date":"2021-08","doi":"10.1111/ddg.14448_g","status":"published","onlineYear":null,"onlineDate":null,"journalAbbreviation":"J Dtsch Dermatol Ges","volume":"19","issue":"8","pages":"1159-1164","pmcid":null,"type":"Review","scope":"Kooperation / klinische Forschung","summaryDe":"Die deutsche Fassung beschreibt eine erstmals unter Alemtuzumab aufgetretene schwere Alopecia areata bei einer RRMS-Patientin und gibt einen Überblick über berichtete kutane Nebenwirkungen. Diskutiert werden unter anderem Vitiligo, Haarverlust, Infektionen und Hauttumoren sowie mögliche Pathomechanismen.","evidenceNote":"Deutsche Parallelfassung der Arbeit PMID 33973347, kein unabhängiger Datensatz. Einzelfall und Literaturübersicht erlauben weder Häufigkeitsschätzungen noch einen gesicherten Nachweis der vorgeschlagenen Mechanismen.","featured":false,"authors":["Elsa Dikeoulia","Matthias Neufeld","Marc Pawlitzki","Markus Böhm"],"authorAnchors":["pawlitzki"],"topics":["care","neuroimmunology"],"sourceUrls":["https://pubmed.ncbi.nlm.nih.gov/34390148/","https://doi.org/10.1111/ddg.14448_g","https://pubmed.ncbi.nlm.nih.gov/33973347/"],"url":"https://pubmed.ncbi.nlm.nih.gov/34390148/"},{"id":"pmid-33973347","pmid":"33973347","title":"Alemtuzumab-induced Alopecia areata - a case report and systematic literature review of adverse events associated with Alemtuzumab","year":2021,"journal":"Journal der Deutschen Dermatologischen Gesellschaft = Journal of the German Society of Dermatology : JDDG","date":"2021-08","doi":"10.1111/ddg.14448","status":"published","onlineYear":2021,"onlineDate":"2021-05-10","journalAbbreviation":"J Dtsch Dermatol Ges","volume":"19","issue":"8","pages":"1159-1163","pmcid":null,"type":"Review","scope":"Kooperation / klinische Forschung","summaryDe":"Ein Fall schwerer Alopecia areata unter Alemtuzumab bildet den Ausgangspunkt für eine Literaturübersicht zu dermatologischen Nebenwirkungen der MS-Therapie. Die Arbeit bespricht unter anderem Haarverlust, Vitiligo, Hautinfektionen und Hauttumoren sowie mögliche zugrunde liegende Mechanismen.","evidenceNote":"Englische Parallelfassung der Arbeit PMID 34390148, kein unabhängiger Datensatz. Einzelfall und Literaturübersicht beschreiben Sicherheitssignale, erlauben aber keine belastbaren Häufigkeiten oder gesicherten gemeinsamen Mechanismen.","featured":false,"authors":["Elsa Dikeoulia","Matthias Neufeld","Marc Pawlitzki","Markus Böhm"],"authorAnchors":["pawlitzki"],"topics":["care","neuroimmunology"],"sourceUrls":["https://pubmed.ncbi.nlm.nih.gov/33973347/","https://doi.org/10.1111/ddg.14448","https://pubmed.ncbi.nlm.nih.gov/34390148/"],"url":"https://pubmed.ncbi.nlm.nih.gov/33973347/"},{"id":"pmid-33844127","pmid":"33844127","title":"The Innate Immune Response Characterizes Posterior Reversible Encephalopathy Syndrome","year":2021,"journal":"Journal of clinical immunology","date":"2021-08","doi":"10.1007/s10875-021-01033-3","status":"published","onlineYear":2021,"onlineDate":"2021-04-12","journalAbbreviation":"J Clin Immunol","volume":"41","issue":"6","pages":"1229-1240","pmcid":"PMC8310851","type":"Originalarbeit","scope":"Kooperation / klinische Forschung","summaryDe":"Bei 15 Personen mit posteriorem reversiblem Enzephalopathiesyndrom wurden Blut- und Liquorprofile retrospektiv mit Kontrollen sowie MS- und PML-Gruppen verglichen. Auffällig waren vermehrte intermediäre Monozyten; für die untersuchten adaptiven Immunzellen fanden sich gegenüber Kontrollen keine entsprechenden Unterschiede.","evidenceNote":"Kleine retrospektive Kohorte mit Krankenhausaufenthaltsdauer als Schweregrad-Surrogat. Das beobachtete Immunprofil ist kein validierter diagnostischer Test und belegt nicht, dass adaptive Immunmechanismen bei PRES grundsätzlich fehlen.","featured":false,"authors":["Christopher Nelke","Andreas Schulte-Mecklenbeck","Marc Pawlitzki","Leoni Rolfes","Saskia Räuber","Catharina C Gross","Jens Minnerup","Sven G Meuth","Heinz Wiendl","Tobias Ruck"],"authorAnchors":["pawlitzki"],"topics":["biomarkers","neuroimmunology"],"sourceUrls":["https://pubmed.ncbi.nlm.nih.gov/33844127/","https://doi.org/10.1007/s10875-021-01033-3"],"url":"https://pubmed.ncbi.nlm.nih.gov/33844127/"},{"id":"pmid-34405141","pmid":"34405141","title":"Amyotrophic lateral sclerosis patients show increased peripheral and intrathecal T-cell activation","year":2021,"journal":"Brain communications","date":"2021","doi":"10.1093/braincomms/fcab157","status":"published","onlineYear":2021,"onlineDate":"2021-07-14","journalAbbreviation":"Brain Commun","volume":"3","issue":"3","pages":"fcab157","pmcid":"PMC8363480","type":"Originalarbeit","scope":"Kooperation / klinische Forschung","summaryDe":"Die Arbeit untersuchte Routineliquorwerte bei 308 Personen, darunter 132 mit ALS, und detaillierte Immunprofile in einer Teilgruppe. Bei ALS zeigten sich erhöhte periphere und intrathekale T-Zell-Aktivierung; diese korrelierte jedoch nicht mit der Progression, während rasche Verläufe mit weniger intrathekalen CD56bright-NK-Zellen verbunden waren.","evidenceNote":"Die detaillierte Immunphänotypisierung umfasste 41 ALS-Betroffene. Der aus den Gruppen entwickelte Klassifikationsscore ist im Abstract nicht als extern validierter diagnostischer oder prognostischer Test ausgewiesen.","featured":false,"authors":["Leoni Rolfes","Andreas Schulte-Mecklenbeck","Stefanie Schreiber","Stefan Vielhaber","Michael Herty","Anika Marten","Steffen Pfeuffer","Tobias Ruck","Heinz Wiendl","Catharina C Gross","Sven G Meuth","Matthias Boentert","Marc Pawlitzki"],"authorAnchors":["pawlitzki"],"topics":["biomarkers","neuroimmunology"],"sourceUrls":["https://pubmed.ncbi.nlm.nih.gov/34405141/","https://doi.org/10.1093/braincomms/fcab157"],"url":"https://pubmed.ncbi.nlm.nih.gov/34405141/"},{"id":"pmid-34086251","pmid":"34086251","title":"Failed, Interrupted, or Inconclusive Trials on Neuroprotective and Neuroregenerative Treatment Strategies in Multiple Sclerosis: Update 2015-2020","year":2021,"journal":"Drugs","date":"2021-06","doi":"10.1007/s40265-021-01526-w","status":"published","onlineYear":2021,"onlineDate":"2021-06-04","journalAbbreviation":"Drugs","volume":"81","issue":"9","pages":"1031-1063","pmcid":"PMC8217012","type":"Review","scope":"Kooperation / klinische Forschung","summaryDe":"Die Übersicht analysiert zwischen 2015 und 2020 gescheiterte, abgebrochene oder nicht eindeutige klinische Studien zu neuroprotektiven und neuroregenerativen MS-Therapien. Sie diskutiert Remyelinisierung, mögliche Gründe für die fehlende Übertragung präklinischer Erfolge und Konsequenzen für künftige Studiendesigns.","evidenceNote":"Historische Übersicht zu ausgewählten Entwicklungsprogrammen bis 2020. Das Scheitern einer Studie widerlegt nicht automatisch ihren biologischen Ansatz; spätere Evidenz und Zulassungsstände sind nicht abgedeckt.","featured":false,"authors":["Niklas Huntemann","Leoni Rolfes","Marc Pawlitzki","Tobias Ruck","Steffen Pfeuffer","Heinz Wiendl","Sven G Meuth"],"authorAnchors":["pawlitzki"],"topics":["neuroimmunology"],"sourceUrls":["https://pubmed.ncbi.nlm.nih.gov/34086251/","https://doi.org/10.1007/s40265-021-01526-w"],"url":"https://pubmed.ncbi.nlm.nih.gov/34086251/"},{"id":"pmid-33711182","pmid":"33711182","title":"Predictors, outcome and characteristics of oropharyngeal dysphagia in idiopathic inflammatory myopathy","year":2021,"journal":"Muscle & nerve","date":"2021-06","doi":"10.1002/mus.27225","status":"published","onlineYear":2021,"onlineDate":"2021-03-24","journalAbbreviation":"Muscle Nerve","volume":"63","issue":"6","pages":"874-880","pmcid":null,"type":"Originalarbeit","scope":"Kooperation / klinische Forschung","summaryDe":"Eine retrospektive Auswertung von FEES-Videos bei 71 Menschen mit entzündlicher Myopathie fand vor allem pharyngeale Residuen als Schluckstörungsmuster. Die Dysphagieschwere war mit Pneumonien verbunden, die bei 24 Prozent auftraten; unabhängige Prädiktoren der Dysphagieschwere selbst wurden nicht gefunden.","evidenceNote":"Untersucht wurde eine klinisch ausgewählte Gruppe mit vorhandener Schluckendoskopie. Der entwickelte White-out-Score ist ein vorgeschlagenes Surrogat für pharyngeale Muskelkontraktion, keine direkt validierte Kraftmessung.","featured":false,"authors":["Bendix Labeit","Ksenia Perlova","Marc Pawlitzki","Tobias Ruck","Paul Muhle","Inga Claus","Sonja Suntrup-Krueger","Heinz Wiendl","Rainer Dziewas","Tobias Warnecke"],"authorAnchors":["pawlitzki"],"topics":["care","neuroimmunology"],"sourceUrls":["https://pubmed.ncbi.nlm.nih.gov/33711182/","https://doi.org/10.1002/mus.27225"],"url":"https://pubmed.ncbi.nlm.nih.gov/33711182/"},{"id":"pmid-34071155","pmid":"34071155","title":"Fc-Receptor Targeted Therapies for the Treatment of Myasthenia gravis","year":2021,"journal":"International journal of molecular sciences","date":"2021-05-28","doi":"10.3390/ijms22115755","status":"published","onlineYear":2021,"onlineDate":"2021-05-28","journalAbbreviation":"Int J Mol Sci","volume":"22","issue":"11","pages":"","pmcid":"PMC8198115","type":"Review","scope":"Kooperation / klinische Forschung","summaryDe":"Die Übersicht erläutert Fc-vermittelte Antikörperfunktionen bei Myasthenia gravis und Therapieansätze gegen Fc-Rezeptoren. Im Mittelpunkt stehen FcRn-gerichtete Wirkstoffe, ihre Wirkmechanismen und damaligen klinischen Ergebnisse sowie Perspektiven für klassische Fc-Rezeptoren.","evidenceNote":"Der Beitrag fasst den Entwicklungs- und Evidenzstand zum Publikationszeitpunkt zusammen. Ergebnisse anderer antikörpervermittelter Erkrankungen ersetzen keinen Wirksamkeitsnachweis bei Myasthenia gravis; aktuelle Zulassungen sind gesondert zu prüfen.","featured":false,"authors":["Christian W Keller","Marc Pawlitzki","Heinz Wiendl","Jan D Lünemann"],"authorAnchors":["pawlitzki"],"topics":["neuroimmunology"],"sourceUrls":["https://pubmed.ncbi.nlm.nih.gov/34071155/","https://doi.org/10.3390/ijms22115755"],"url":"https://pubmed.ncbi.nlm.nih.gov/34071155/"},{"id":"pmid-34108267","pmid":"34108267","title":"Pain, Depression, and Quality of Life in Neuromyelitis Optica Spectrum Disorder: A Cross-Sectional Study of 166 AQP4 Antibody-Seropositive Patients","year":2021,"journal":"Neurology(R) neuroimmunology & neuroinflammation","date":"2021-05","doi":"10.1212/NXI.0000000000000985","status":"published","onlineYear":2021,"onlineDate":"2021-04-20","journalAbbreviation":"Neurol Neuroimmunol Neuroinflamm","volume":"8","issue":"3","pages":"","pmcid":"PMC8058953","type":"Originalarbeit","scope":"Kooperation / klinische Forschung","summaryDe":"In einer Querschnittsbefragung an 13 Zentren berichteten 125 von 166 AQP4-Antikörper-positiven NMOSD-Betroffenen chronische Schmerzen. Schmerzstärke, depressive Symptome und Gehbeeinträchtigung waren mit schlechterer Lebensqualität verbunden; zahlreiche Betroffene erhielten keine spezifische medikamentöse Behandlung ihrer Beschwerden.","evidenceNote":"Fragebogenbasierte Beobachtung aus tertiären Zentren; die Prävalenzen sind nicht ohne Weiteres auf alle NMOSD-Betroffenen übertragbar. Erfasste depressive Symptome sind von einer eigenständigen psychiatrischen Diagnosestellung zu unterscheiden.","featured":false,"authors":["Ilya Ayzenberg","Daniel Richter","Eugenia Henke","Susanna Asseyer","Friedemann Paul","Corinna Trebst","Martin W Hümmert","Joachim Havla","Tania Kümpfel","Marius Ringelstein","Orhan Aktas","Brigitte Wildemann","Sven Jarius","Vivien Häußler","Jan-Patrick Stellmann","Makbule Senel","Luisa Klotz","Hannah L Pellkofer","Martin S Weber","Marc Pawlitzki","Paulus S Rommer","Achim Berthele","Klaus-Dieter Wernecke","Kerstin Hellwig","Ralf Gold","Ingo Kleiter","NEMOS (Neuromyelitis Optica Study Group)"],"authorAnchors":["pawlitzki"],"topics":["care","neuroimmunology"],"sourceUrls":["https://pubmed.ncbi.nlm.nih.gov/34108267/","https://doi.org/10.1212/NXI.0000000000000985"],"url":"https://pubmed.ncbi.nlm.nih.gov/34108267/"},{"id":"pmid-33837059","pmid":"33837059","title":"Skin Reactions in Patients With Multiple Sclerosis Receiving Cladribine Treatment","year":2021,"journal":"Neurology(R) neuroimmunology & neuroinflammation","date":"2021-05","doi":"10.1212/NXI.0000000000000990","status":"published","onlineYear":2021,"onlineDate":"2021-04-09","journalAbbreviation":"Neurol Neuroimmunol Neuroinflamm","volume":"8","issue":"3","pages":"","pmcid":"PMC8042777","type":"Originalarbeit","scope":"Kooperation / klinische Forschung","summaryDe":"In einer prospektiv erfassten Zwei-Zentren-Kohorte von 239 Cladribin-behandelten MS-Betroffenen wurden bei 77 Personen hautbezogene unerwünschte Ereignisse dokumentiert. Dazu gehörten Haarverdünnung, Ausschlag und Herpesinfektionen sowie einzelne verzögert aufgetretene autoimmune oder neoplastische Hautbefunde.","evidenceNote":"Beobachtungsstudie ohne unbehandelte Vergleichsgruppe. Die zeitliche Erfassung nach Cladribin erlaubt insbesondere bei seltenen Hautbefunden keine sichere Zuordnung jedes Ereignisses zur Therapie.","featured":false,"authors":["Leoni Rolfes","Steffen Pfeuffer","Jana Hackert","Marc Pawlitzki","Tobias Ruck","Wiebke Sondermann","Melanie Korsen","Heinz Wiendl","Sven G Meuth","Christoph Kleinschnitz","Refik Pul"],"authorAnchors":["pawlitzki"],"topics":["care","neuroimmunology"],"sourceUrls":["https://pubmed.ncbi.nlm.nih.gov/33837059/","https://doi.org/10.1212/NXI.0000000000000990"],"url":"https://pubmed.ncbi.nlm.nih.gov/33837059/"},{"id":"pmid-33423336","pmid":"33423336","title":"Pain, depression, and quality of life in adults with MOG-antibody-associated disease","year":2021,"journal":"European journal of neurology","date":"2021-05","doi":"10.1111/ene.14729","status":"published","onlineYear":2021,"onlineDate":"2021-02-11","journalAbbreviation":"Eur J Neurol","volume":"28","issue":"5","pages":"1645-1658","pmcid":null,"type":"Originalarbeit","scope":"Kooperation / klinische Forschung","summaryDe":"Eine Befragung von 43 Erwachsenen mit MOGAD erfasste bei 22 krankheitsbezogene Schmerzen und bei 18 depressive Symptome. Neuropathische Schmerzen gingen mit besonders starker Alltagsbeeinträchtigung einher; Schmerzen und Depression betrafen unterschiedliche Bereiche der gesundheitsbezogenen Lebensqualität.","evidenceNote":"Kleine registerbasierte Querschnittsstichprobe mit Selbstberichten und Depressionsfragebogen. Die Untersuchung prüft weder den Verlauf einzelner Beschwerden noch die Wirksamkeit symptomatischer Behandlungen.","featured":false,"authors":["Susanna Asseyer","Eugenia Henke","Corinna Trebst","Martin W Hümmert","Brigitte Wildemann","Sven Jarius","Marius Ringelstein","Orhan Aktas","Marc Pawlitzki","Melanie Korsen","Luisa Klotz","Nadja Siebert","Klemens Ruprecht","Judith Bellmann-Strobl","Klaus-Dieter Wernecke","Vivien Häußler","Joachim Havla","Anna Gahlen","Ralf Gold","Friedemann Paul","Ingo Kleiter","Ilya Ayzenberg","Neuromyelitis Optica Study Group"],"authorAnchors":["pawlitzki"],"topics":["care","neuroimmunology"],"sourceUrls":["https://pubmed.ncbi.nlm.nih.gov/33423336/","https://doi.org/10.1111/ene.14729"],"url":"https://pubmed.ncbi.nlm.nih.gov/33423336/"},{"id":"pmid-33338309","pmid":"33338309","title":"Dysphagia in neuromyelitis optica spectrum disorder and myelin oligodendrocyte glycoprotein antibody disease as a surrogate of brain involvement?","year":2021,"journal":"European journal of neurology","date":"2021-05","doi":"10.1111/ene.14691","status":"published","onlineYear":2021,"onlineDate":"2021-01-12","journalAbbreviation":"Eur J Neurol","volume":"28","issue":"5","pages":"1765-1770","pmcid":null,"type":"Originalarbeit","scope":"Kooperation / klinische Forschung","summaryDe":"Bei 13 Menschen mit NMOSD oder MOGAD wurden klinisch erhobene Schluckendoskopien retrospektiv ausgewertet. Acht zeigten eine oropharyngeale Dysphagie, darunter sechs ohne andere klinische Hinweise auf eine Hirnbeteiligung; stärkere Dysphagie war mit höherer Behinderung und Pneumonien verbunden.","evidenceNote":"Sehr kleine, durch die klinische Indikation zur FEES ausgewählte Kohorte. Eine Schluckstörung ist hier kein validierter spezifischer Nachweis einer subklinischen Hirnbeteiligung und die Häufigkeit keine Populationsprävalenz.","featured":false,"authors":["Marc Pawlitzki","Sigrid Ahring","Leoni Rolfes","Rainer Dziewas","Tobias Warnecke","Sonja Suntrup-Krueger","Heinz Wiendl","Luisa Klotz","Sven G Meuth","Bendix Labeit"],"authorAnchors":["pawlitzki"],"topics":["care","neuroimmunology"],"sourceUrls":["https://pubmed.ncbi.nlm.nih.gov/33338309/","https://doi.org/10.1111/ene.14691"],"url":"https://pubmed.ncbi.nlm.nih.gov/33338309/"},{"id":"pmid-33230897","pmid":"33230897","title":"Patients with a relapsing course of steroid-responsive encephalopathy associated with autoimmune thyroiditis exhibit persistent intrathecal CD4+ T-cell activation","year":2021,"journal":"European journal of neurology","date":"2021-04","doi":"10.1111/ene.14657","status":"published","onlineYear":2020,"onlineDate":"2020-12-17","journalAbbreviation":"Eur J Neurol","volume":"28","issue":"4","pages":"1284-1291","pmcid":null,"type":"Originalarbeit","scope":"Kooperation / klinische Forschung","summaryDe":"In einer retrospektiven SREAT-Kohorte mit 22 Personen wurden 14 monophasische und acht rezidivierende Verläufe verglichen. Routinelabor und Ausgangsmerkmale unterschieden die Gruppen nicht; bei rezidivierenden Verläufen blieb nach Schubtherapie eine intrathekale Aktivierung von CD4-T-Zellen nachweisbar.","evidenceNote":"Kleine lokale Kohorte und explorativer Biomarkerbefund ohne externe Prognosevalidierung. Die Arbeit lässt offen, ob die beobachteten Verlaufsgruppen dasselbe Krankheitsspektrum oder unterschiedliche Erkrankungen abbilden.","featured":false,"authors":["Steffen Pfeuffer","Tobias Ruck","Leoni Rolfes","Matthias Pawlowski","Marc Pawlitzki","Heinz Wiendl","Stjepana Kovac","Sven G Meuth"],"authorAnchors":["pawlitzki"],"topics":["biomarkers","neuroimmunology"],"sourceUrls":["https://pubmed.ncbi.nlm.nih.gov/33230897/","https://doi.org/10.1111/ene.14657"],"url":"https://pubmed.ncbi.nlm.nih.gov/33230897/"},{"id":"pmid-33810342","pmid":"33810342","title":"Structure-Function Relationship of Retinal Ganglion Cells in Multiple Sclerosis","year":2021,"journal":"International journal of molecular sciences","date":"2021-03-26","doi":"10.3390/ijms22073419","status":"published","onlineYear":2021,"onlineDate":"2021-03-26","journalAbbreviation":"Int J Mol Sci","volume":"22","issue":"7","pages":"","pmcid":"PMC8037992","type":"Originalarbeit","scope":"Kooperation / klinische Forschung","summaryDe":"Bei 23 MS-Betroffenen mit oder ohne frühere Optikusneuritis und 14 Kontrollen wurden multifokale Elektroretinografie und OCT kombiniert. Die foveale N2-Amplitude war in beiden MS-Gruppen vermindert; weitere strukturelle und funktionelle Veränderungen unterschieden sich je nach Optikusneuritis-Anamnese.","evidenceNote":"Kleine Querschnittsstudie mit regionalen retinalen Messungen. Sie beschreibt Gruppenunterschiede, aber keinen zeitlichen Nachweis fortschreitender Degeneration oder individuellen Verlaufstest.","featured":false,"authors":["Khaldoon O Al-Nosairy","Marc Horbrügger","Sven Schippling","Markus Wagner","Aiden Haghikia","Marc Pawlitzki","Michael B Hoffmann"],"authorAnchors":["pawlitzki"],"topics":["biomarkers","neuroimmunology"],"sourceUrls":["https://pubmed.ncbi.nlm.nih.gov/33810342/","https://doi.org/10.3390/ijms22073419"],"url":"https://pubmed.ncbi.nlm.nih.gov/33810342/"},{"id":"pmid-33747129","pmid":"33747129","title":"Teriflunomide treatment is associated with optic nerve recovery in early multiple sclerosis","year":2021,"journal":"Therapeutic advances in neurological disorders","date":"2021","doi":"10.1177/1756286421997372","status":"published","onlineYear":2021,"onlineDate":"2021-03-06","journalAbbreviation":"Ther Adv Neurol Disord","volume":"14","issue":"","pages":"1756286421997372","pmcid":"PMC7940774","type":"Originalarbeit","scope":"Kooperation / klinische Forschung","summaryDe":"Bei 79 Menschen mit Optikusneuritis als erster MS-Manifestation wurden zwölfmonatige Verläufe unter Teriflunomid, Interferon beta oder Glatirameracetat verglichen. Teriflunomid war mit günstigeren funktionellen Sehnervbefunden verbunden; nach Schüben außerhalb des Sehnervs zeigte eine zusätzliche Kohorte keinen Unterschied in der bestätigten Behinderungsbesserung.","evidenceNote":"Nicht randomisierter Therapievergleich mit möglicher Restkonfundierung trotz statistischer Anpassung. Die funktionellen Sehnervbefunde belegen weder einen gesicherten neuroprotektiven Mechanismus noch einen allgemeinen Vorteil bei der Schuberholung.","featured":false,"authors":["Steffen Pfeuffer","Laura Kerschke","Tobias Ruck","Leoni Rolfes","Marc Pawlitzki","Philipp Albrecht","Heinz Wiendl","Sven G Meuth"],"authorAnchors":["pawlitzki"],"topics":["biomarkers","neuroimmunology"],"sourceUrls":["https://pubmed.ncbi.nlm.nih.gov/33747129/","https://doi.org/10.1177/1756286421997372"],"url":"https://pubmed.ncbi.nlm.nih.gov/33747129/"},{"id":"pmid-33486002","pmid":"33486002","title":"Neutrophil granulocytes promote flow stagnation due to dynamic capillary stalls following experimental stroke","year":2021,"journal":"Brain, behavior, and immunity","date":"2021-03","doi":"10.1016/j.bbi.2021.01.011","status":"published","onlineYear":2021,"onlineDate":"2021-01-22","journalAbbreviation":"Brain Behav Immun","volume":"93","issue":"","pages":"322-330","pmcid":null,"type":"Originalarbeit","scope":"Grundlagen / frühe Arbeiten","summaryDe":"In zwei Mausmodellen eines permanenten Schlaganfalls wurden mit intravitaler Zwei-Photonen-Mikroskopie wiederkehrende kapilläre Flussunterbrechungen beobachtet. Eine spezifische Markierung der Neutrophilen erlaubte, diese dynamischen Gefäßverschlüsse den neutrophilen Granulozyten zuzuordnen.","evidenceNote":"Präklinische Befunde aus photothrombotischem Schlaganfall und permanentem Verschluss der mittleren Hirnarterie bei Mäusen. Die Untersuchung prüft keine therapeutische Intervention oder klinische Wirksamkeit beim Menschen.","featured":false,"authors":["Leoni Rolfes","Monika Riek-Burchardt","Marc Pawlitzki","Jens Minnerup","Stefanie Bock","Mariella Schmidt","Sven G Meuth","Matthias Gunzer","Jens Neumann"],"authorAnchors":["pawlitzki"],"topics":["neuroimmunology"],"sourceUrls":["https://pubmed.ncbi.nlm.nih.gov/33486002/","https://doi.org/10.1016/j.bbi.2021.01.011"],"url":"https://pubmed.ncbi.nlm.nih.gov/33486002/"},{"id":"pmid-33618681","pmid":"33618681","title":"Intravenous methadone causes acute toxic and delayed inflammatory encephalopathy with persistent neurocognitive impairments","year":2021,"journal":"BMC neurology","date":"2021-02-22","doi":"10.1186/s12883-021-02108-9","status":"published","onlineYear":2021,"onlineDate":"2021-02-22","journalAbbreviation":"BMC Neurol","volume":"21","issue":"1","pages":"85","pmcid":"PMC7898738","type":"Fallbericht","scope":"Kooperation / klinische Forschung","summaryDe":"Der Fallbericht beschreibt nach intravenösem Methadonmissbrauch zunächst Hörverlust, Ataxie und Paraparese, gefolgt von verzögerter Enzephalopathie und anhaltenden neurokognitiven Einschränkungen. Begleitende MRT- und Liquorbefunde führten zur Hypothese einer anfänglich toxischen und später entzündlichen ZNS-Schädigung.","evidenceNote":"Einzelfall mit zeitlicher Abfolge von Exposition und Befunden. Ein zweiphasiger Schädigungsmechanismus und das Risiko bei anderen Anwendungsformen von Methadon lassen sich daraus nicht sichern.","featured":false,"authors":["Jonathan Repple","Svea Haessner","Andreas Johnen","Nils C Landmeyer","Andreas Schulte-Mecklenbeck","Marc Pawlitzki","Heinz Wiendl","Gerd Meyer Zu Hörste"],"authorAnchors":["pawlitzki"],"topics":["neuroimmunology"],"sourceUrls":["https://pubmed.ncbi.nlm.nih.gov/33618681/","https://doi.org/10.1186/s12883-021-02108-9"],"url":"https://pubmed.ncbi.nlm.nih.gov/33618681/"},{"id":"pmid-33283160","pmid":"33283160","title":"\"Neurological manifestations of COVID-19\" - guideline of the German society of neurology","year":2020,"journal":"Neurological research and practice","date":"2020","doi":"10.1186/s42466-020-00097-7","status":"published","onlineYear":2020,"onlineDate":"2020-12-02","journalAbbreviation":"Neurol Res Pract","volume":"2","issue":"","pages":"51","pmcid":"PMC7708894","type":"Leitlinie / Konsensus","scope":"Grundlagen / frühe Arbeiten","summaryDe":"Der Beitrag fasst die im Oktober 2020 veröffentlichte S1-Leitlinie der Deutschen Gesellschaft für Neurologie zu neurologischen Manifestationen von COVID-19 zusammen. Er behandelt unter anderem Enzephalopathie, Schlaganfall, Riechstörungen und neuromuskuläre Erkrankungen sowie die Versorgung neurologisch Erkrankter während der Pandemie.","evidenceNote":"Abgekürzte historische S1-Leitlinie aus der frühen Pandemiephase. Die Empfehlungen spiegeln den damaligen Wissensstand wider und ersetzen keine Prüfung aktueller Leitlinien.","featured":false,"authors":["Peter Berlit","Julian Bösel","Georg Gahn","Stefan Isenmann","Sven G Meuth","Christian H Nolte","Marc Pawlitzki","Felix Rosenow","Benedikt Schoser","Götz Thomalla","Thomas Hummel"],"authorAnchors":["pawlitzki"],"topics":["care"],"sourceUrls":["https://pubmed.ncbi.nlm.nih.gov/33283160/","https://doi.org/10.1186/s42466-020-00097-7"],"url":"https://pubmed.ncbi.nlm.nih.gov/33283160/"},{"id":"pmid-32785877","pmid":"32785877","title":"Failed, Interrupted, or Inconclusive Trials on Immunomodulatory Treatment Strategies in Multiple Sclerosis: Update 2015-2020","year":2020,"journal":"BioDrugs : clinical immunotherapeutics, biopharmaceuticals and gene therapy","date":"2020-10","doi":"10.1007/s40259-020-00435-w","status":"published","onlineYear":null,"onlineDate":null,"journalAbbreviation":"BioDrugs","volume":"34","issue":"5","pages":"587-610","pmcid":"PMC7519896","type":"Review","scope":"Grundlagen / frühe Arbeiten","summaryDe":"Die Übersicht untersucht seit 2015 gescheiterte, abgebrochene oder nicht eindeutige Studien zu immunmodulatorischen MS-Therapien. Sie diskutiert mögliche Ursachen entlang der Entwicklung vom Tiermodell zur klinischen Studie und deren Bedeutung für Krankheitsmodelle und künftige Studienplanung.","evidenceNote":"Die Auswahl konzentriert sich auf nicht erfolgreiche antiinflammatorische Entwicklungsprogramme bis 2020 und schließt etablierte wirksame Therapien aus. Sie ist daher kein Gesamtvergleich verfügbarer MS-Behandlungen.","featured":false,"authors":["Leoni Rolfes","Marc Pawlitzki","Steffen Pfeuffer","Niklas Huntemann","Heinz Wiendl","Tobias Ruck","Sven G Meuth"],"authorAnchors":["pawlitzki"],"topics":["neuroimmunology"],"sourceUrls":["https://pubmed.ncbi.nlm.nih.gov/32785877/","https://doi.org/10.1007/s40259-020-00435-w"],"url":"https://pubmed.ncbi.nlm.nih.gov/32785877/"},{"id":"pmid-32650400","pmid":"32650400","title":"The Impact of Dysphagia in Myositis: A Systematic Review and Meta-Analysis","year":2020,"journal":"Journal of clinical medicine","date":"2020-07-08","doi":"10.3390/jcm9072150","status":"published","onlineYear":2020,"onlineDate":"2020-07-08","journalAbbreviation":"J Clin Med","volume":"9","issue":"7","pages":"","pmcid":"PMC7408750","type":"Review","scope":"Grundlagen / frühe Arbeiten","summaryDe":"Der systematische Review umfasst 234 Studien zur Dysphagie bei entzündlichen Myopathien; 116 Studien mit 10.382 Personen gingen in die Prävalenz-Metaanalyse ein. Die gepoolte Häufigkeit betrug 36 Prozent insgesamt und 56 Prozent bei Einschlusskörpermyositis; zusätzlich werden Mechanismen, Komplikationen und berichtete Behandlungsansätze beschrieben.","evidenceNote":"Die gepoolten Prävalenzen beruhen auf heterogenen Studien und unterschiedlichen Untersuchungsmethoden. Die Zusammenstellung berichteter Therapien liefert keinen randomisierten Wirksamkeitsvergleich dieser Ansätze.","featured":false,"authors":["Bendix Labeit","Marc Pawlitzki","Tobias Ruck","Paul Muhle","Inga Claus","Sonja Suntrup-Krueger","Tobias Warnecke","Sven G Meuth","Heinz Wiendl","Rainer Dziewas"],"authorAnchors":["pawlitzki"],"topics":["care","neuroimmunology"],"sourceUrls":["https://pubmed.ncbi.nlm.nih.gov/32650400/","https://doi.org/10.3390/jcm9072150"],"url":"https://pubmed.ncbi.nlm.nih.gov/32650400/"},{"id":"pmid-32535547","pmid":"32535547","title":"Merits and culprits of immunotherapies for neurological diseases in times of COVID-19","year":2020,"journal":"EBioMedicine","date":"2020-06","doi":"10.1016/j.ebiom.2020.102822","status":"published","onlineYear":2020,"onlineDate":"2020-06-11","journalAbbreviation":"EBioMedicine","volume":"56","issue":"","pages":"102822","pmcid":"PMC7286830","type":"Review","scope":"Grundlagen / frühe Arbeiten","summaryDe":"Die Übersicht ordnet Nutzen und Risiken neurologischer Immuntherapien im Kontext der frühen COVID-19-Pandemie ein. Sie diskutiert damalige Empfehlungen zum Beginn oder Fortführen der Behandlung sowie mögliche immuntherapeutische Ansätze gegen COVID-19.","evidenceNote":"Zeitgebundene Übersicht aus dem Jahr 2020 bei damals begrenzter Evidenz und teils unterschiedlichen Fachgesellschaftsempfehlungen. Sie bildet spätere Impf-, Varianten- und Therapiedaten nicht ab.","featured":false,"authors":["Marc Pawlitzki","Uwe K Zettl","Tobias Ruck","Leoni Rolfes","Hans-Peter Hartung","Sven G Meuth"],"authorAnchors":["pawlitzki"],"topics":["care","neuroimmunology"],"sourceUrls":["https://pubmed.ncbi.nlm.nih.gov/32535547/","https://doi.org/10.1016/j.ebiom.2020.102822"],"url":"https://pubmed.ncbi.nlm.nih.gov/32535547/"},{"id":"pmid-32423153","pmid":"32423153","title":"Clinical, Radiological, and Laboratory Features of Spinal Cord Involvement in Primary Sjögren's Syndrome","year":2020,"journal":"Journal of clinical medicine","date":"2020-05-14","doi":"10.3390/jcm9051482","status":"published","onlineYear":2020,"onlineDate":"2020-05-14","journalAbbreviation":"J Clin Med","volume":"9","issue":"5","pages":"","pmcid":"PMC7290729","type":"Fallbericht","scope":"Grundlagen / frühe Arbeiten","summaryDe":"Eine retrospektive Multizenter-Fallserie beschreibt vier Myelitiden bei primärem Sjögren-Syndrom mit langstreckigen zervikalen MRT-Läsionen. Liquor-NfL war gegenüber 15 Kontrollen erhöht; besonders hohe Werte und intrathekale SSA-Antikörperproduktion wurden bei rezidivierenden beziehungsweise therapieresistenten Verläufen beobachtet.","evidenceNote":"Vier Fälle erlauben keine verlässliche Bestimmung von Prognoseleistung oder diagnostischen Grenzwerten. Liquor-NfL und SSA-Antikörperproduktion bleiben hier Biomarkerkandidaten, keine validierte Grundlage individueller Therapieentscheidungen.","featured":false,"authors":["Michaela Butryn","Jens Neumann","Leoni Rolfes","Claudius Bartels","Mike P Wattjes","Nima Mahmoudi","Tabea Seeliger","Franz F Konen","Thea Thiele","Torsten Witte","Sven G Meuth","Thomas Skripuletz","Marc Pawlitzki"],"authorAnchors":["pawlitzki"],"topics":["biomarkers","neuroimmunology"],"sourceUrls":["https://pubmed.ncbi.nlm.nih.gov/32423153/","https://doi.org/10.3390/jcm9051482"],"url":"https://pubmed.ncbi.nlm.nih.gov/32423153/"},{"id":"pmid-32192056","pmid":"32192056","title":"Generation of a Model to Predict Differentiation and Migration of Lymphocyte Subsets under Homeostatic and CNS Autoinflammatory Conditions","year":2020,"journal":"International journal of molecular sciences","date":"2020-03-17","doi":"10.3390/ijms21062046","status":"published","onlineYear":2020,"onlineDate":"2020-03-17","journalAbbreviation":"Int J Mol Sci","volume":"21","issue":"6","pages":"","pmcid":"PMC7139518","type":"Originalarbeit","scope":"Grundlagen / frühe Arbeiten","summaryDe":"Die Arbeit entwickelt ein probabilistisches Modell für Verteilung, Differenzierung und Migration von Lymphozyten zwischen Blut und Liquor. Das Modell bildet erhobene Daten unter physiologischen und neuroinflammatorischen Bedingungen nach und simuliert qualitative Veränderungen unter Immuntherapien.","evidenceNote":"Die Modellgüte bei den untersuchten Daten belegt noch nicht, dass Liquormessungen in der klinischen Versorgung entfallen können. Prospektive individuelle Vorhersagen und Behandlungsergebnisse werden im Abstract nicht validiert.","featured":false,"authors":["Catharina C Gross","Marc Pawlitzki","Andreas Schulte-Mecklenbeck","Leoni Rolfes","Tobias Ruck","Petra Hundehege","Heinz Wiendl","Michael Herty","Sven G Meuth"],"authorAnchors":["pawlitzki"],"topics":["biomarkers","neuroimmunology"],"sourceUrls":["https://pubmed.ncbi.nlm.nih.gov/32192056/","https://doi.org/10.3390/ijms21062046"],"url":"https://pubmed.ncbi.nlm.nih.gov/32192056/"},{"id":"pmid-32224498","pmid":"32224498","title":"MS optic neuritis-induced long-term structural changes within the visual pathway","year":2020,"journal":"Neurology(R) neuroimmunology & neuroinflammation","date":"2020-03-05","doi":"10.1212/NXI.0000000000000665","status":"published","onlineYear":2020,"onlineDate":"2020-01-22","journalAbbreviation":"Neurol Neuroimmunol Neuroinflamm","volume":"7","issue":"2","pages":"","pmcid":"PMC7057062","type":"Originalarbeit","scope":"Grundlagen / frühe Arbeiten","summaryDe":"Bei 28 MS-Betroffenen wurden OCT, visuell evozierte Potenziale und MRT-Maße abhängig von einer früheren einzelnen Optikusneuritis verglichen. Im Mittel gut acht Jahre nach der Optikusneuritis zeigten Betroffene dünnere retinale Schichten und veränderte Diffusionsparameter der Sehstrahlung, während globale Gewebevolumina die Gruppen nicht unterschieden.","evidenceNote":"Kleiner Gruppenvergleich nach zurückliegendem Ereignis ohne individuelle Bildgebung vor der Optikusneuritis. Die Befunde sind mit transsynaptischer Schädigung vereinbar, belegen aber deren zeitlichen Ablauf und Richtung nicht direkt.","featured":false,"authors":["Marc Pawlitzki","Marc Horbrügger","Kristian Loewe","Jörn Kaufmann","Roland Opfer","Markus Wagner","Khaldoon O Al-Nosairy","Sven G Meuth","Michael B Hoffmann","Sven Schippling"],"authorAnchors":["pawlitzki"],"topics":["biomarkers","neuroimmunology"],"sourceUrls":["https://pubmed.ncbi.nlm.nih.gov/32224498/","https://doi.org/10.1212/NXI.0000000000000665"],"url":"https://pubmed.ncbi.nlm.nih.gov/32224498/"},{"id":"pmid-32172994","pmid":"32172994","title":"Transient MOG antibody seroconversion associated with immunomodulating therapy","year":2020,"journal":"Multiple sclerosis and related disorders","date":"2020-01","doi":"10.1016/j.msard.2019.101420","status":"published","onlineYear":2019,"onlineDate":"2019-09-28","journalAbbreviation":"Mult Scler Relat Disord","volume":"37","issue":"","pages":"101420","pmcid":null,"type":"Fallbericht","scope":"Grundlagen / frühe Arbeiten","summaryDe":"Der Fallbericht beschreibt eine zunächst in drei Tests MOG-IgG-negative Person mit Hirnstammenzephalitis und Optikusneuritis, die unter Interferon beta seropositiv wurde. Nach dem Wechsel auf Glatirameracetat nahmen die MOG-Antikörperspiegel wieder ab.","evidenceNote":"Ein einzelner zeitlicher Verlauf belegt nicht, dass Interferon beta die Serokonversion verursacht hat oder Glatirameracetat MOG-Antikörper gezielt senkt. Der Bericht liefert keine allgemeine Therapieempfehlung für MOGAD.","featured":false,"authors":["Marc Pawlitzki","Christin Campe","Leoni Rolfes","Hans-Jochen Heinze","Frank Leypoldt","Klaus-Peter Wandinger","Markus Reindl","Brigitte Wildemann","Sven Jarius","Peter Körtvelyessy"],"authorAnchors":["pawlitzki"],"topics":["biomarkers","neuroimmunology"],"sourceUrls":["https://pubmed.ncbi.nlm.nih.gov/32172994/","https://doi.org/10.1016/j.msard.2019.101420"],"url":"https://pubmed.ncbi.nlm.nih.gov/32172994/"},{"id":"pmid-31852955","pmid":"31852955","title":"CD8+ T cell-mediated endotheliopathy is a targetable mechanism of neuro-inflammation in Susac syndrome","year":2019,"journal":"Nature communications","date":"2019-12-18","doi":"10.1038/s41467-019-13593-5","status":"published","onlineYear":2019,"onlineDate":"2019-12-18","journalAbbreviation":"Nat Commun","volume":"10","issue":"1","pages":"5779","pmcid":"PMC6920411","type":"Originalarbeit","scope":"Grundlagen / frühe Arbeiten","summaryDe":"Die Arbeit verknüpft Immunprofile und Neuropathologie beim Susac-Syndrom mit einem transgenen Mausmodell und beschreibt aktivierte zytotoxische CD8-T-Zellen an ZNS-Mikrogefäßen. Eine Blockade der T-Zell-Adhäsion besserte das präklinische Krankheitsbild; ergänzend werden vier unter Natalizumab und weiteren Therapien gebesserte Patientenverläufe berichtet.","evidenceNote":"Die mechanistische Evidenz umfasst experimentelle Modelle und humane Befunde. Bei den vier behandelten Personen verhindern fehlende Kontrollen und zusätzliche Therapien die isolierte Bewertung der Natalizumab-Wirkung.","featured":false,"authors":["Catharina C Gross","Céline Meyer","Urvashi Bhatia","Lidia Yshii","Ilka Kleffner","Jan Bauer","Anna R Tröscher","Andreas Schulte-Mecklenbeck","Sebastian Herich","Tilman Schneider-Hohendorf","Henrike Plate","Tanja Kuhlmann","Markus Schwaninger","Wolfgang Brück","Marc Pawlitzki","David-Axel Laplaud","Delphine Loussouarn","John Parratt","Michael Barnett","Michael E Buckland","Todd A Hardy","Stephen W Reddel","Marius Ringelstein","Jan Dörr","Brigitte Wildemann","Markus Kraemer","Hans Lassmann","Romana Höftberger","Eduardo Beltrán","Klaus Dornmair","Nicholas Schwab","Luisa Klotz","Sven G Meuth","Guillaume Martin-Blondel","Heinz Wiendl","Roland Liblau"],"authorAnchors":["pawlitzki"],"topics":["neuroimmunology","biomarkers"],"sourceUrls":["https://pubmed.ncbi.nlm.nih.gov/31852955/","https://doi.org/10.1038/s41467-019-13593-5"],"url":"https://pubmed.ncbi.nlm.nih.gov/31852955/"},{"id":"pmid-31795084","pmid":"31795084","title":"Fulminant MS Reactivation Following Combined Fingolimod Cessation and Yellow Fever Vaccination","year":2019,"journal":"International journal of molecular sciences","date":"2019-11-28","doi":"10.3390/ijms20235985","status":"published","onlineYear":2019,"onlineDate":"2019-11-28","journalAbbreviation":"Int J Mol Sci","volume":"20","issue":"23","pages":"","pmcid":"PMC6929059","type":"Fallbericht","scope":"Grundlagen / frühe Arbeiten","summaryDe":"Der Fallbericht beschreibt schwere erneute MS-Aktivität nach Fingolimod-Absetzen und anschließender Gelbfieberimpfung. Klinische, MRT- und Immunbefunde besserten sich im weiteren Verlauf unter Natalizumab.","evidenceNote":"Mehrere zeitlich zusammenfallende Einflüsse in einem Einzelfall lassen den jeweiligen Beitrag von Therapieende, Impfung und vorbestehender Krankheitsaktivität offen. Der Bericht beziffert kein allgemeines Impf- oder Reboundrisiko.","featured":false,"authors":["Leoni Rolfes","Marc Pawlitzki","Steffen Pfeuffer","Christian Thomas","Jonas Schmidt-Chanasit","Catharina C Gross","Andreas Schulte-Mecklenbeck","Heinz Wiendl","Sven G Meuth","Oliver M Grauer","Tobias Ruck"],"authorAnchors":["pawlitzki"],"topics":["care","neuroimmunology"],"sourceUrls":["https://pubmed.ncbi.nlm.nih.gov/31795084/","https://doi.org/10.3390/ijms20235985"],"url":"https://pubmed.ncbi.nlm.nih.gov/31795084/"},{"id":"pmid-31597692","pmid":"31597692","title":"Ineffective treatment of PML with pembrolizumab: Exhausted memory T-cell subsets as a clue?","year":2019,"journal":"Neurology(R) neuroimmunology & neuroinflammation","date":"2019-11","doi":"10.1212/NXI.0000000000000627","status":"published","onlineYear":2019,"onlineDate":"2019-10-09","journalAbbreviation":"Neurol Neuroimmunol Neuroinflamm","volume":"6","issue":"6","pages":"e627","pmcid":"PMC6812729","type":"Fallbericht","scope":"Grundlagen / frühe Arbeiten","summaryDe":"Der als Fallbericht indexierte Beitrag behandelt laut Titel eine nicht erfolgreiche Pembrolizumab-Behandlung der progressiven multifokalen Leukenzephalopathie und diskutiert erschöpfte Gedächtnis-T-Zell-Untergruppen als möglichen Erklärungsansatz.","evidenceNote":"Im bereitgestellten PubMed-Datensatz fehlt ein Abstract. Die Einordnung beschränkt sich auf Titel und Publikationsformat; Verlauf, Messwerte und der vorgeschlagene Mechanismus sind daraus nicht beurteilbar.","featured":false,"authors":["Marc Pawlitzki","Tilman Schneider-Hohendorf","Leoni Rolfes","Sven G Meuth","Heinz Wiendl","Nicholas Schwab","Oliver M Grauer"],"authorAnchors":["pawlitzki"],"topics":["neuroimmunology"],"sourceUrls":["https://pubmed.ncbi.nlm.nih.gov/31597692/","https://doi.org/10.1212/NXI.0000000000000627"],"url":"https://pubmed.ncbi.nlm.nih.gov/31597692/"},{"id":"pmid-31590282","pmid":"31590282","title":"Therapeutic Apheresis in Acute Relapsing Multiple Sclerosis: Current Evidence and Unmet Needs-A Systematic Review","year":2019,"journal":"Journal of clinical medicine","date":"2019-10-04","doi":"10.3390/jcm8101623","status":"published","onlineYear":2019,"onlineDate":"2019-10-04","journalAbbreviation":"J Clin Med","volume":"8","issue":"10","pages":"","pmcid":"PMC6832170","type":"Review","scope":"Grundlagen / frühe Arbeiten","summaryDe":"Der systematische Review fasst Plasmaaustausch und Immunadsorption bei akuten MS-Schüben mit unzureichendem Ansprechen auf Kortikosteroide zusammen. Er behandelt die damalige Evidenz, mögliche Ansprechprädiktoren, technische Verfahren sowie die Anwendung im Kindesalter und während der Schwangerschaft.","evidenceNote":"Die zugrunde liegende Evidenz bestand überwiegend aus Fallserien und kleinen, teils unverblindeten oder nicht randomisierten Studien; für Immunadsorption war sie besonders begrenzt. Hinweise auf vergleichbare Wirksamkeit ersetzen keinen belastbaren Gleichwertigkeitsnachweis.","featured":false,"authors":["Leoni Rolfes","Steffen Pfeuffer","Tobias Ruck","Nico Melzer","Marc Pawlitzki","Michael Heming","Marcus Brand","Heinz Wiendl","Sven G Meuth"],"authorAnchors":["pawlitzki"],"topics":["care","neuroimmunology"],"sourceUrls":["https://pubmed.ncbi.nlm.nih.gov/31590282/","https://doi.org/10.3390/jcm8101623"],"url":"https://pubmed.ncbi.nlm.nih.gov/31590282/"},{"id":"pmid-30657420","pmid":"30657420","title":"Severe meningo-/encephalitis after daclizumab therapy for multiple sclerosis","year":2019,"journal":"Multiple sclerosis (Houndmills, Basingstoke, England)","date":"2019-10","doi":"10.1177/1352458518819098","status":"published","onlineYear":2019,"onlineDate":"2019-01-18","journalAbbreviation":"Mult Scler","volume":"25","issue":"12","pages":"1618-1632","pmcid":null,"type":"Originalarbeit","scope":"Grundlagen / frühe Arbeiten","summaryDe":"Die retrospektive Arbeit beschreibt sieben schwere Meningoenzephalitiden nach Daclizumab-Therapie bei MS, häufig mit systemischen Symptomen und DRESS-Merkmalen. Viele Betroffene sprachen unzureichend auf die Behandlung an; zwei starben.","evidenceNote":"Ausgewählte schwere Fälle ohne Nenner aller exponierten Personen erlauben keine Häufigkeitsschätzung. Die Untersuchung dokumentiert ein historisches Sicherheitssignal im Zusammenhang mit der 2018 ausgesetzten Zulassung.","featured":false,"authors":["Lidia Stork","Wolfgang Brück","Phillip von Gottberg","Ulrich Pulkowski","Florian Kirsten","Markus Glatzel","Sebastian Rauer","Franziska Scheibe","Helena Radbruch","Eckhard Hammer","Klarissa H Stürner","Barbara Kaulen","Christoph Heesen","Frank Hoffmann","Sebastian Brock","Marc Pawlitzki","Tobias Bopp","Imke Metz"],"authorAnchors":["pawlitzki"],"topics":["care","neuroimmunology"],"sourceUrls":["https://pubmed.ncbi.nlm.nih.gov/30657420/","https://doi.org/10.1177/1352458518819098"],"url":"https://pubmed.ncbi.nlm.nih.gov/30657420/"},{"id":"pmid-31211179","pmid":"31211179","title":"CSF Neurofilament light chain level predicts axonal damage in cerebral vasculitis","year":2019,"journal":"Annals of clinical and translational neurology","date":"2019-06","doi":"10.1002/acn3.790","status":"published","onlineYear":2019,"onlineDate":"2019-06-03","journalAbbreviation":"Ann Clin Transl Neurol","volume":"6","issue":"6","pages":"1134-1137","pmcid":"PMC6562033","type":"Fallbericht","scope":"Grundlagen / frühe Arbeiten","summaryDe":"Bei einer Person mit schwer rezidivierender primärer ZNS-Angiitis wurden Liquor-NfL-Werte über mehrere Zeitpunkte nachträglich bestimmt. Ein deutlicher NfL-Anstieg ging den in MRT und Angiografie sichtbaren neuroaxonalen beziehungsweise arteriellen Veränderungen voraus.","evidenceNote":"Der zeitliche Biomarkerbefund stammt aus einem Einzelfall. Er validiert weder eine diagnostische Schwelle noch die individuelle Vorhersageleistung von NfL bei ZNS-Vaskulitis.","featured":false,"authors":["Marc Pawlitzki","Michaela Butryn","Florian Kirchner","Jacqueline Färber","Oliver Beuing","Jens Minnerup","Sven G Meuth","Jens Neumann"],"authorAnchors":["pawlitzki"],"topics":["biomarkers","neuroimmunology"],"sourceUrls":["https://pubmed.ncbi.nlm.nih.gov/31211179/","https://doi.org/10.1002/acn3.790"],"url":"https://pubmed.ncbi.nlm.nih.gov/31211179/"},{"id":"pmid-30950232","pmid":"30950232","title":"Aggressive spinal cord involvement in granulomatosis with polyangiitis","year":2019,"journal":"International journal of rheumatic diseases","date":"2019-04","doi":"10.1111/1756-185X.13561","status":"published","onlineYear":2019,"onlineDate":"2019-04-04","journalAbbreviation":"Int J Rheum Dis","volume":"22","issue":"4","pages":"756-758","pmcid":null,"type":"Fallbericht","scope":"Grundlagen / frühe Arbeiten","summaryDe":"Der als Fallbericht und Letter indexierte Beitrag beschreibt laut Titel eine aggressive Rückenmarkbeteiligung bei Granulomatose mit Polyangiitis.","evidenceNote":"Der bereitgestellte PubMed-Eintrag enthält keinen Abstract. Klinischer Verlauf, Behandlung und Ausgang werden deshalb nicht aus dem Titel ergänzt.","featured":false,"authors":["Marc Pawlitzki","Valentina Perosa","Melanie Korsen","Christian Mawrin","Claudius Bartels","Tessa Huchtemann"],"authorAnchors":["pawlitzki"],"topics":["neuroimmunology"],"sourceUrls":["https://pubmed.ncbi.nlm.nih.gov/30950232/","https://doi.org/10.1111/1756-185X.13561"],"url":"https://pubmed.ncbi.nlm.nih.gov/30950232/"},{"id":"pmid-30870736","pmid":"30870736","title":"Anatomically constrained tractography facilitates biologically plausible fiber reconstruction of the optic radiation in multiple sclerosis","year":2019,"journal":"NeuroImage. Clinical","date":"2019","doi":"10.1016/j.nicl.2019.101740","status":"published","onlineYear":2019,"onlineDate":"2019-03-01","journalAbbreviation":"Neuroimage Clin","volume":"22","issue":"","pages":"101740","pmcid":"PMC6416771","type":"Originalarbeit","scope":"Grundlagen / frühe Arbeiten","summaryDe":"Bei 28 MS-Betroffenen und 22 Kontrollen wurden drei Verfahren zur Rekonstruktion der Sehstrahlung aus Diffusions-MRT verglichen. Anatomisch eingeschränkte Traktografie verringerte unplausible Faserverläufe ohne zusätzlichen Wegpunkt; bei MS mussten Läsionskarten einbezogen werden, um Gewebefehlklassifikationen zu vermeiden.","evidenceNote":"Methodenvergleich anhand bildgebender Plausibilität ohne direkte histologische Referenz. Rekonstruierte Bahnen und Diffusionsparameter sind keine unmittelbaren Messungen einzelner Axone oder individueller Sehfunktion.","featured":false,"authors":["M Horbruegger","K Loewe","J Kaufmann","M Wagner","S Schippling","M Pawlitzki","M A Schoenfeld"],"authorAnchors":["pawlitzki"],"topics":["biomarkers","neuroimmunology"],"sourceUrls":["https://pubmed.ncbi.nlm.nih.gov/30870736/","https://doi.org/10.1016/j.nicl.2019.101740"],"url":"https://pubmed.ncbi.nlm.nih.gov/30870736/"},{"id":"pmid-30446966","pmid":"30446966","title":"Efficacy and safety of alemtuzumab versus fingolimod in RRMS after natalizumab cessation","year":2019,"journal":"Journal of neurology","date":"2019-01","doi":"10.1007/s00415-018-9117-z","status":"published","onlineYear":2018,"onlineDate":"2018-11-16","journalAbbreviation":"J Neurol","volume":"266","issue":"1","pages":"165-173","pmcid":null,"type":"Originalarbeit","scope":"Grundlagen / frühe Arbeiten","summaryDe":"Ein retrospektiver Vergleich aus zwölf deutschen Zentren untersuchte Alemtuzumab und Fingolimod nach Natalizumab-Absetzen bei RRMS. Alemtuzumab war in dieser Kohorte mit einem geringeren Risiko klinischer Schübe verbunden; der Unterschied blieb nach statistischer Anpassung bestehen.","evidenceNote":"Nicht randomisierte Therapiewahl und mögliche Restkonfundierung begrenzen den Vergleich. Der Abstract nennt 144 Personen in der Endauswertung, während die angegebenen Gruppengrößen 101 und 42 zusammen 143 ergeben.","featured":false,"authors":["Steffen Pfeuffer","Rene Schmidt","Frederike Anne Straeten","Refik Pul","Christoph Kleinschnitz","Marinus Wieshuber","De-Hyung Lee","Ralf A Linker","Sebastian Doerck","Vera Straeten","Susanne Windhagen","Marc Pawlitzki","Christoph Aufenberg","Michael Lang","Christian Eienbroeker","Björn Tackenberg","Volker Limmroth","Brigitte Wildemann","Jürgen Haas","Luisa Klotz","Heinz Wiendl","Tobias Ruck","Sven G Meuth"],"authorAnchors":["pa
