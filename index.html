wlitzki"],"topics":["care","neuroimmunology"],"sourceUrls":["https://pubmed.ncbi.nlm.nih.gov/30446966/","https://doi.org/10.1007/s00415-018-9117-z"],"url":"https://pubmed.ncbi.nlm.nih.gov/30446966/"},{"id":"pmid-30619038","pmid":"30619038","title":"CSF-Progranulin and Neurofilament Light Chain Levels in Patients With Radiologically Isolated Syndrome-Sign of Inflammation","year":2018,"journal":"Frontiers in neurology","date":"2018","doi":"10.3389/fneur.2018.01075","status":"published","onlineYear":2018,"onlineDate":"2018-12-18","journalAbbreviation":"Front Neurol","volume":"9","issue":"","pages":"1075","pmcid":"PMC6305325","type":"Originalarbeit","scope":"Grundlagen / frühe Arbeiten","summaryDe":"Die Studie verglich Liquor-Progranulin und NfL bei radiologisch isoliertem Syndrom mit klinisch isoliertem Syndrom, MS-Verlaufsformen und Kontrollen. Bei RIS war Progranulin gegenüber Kontrollen erhöht, während NfL nicht von Kontrollen oder CIS abwich und niedriger lag als bei RRMS und PPMS.","evidenceNote":"Der Gruppenvergleich liefert keinen longitudinalen Nachweis, dass Progranulin zeitlich vor einer axonalen Schädigung ansteigt. Eine individuelle Vorhersage der klinischen Konversion aus RIS wird im Abstract nicht geprüft.","featured":false,"authors":["Marc Pawlitzki","Catherine M Sweeney-Reed","Daniel Bittner","Anke Lux","Stefan Vielhaber","Stefanie Schreiber","Friedemann Paul","Jens Neumann"],"authorAnchors":["pawlitzki"],"topics":["biomarkers","neuroimmunology"],"sourceUrls":["https://pubmed.ncbi.nlm.nih.gov/30619038/","https://doi.org/10.3389/fneur.2018.01075"],"url":"https://pubmed.ncbi.nlm.nih.gov/30619038/"},{"id":"pmid-30631300","pmid":"30631300","title":"CSF Neurofilament Light Chain Levels in Primary Progressive MS: Signs of Axonal Neurodegeneration","year":2018,"journal":"Frontiers in neurology","date":"2018","doi":"10.3389/fneur.2018.01037","status":"published","onlineYear":2018,"onlineDate":"2018-12-14","journalAbbreviation":"Front Neurol","volume":"9","issue":"","pages":"1037","pmcid":"PMC6315185","type":"Originalarbeit","scope":"Grundlagen / frühe Arbeiten","summaryDe":"In einem Multizentervergleich mit jeweils 50 Personen mit PPMS, ALS oder ohne Erkrankung lagen die Liquor-NfL-Werte bei PPMS zwischen den Werten der Kontrollen und der ALS-Gruppe. Innerhalb der PPMS-Gruppe bestand kein nachgewiesener Zusammenhang mit Krankheitsdauer, EDSS oder Behandlung.","evidenceNote":"Querschnittliche Biomarkerunterschiede zwischen Gruppen ersetzen keine Verlaufsprognose. Insbesondere spiegelte NfL in dieser Untersuchung die klinische Behinderung bei PPMS nicht wider.","featured":false,"authors":["Marc Pawlitzki","Stefanie Schreiber","Daniel Bittner","Julia Kreipe","Frank Leypoldt","Klemens Rupprecht","Roxana O Carare","Sven G Meuth","Stefan Vielhaber","Peter Körtvélyessy"],"authorAnchors":["pawlitzki"],"topics":["biomarkers","neuroimmunology"],"sourceUrls":["https://pubmed.ncbi.nlm.nih.gov/30631300/","https://doi.org/10.3389/fneur.2018.01037"],"url":"https://pubmed.ncbi.nlm.nih.gov/30631300/"},{"id":"pmid-30475854","pmid":"30475854","title":"CSF macrophage migration inhibitory factor levels did not predict steroid treatment response after optic neuritis in patients with multiple sclerosis","year":2018,"journal":"PloS one","date":"2018","doi":"10.1371/journal.pone.0207726","status":"published","onlineYear":2018,"onlineDate":"2018-11-26","journalAbbreviation":"PLoS One","volume":"13","issue":"11","pages":"e0207726","pmcid":"PMC6261107","type":"Originalarbeit","scope":"Grundlagen / frühe Arbeiten","summaryDe":"Bei akuter Optikusneuritis als erster CIS/MS-Episode wurden Liquorwerte des Makrophagen-Migrationsinhibitionsfaktors untersucht. Je zehn Personen mit gutem beziehungsweise unzureichendem Ansprechen auf Glukokortikoide unterschieden sich nicht in den MIF-Werten; eine separate Gruppe ohne akuten Schub zeigte höhere Werte als Optikusneuritis-Gruppe und Kontrollen.","evidenceNote":"Kleine Ansprech-Untergruppen; der negative Befund begründet keine allgemeine Aussage über alle Formen steroidrefraktärer MS-Schübe. Für die untersuchte Optikusneuritis ließ sich MIF nicht als Ansprechmarker bestätigen.","featured":false,"authors":["Marc Pawlitzki","Catherine M Sweeney-Reed","Sven G Meuth","Dirk Reinhold","Jens Neumann"],"authorAnchors":["pawlitzki"],"topics":["biomarkers","neuroimmunology"],"sourceUrls":["https://pubmed.ncbi.nlm.nih.gov/30475854/","https://doi.org/10.1371/journal.pone.0207726"],"url":"https://pubmed.ncbi.nlm.nih.gov/30475854/"},{"id":"pmid-29998157","pmid":"29998157","title":"VZV-associated acute retinal necrosis in a patient with MS treated with natalizumab","year":2018,"journal":"Neurology(R) neuroimmunology & neuroinflammation","date":"2018-09","doi":"10.1212/NXI.0000000000000475","status":"published","onlineYear":2018,"onlineDate":"2018-07-09","journalAbbreviation":"Neurol Neuroimmunol Neuroinflamm","volume":"5","issue":"5","pages":"e475","pmcid":"PMC6039210","type":"Fallbericht","scope":"Grundlagen / frühe Arbeiten","summaryDe":"Der Titel beschreibt eine VZV-assoziierte akute retinale Nekrose bei einer mit Natalizumab behandelten Person mit MS.","evidenceNote":"Im bereitgestellten PubMed-Datensatz fehlt ein Abstract. Die Einordnung als Fallbericht folgt dem Titel; Behandlung, Ausgang und ein ursächlicher Beitrag von Natalizumab werden daraus nicht abgeleitet.","featured":false,"authors":["Marc Pawlitzki","Jan Teuber","Christin Campe","Markus Wagner","Claudia Schuart","Friedemann Paul","Daniel Bittner"],"authorAnchors":["pawlitzki"],"topics":["care","neuroimmunology"],"sourceUrls":["https://pubmed.ncbi.nlm.nih.gov/29998157/","https://doi.org/10.1212/NXI.0000000000000475"],"url":"https://pubmed.ncbi.nlm.nih.gov/29998157/"},{"id":"pmid-30049983","pmid":"30049983","title":"Lower Serum Zinc Levels in Patients with Multiple Sclerosis Compared to Healthy Controls","year":2018,"journal":"Nutrients","date":"2018-07-26","doi":"10.3390/nu10080967","status":"published","onlineYear":2018,"onlineDate":"2018-07-26","journalAbbreviation":"Nutrients","volume":"10","issue":"8","pages":"","pmcid":"PMC6115799","type":"Originalarbeit","scope":"Grundlagen / frühe Arbeiten","summaryDe":"Die Studie verglich Serum-Zinkwerte bei schubförmiger und progredienter MS mit gesunden Kontrollen und fand niedrigere Werte in der MS-Gruppe sowie unter verlaufsmodifizierender Therapie. Zinkwerte unterschieden die MS-Verlaufsformen nicht und waren nicht mit EDSS, Krankheitsdauer oder Schubhäufigkeit verbunden.","evidenceNote":"Beobachteter Gruppenunterschied ohne Prüfung einer Zinksupplementation. Die Daten belegen weder einen ursächlichen Zinkmangel als Krankheitsmechanismus noch einen Nutzen von Zink zur Behandlung der MS.","featured":false,"authors":["Marc Pawlitzki","Julia Uebelhör","Catherine M Sweeney-Reed","Heike Stephanik","Juliane Hoffmann","Anke Lux","Dirk Reinhold"],"authorAnchors":["pawlitzki"],"topics":["biomarkers","neuroimmunology"],"sourceUrls":["https://pubmed.ncbi.nlm.nih.gov/30049983/","https://doi.org/10.3390/nu10080967"],"url":"https://pubmed.ncbi.nlm.nih.gov/30049983/"},{"id":"pmid-29554927","pmid":"29554927","title":"MOG-IgG in primary and secondary chronic progressive multiple sclerosis: a multicenter study of 200 patients and review of the literature","year":2018,"journal":"Journal of neuroinflammation","date":"2018-03-19","doi":"10.1186/s12974-018-1108-6","status":"published","onlineYear":2018,"onlineDate":"2018-03-19","journalAbbreviation":"J Neuroinflammation","volume":"15","issue":"1","pages":"88","pmcid":"PMC5859439","type":"Originalarbeit","scope":"Grundlagen / frühe Arbeiten","summaryDe":"In einer retrospektiven Multizenteruntersuchung waren alle 139 PPMS- und 61 SPMS-Serumproben im zellbasierten Test MOG-IgG-negativ. Eine ergänzende Literaturübersicht fand unter weiteren 90 Tests nur einen grenzwertigen Befund aus einem nicht IgG-spezifischen Assay.","evidenceNote":"Die Aussage bezieht sich auf nach damaligen Kriterien als typische PPMS oder SPMS klassifizierte Erkrankungen und die verwendeten Testverfahren. Sie schließt MOGAD bei atypischen klinischen Konstellationen nicht aus.","featured":false,"authors":["S Jarius","K Ruprecht","J P Stellmann","A Huss","I Ayzenberg","A Willing","C Trebst","M Pawlitzki","A Abdelhak","T Grüter","F Leypoldt","J Haas","I Kleiter","H Tumani","K Fechner","M Reindl","F Paul","B Wildemann"],"authorAnchors":["pawlitzki"],"topics":["biomarkers","neuroimmunology"],"sourceUrls":["https://pubmed.ncbi.nlm.nih.gov/29554927/","https://doi.org/10.1186/s12974-018-1108-6"],"url":"https://pubmed.ncbi.nlm.nih.gov/29554927/"},{"id":"pmid-28959706","pmid":"28959706","title":"Loss of corticospinal tract integrity in early MS disease stages","year":2017,"journal":"Neurology(R) neuroimmunology & neuroinflammation","date":"2017-11","doi":"10.1212/NXI.0000000000000399","status":"published","onlineYear":2017,"onlineDate":"2017-09-25","journalAbbreviation":"Neurol Neuroimmunol Neuroinflamm","volume":"4","issue":"6","pages":"e399","pmcid":"PMC5614727","type":"Originalarbeit","scope":"Grundlagen / frühe Arbeiten","summaryDe":"Diffusions-MRT bei 19 Menschen mit CIS, elf mit früher RRMS und 32 Kontrollen zeigte veränderte Parameter des kortikospinalen Trakts bereits wenige Monate nach Erkrankungsbeginn. Die Unterschiede bestanden auch ohne Läsionen im betroffenen Trakt; globale Grau- und Weißsubstanzvolumina unterschieden die Gruppen nicht.","evidenceNote":"Kleiner früher Gruppenvergleich mit geringer klinischer Behinderung. Diffusionsparameter sind unspezifische Strukturmaße und belegen weder den genauen Schädigungsmechanismus noch eine individuelle spätere Behinderungsentwicklung.","featured":false,"authors":["Marc Pawlitzki","Jens Neumann","Jörn Kaufmann","Jan Heidel","Erhard Stadler","Catherine Sweeney-Reed","Michael Sailer","Stefanie Schreiber"],"authorAnchors":["pawlitzki"],"topics":["biomarkers","neuroimmunology"],"sourceUrls":["https://pubmed.ncbi.nlm.nih.gov/28959706/","https://doi.org/10.1212/NXI.0000000000000399"],"url":"https://pubmed.ncbi.nlm.nih.gov/28959706/"},{"id":"pmid-28331892","pmid":"28331892","title":"ADEM-like presentation, anti-MOG antibodies, and MS pathology: TWO case reports","year":2017,"journal":"Neurology(R) neuroimmunology & neuroinflammation","date":"2017-05","doi":"10.1212/NXI.0000000000000335","status":"published","onlineYear":2017,"onlineDate":"2017-03-14","journalAbbreviation":"Neurol Neuroimmunol Neuroinflamm","volume":"4","issue":"3","pages":"e335","pmcid":"PMC5350621","type":"Fallbericht","scope":"Grundlagen / frühe Arbeiten","summaryDe":"Der Beitrag berichtet laut Titel zwei Fälle mit ADEM-ähnlicher Präsentation, MOG-Antikörpern und als MS-typisch beschriebener Pathologie.","evidenceNote":"Ein Abstract liegt im bereitgestellten PubMed-Datensatz nicht vor. Diagnostischer Verlauf, Gewebebefunde, Therapie und Ausgang können daher nicht über die Angaben des Titels hinaus eingeordnet werden.","featured":false,"authors":["Peter Körtvélyessy","Markus Breu","Marc Pawlitzki","Imke Metz","Hans-Jochen Heinze","Mike Matzke","Christian Mawrin","Paulus Rommer","Gabor G Kovacs","Christian Mitter","Markus Reindl","Wolfgang Brück","Klaus-Peter Wandinger","Hans Lassmann","Romana Höftberger","Frank Leypoldt"],"authorAnchors":["pawlitzki"],"topics":["neuroimmunology"],"sourceUrls":["https://pubmed.ncbi.nlm.nih.gov/28331892/","https://doi.org/10.1212/NXI.0000000000000335"],"url":"https://pubmed.ncbi.nlm.nih.gov/28331892/"}]};window.LANDMARK_DATA={"schemaVersion":1,"verifiedAt":"2026-10-27","stroke":{"paperId":"pmid-41694693","citation":"Lars Masanneck et al. Direct stroke unit access versus a hub-and-spoke model with telemedicine-assisted CT in Germany: a cross-sectional geospatial analysis The Lancet regional health. Europe (2026).","sourceUrl":"https://pmc.ncbi.nlm.nih.gov/articles/PMC12906117/","methodNote":"Vergleich der nächsten CT-Klinik mit der nächsten zertifizierten Stroke Unit in Deutschland. Modellierter Zeitgewinn = Fahrzeit zur Stroke Unit − (Fahrzeit zur CT-Klinik + zusätzliche Verzögerung bis CT / IVT). Basis: Bevölkerungsraster von 1 km, Fahrzeit-Isochronen in 5-Minuten-Schritten und eine Erreichbarkeitsgrenze von 60 Minuten. Der Regler zeigt ausschließlich die vier publizierten Szenarien. Eine spätere Verlegung zur Thrombektomie und klinische Outcomes sind hier nicht abgebildet.","denominatorNote":"Die großen Prozentwerte folgen dem Ergebnisteil (36,4 / 26,9 / 13,4 / 4,6 %), die Balken Tabelle 2, obere Hälfte. Die Publikation ist an diesen Stellen nicht vollständig konsistent: Der Abstract nennt für 30 Minuten Zusatzzeit 4,5 % statt 4,6 %. Die Kategorien umfassen rund 83,195 Mio. Einwohner, gegenüber 83,420 Mio. in Tabelle 1; ihre Summe variiert geringfügig zwischen Szenarien. Gerundete Kategorien und rekonstruierte Prozentwerte reproduzieren die Angaben des Fließtexts nicht überall exakt. Diese Abweichungen werden nicht durch Neuberechnung verdeckt. Die Kategorie \u003c10 Minuten kann auch negative Differenzen enthalten; „nur CT erreichbar“ ist ein separater Erreichbarkeitsbefund.","scenarios":[{"delay":0,"benefit10":36.4,"categories":[{"id":"neitherReachable","label":"Keine Klinik ≤60 min","percent":0.3,"count":213885,"kind":"other"},{"id":"onlyCtReachable","label":"Nur CT-Klinik ≤60 min","percent":0.7,"count":574085,"kind":"other"},{"id":"under10","label":"Unter 10 min","percent":62.7,"count":52133844,"kind":"neutral"},{"id":"tenTo20","label":"10–20 min","percent":22.2,"count":18441260,"kind":"gain"},{"id":"twentyTo30","label":"20–30 min","percent":9.4,"count":7813066,"kind":"gain"},{"id":"over30","label":"Über 30 min","percent":4.8,"count":4018524,"kind":"gain"}]},{"delay":10,"benefit10":26.9,"categories":[{"id":"neitherReachable","label":"Keine Klinik ≤60 min","percent":0.3,"count":213885,"kind":"other"},{"id":"onlyCtReachable","label":"Nur CT-Klinik ≤60 min","percent":0.7,"count":574085,"kind":"other"},{"id":"under10","label":"Unter 10 min","percent":72.1,"count":59954572,"kind":"neutral"},{"id":"tenTo20","label":"10–20 min","percent":17,"count":14158787,"kind":"gain"},{"id":"twentyTo30","label":"20–30 min","percent":7,"count":5855786,"kind":"gain"},{"id":"over30","label":"Über 30 min","percent":2.9,"count":2437551,"kind":"gain"}]},{"delay":20,"benefit10":13.4,"categories":[{"id":"neitherReachable","label":"Keine Klinik ≤60 min","percent":0.3,"count":213885,"kind":"other"},{"id":"onlyCtReachable","label":"Nur CT-Klinik ≤60 min","percent":0.7,"count":574085,"kind":"other"},{"id":"under10","label":"Unter 10 min","percent":85.7,"count":71307861,"kind":"neutral"},{"id":"tenTo20","label":"10–20 min","percent":9.2,"count":7641977,"kind":"gain"},{"id":"twentyTo30","label":"20–30 min","percent":3.2,"count":2625470,"kind":"gain"},{"id":"over30","label":"Über 30 min","percent":1,"count":831379,"kind":"gain"}]},{"delay":30,"benefit10":4.6,"categories":[{"id":"neitherReachable","label":"Keine Klinik ≤60 min","percent":0.3,"count":213885,"kind":"other"},{"id":"onlyCtReachable","label":"Nur CT-Klinik ≤60 min","percent":0.7,"count":574085,"kind":"other"},{"id":"under10","label":"Unter 10 min","percent":94.5,"count":78600079,"kind":"neutral"},{"id":"tenTo20","label":"10–20 min","percent":3.4,"count":2850726,"kind":"gain"},{"id":"twentyTo30","label":"20–30 min","percent":1.1,"count":955902,"kind":"gain"},{"id":"over30","label":"Über 30 min","percent":0,"count":0,"kind":"gain"}]}]},"rag":{"paperId":"pmid-40038423","citation":"Lars Masanneck et al. Evaluating base and retrieval augmented LLMs with document or online support for evidence based neurology NPJ digital medicine (2025).","sourceUrl":"https://www.nature.com/articles/s41746-025-01536-y","methodNote":"130 Fragen aus 13 neurologischen Leitlinien (65 Wissensfragen, 65 Fallfragen), je vier Antworten pro System. Dokument-RAG erhielt genau die Leitlinien, aus denen die Fragen abgeleitet wurden. Zwei verblindete neurologische Rater bewerteten die Antworten; bei Uneinigkeit entschied ein dritter. Quellen prüfte ein Rater separat. Korrekt: Empfehlung vollständig leitlinienkonform, kleine folgenlose Begründungsfehler möglich. Ungenau: unvollständig oder mit kleineren missverständlichen Fehlern. Falsch: unbeantwortet, falsch, stark unvollständig oder potenziell gefährlich; nicht ausschließlich schädliche Antworten. Dargestellt sind sieben von neun Konfigurationen; zwei zusätzliche LLaMA-Basismodelle sind ausgelassen. GPT-4o-Basis und Dokument-RAG verwenden im veröffentlichten Code dieselbe Version (gpt-4o-2024-11-20), aber unterschiedliche Antwortabläufe. Der Vergleich isoliert den Beitrag des Retrievals nicht vollständig. Die publizierte Inferenz beruht auf Modalwerten der 130 gepaarten Fragen, nicht auf 520 unabhängigen Aufgaben.","baselineId":"gpt4o-base","documentId":"gpt4o-docs","n":520,"hallucinationDefinition":"Als Quellenbefund zählt eine Antwort mit mindestens einer teilweise oder vollständig erfundenen Referenz; auch bibliografische Fehler zählen. Die Einheit ist die Antwort, nicht die einzelne Referenz. „Ohne diesen Befund“ schließt unspezifische Quellenbehauptungen ohne prüfbare Referenz ein und bestätigt daher keine belastbaren Quellen.","conditions":[{"id":"gpt4o-base","label":"GPT-4o","correct":313,"imprecise":147,"incorrect":60,"hallucinations":217,"existingSources":291,"generalClaims":12},{"id":"gpt4o-docs","label":"GPT-4o + Leitlinien-RAG","correct":450,"imprecise":51,"incorrect":19,"hallucinations":71,"existingSources":352,"generalClaims":97},{"id":"llama-web","label":"LLaMA3.1-Sonar-405B + Web","correct":349,"imprecise":116,"incorrect":55,"hallucinations":1,"existingSources":390,"generalClaims":129},{"id":"gpt4turbo","label":"GPT-4 Turbo","correct":231,"imprecise":197,"incorrect":92,"hallucinations":44,"existingSources":155,"generalClaims":321},{"id":"gpt4omini","label":"GPT-4o mini","correct":206,"imprecise":200,"incorrect":114,"hallucinations":305,"existingSources":161,"generalClaims":54},{"id":"gemini15pro","label":"Gemini 1.5 Pro","correct":174,"imprecise":168,"incorrect":178,"hallucinations":375,"existingSources":98,"generalClaims":47},{"id":"mixtral","label":"Mixtral 8×7B","correct":131,"imprecise":206,"incorrect":183,"hallucinations":479,"existingSources":31,"generalClaims":10}]},"wearables":{"paperId":"pmid-40635238","citation":"Lars Masanneck et al. Digital Activity Markers in Chronic Inflammatory Demyelinating Polyneuropathy Annals of clinical and translational neurology (2025).","sourceUrl":"https://pmc.ncbi.nlm.nih.gov/articles/PMC12516250/","methodNote":"Prospektive Smartwatch-Kohorte aus Düsseldorf und Münster: 46 Personen mit CIDP unter stabiler intravenöser Immunglobulintherapie eingeschlossen, 43 in der Aktivitätsanalyse. Withings ScanWatch über etwa sechs Monate. Gezeigt ist pro Person die höchste gesamte Tagesschrittzahl im Beobachtungszeitraum, korreliert mit den klinischen Scores am Studienende. Ein gültiger Tag erforderte mindestens 75 % Tragezeit zwischen 06:00 und 23:00 Uhr; Personen mit verfehltem Kriterium an mehr als 25 % der Tage wurden ausgeschlossen. Das 14-Tage-Beispiel darüber erklärt ausschließlich die Berechnung und bildet dieses Studienprotokoll nicht nach.","correlationNote":"I-RODS: Rohscore 0–48, höher bedeutet weniger Einschränkung. INCAT: 0–10, höher bedeutet stärkere Behinderung. MRC-Summenscore: 0–60, höher bedeutet mehr Muskelkraft. Spearman-Korrelationen zwischen Personen belegen weder Kausalität noch eine validierte Vorhersage des individuellen Verlaufs. Das Maximum hängt auch von der Beobachtungsdauer ab. Die separate retrospektive Smartphone-Kohorte (n=20) wird hier nicht mit der Smartwatch-Kohorte vermischt. Konfidenzintervalle werden nicht nachträglich aus den gerundeten Koeffizienten konstruiert.","sampleNote":"Smartwatch-Kohorte, Aktivitätsanalyse n=43; höchste Tagesschrittzahl über etwa sechs Monate.","correlations":[{"label":"Maximale Tagesschritte","irods":0.74,"incat":-0.54,"mrc":0.37}]},"triage":{"paperId":"pmid-38875696","citation":"Lars Masanneck et al. Triage Performance Across Large Language Models, ChatGPT, and Untrained Doctors in Emergency Medicine: Comparative Study. Journal of medical Internet research (2024).","sourceUrl":"https://www.jmir.org/2024/1/e53297/","methodNote":"124 anonymisierte und bearbeitete englische Vignetten aus einem Tag der Notaufnahme Düsseldorf; Manchester Triage System, deutsche fünfte Ausgabe. Zwei erfahrene MTS-Instruierende bildeten mit Moderation bei Uneinigkeit die Konsensreferenz. Jedes Modell bewertete alle 124 Vignetten viermal: 496 Bewertungen, aber 124 verschiedene Fälle. Vier Assistenzärztinnen und -ärzte aus dem zweiten oder dritten Weiterbildungsjahr mit Notaufnahmeerfahrung, ohne formale MTS-Schulung, bewerteten dieselben Fälle. Gezeigt sind die sechs Modellkonfigurationen und zwei ärztlichen Bedingungen; die am Referenzkonsens beteiligten Rater sowie die retrospektiv optimale Kombination bleiben getrennte Befunde und werden hier nicht als Vergleichsgruppen angezeigt.","limitationNote":"Historische Produkt- und API-Stände, unter anderem ChatGPT vom 24.05.2023; keine Aussage zu heutigen Modellen. Für die Zweitmeinung wurde nachträglich die beste der vier GPT-4-ChatGPT-Wiederholungen ausgewählt. Die gleichen ärztlichen Personen überdachten danach ihre ursprünglichen Antworten. Mittelwerte und SD beziehen sich auf vier Durchgänge bzw. vier Personen. Der Tukey-Kontrast wird wie publiziert wiedergegeben, ohne neue Analyse der gepaarten Daten. Nichtsignifikanz belegt keine Äquivalenz. Die publizierte Differenz 0,025 beruht auf ungerundeten Werten; 0,70−0,68 ergibt dagegen 0,02. Die Vignettenstudie zeigt keine klinische Sicherheit oder verbesserte Patienten-Outcomes. Das konstruierte Kategorienpaar verwendet eine ausdrücklich für die Illustration gewählte Normierung; die konkrete Gewichtsformel der Originalanalyse ist im Paper nicht angegeben.","humanComparisonNote":"Dieselben vier Personen und 124 Vignetten. Publizierter Unterschied Δκ=0,025; Tukey-95%-KI −0,0515 bis 0,1015; p=0,9675. Ein statistisch signifikanter Gewinn wurde nicht nachgewiesen. Verwendet wurde die nachträglich beste GPT-4-ChatGPT-Wiederholung.","categories":[{"value":1,"label":"Rot · höchste Dringlichkeit"},{"value":2,"label":"Orange"},{"value":3,"label":"Gelb"},{"value":4,"label":"Grün"},{"value":5,"label":"Blau · niedrigste Dringlichkeit"}],"models":[{"id":"chatgpt35","label":"ChatGPT / GPT‑3.5","shortLabel":"ChatGPT / GPT‑3.5","mean":0.54,"sd":0.024,"note":"Vier neue Chats; genaue Backend-Version und Sampling-Parameter nicht angegeben."},{"id":"chatgpt4","label":"ChatGPT / GPT‑4","shortLabel":"ChatGPT / GPT‑4","mean":0.67,"sd":0.037,"note":"Vier neue Chats; genaue Backend-Version und Sampling-Parameter nicht angegeben. Die nachträglich beste Wiederholung wurde als Zweitmeinung für die ärztliche Assistenzbedingung ausgewählt."},{"id":"gpt4_api","label":"GPT‑4 / API","shortLabel":"GPT‑4 / API","mean":0.65,"sd":0.01,"note":"API-Modell und Prompt unterscheiden sich vom früheren ChatGPT-Produkt; kein isolierter Vergleich der Benutzeroberflächen."},{"id":"gemini15","label":"Gemini 1.5 / API","shortLabel":"Gemini 1.5 / API","mean":0.6,"sd":0.01,"note":""},{"id":"llama3","label":"Llama 3 70B / API","shortLabel":"Llama 3 70B / API","mean":0.52,"sd":0.004,"note":""},{"id":"mixtral","label":"Mixtral 8×7B / API","shortLabel":"Mixtral 8×7B / API","mean":0.42,"sd":0,"note":"Alle vier Durchgänge lieferten identische Triage-Zuordnungen. SD = 0,000 beschreibt diese Wiederholungen und belegt keine allgemeine Sicherheit."}],"humans":[{"id":"residents","label":"Assistenzärzt*innen allein","mean":0.68,"sd":0.056,"assisted":false},{"id":"residents_assisted","label":"Dieselben Ärzt*innen + GPT‑4-Zweitmeinung","mean":0.7,"sd":0.047,"assisted":true}],"comparison":{"from":"residents","to":"residents_assisted","direction":"to_minus_from","meanDifference":0.025,"pAdjusted":0.9675,"sourceId":"appendix","sourceLocation":"Table S2, PDF-Seite 8","recomputed":false,"confidenceInterval":{"level":0.95,"l ägt Spearman-ρ=0,60.","categoryNote":"Die Autoren berichten für 12 von 16 Personen unterschiedliche EDSS-relevante Distanzkategorien. Die vollständige Zuordnungsregel und Grenzkonvention sind nicht dokumentiert; eine einfache Nachrechnung mit 100/200/500 m reproduziert den Befund nicht exakt. Deshalb werden hier keine individuellen EDSS-Kategorien zugewiesen.","medianAbsoluteDifference":299.92,"pairs":[{"id":1,"estimated":100,"measured":672.28,"sourceLabel":"Patient 1"},{"id":2,"estimated":200,"measured":742.16,"sourceLabel":"Patient 2"},{"id":3,"estimated":500,"measured":348.84,"sourceLabel":"Patient 3"},{"id":4,"estimated":500,"measured":56.64,"sourceLabel":"Patient 4"},{"id":5,"estimated":700,"measured":276.7,"sourceLabel":"Patient 5"},{"id":6,"estimated":10,"measured":234.28,"sourceLabel":"Patient 6"},{"id":7,"estimated":500,"measured":174.36,"sourceLabel":"Patient 7"},{"id":8,"estimated":5,"measured":8.36,"sourceLabel":"Patient 8"},{"id":9,"estimated":300,"measured":135.7,"sourceLabel":"Patient 9"},{"id":10,"estimated":2000,"measured":1489.1,"sourceLabel":"Patient 10"},{"id":11,"estimated":400,"measured":100.16,"sourceLabel":"Patient 11"},{"id":12,"estimated":1500,"measured":716.88,"sourceLabel":"Patient 12"},{"id":13,"estimated":25,"measured":123.44,"sourceLabel":"Patient 13"},{"id":14,"estimated":10,"measured":10.32,"sourceLabel":"Patient 14"},{"id":15,"estimated":400,"measured":194.38,"sourceLabel":"Patient 15"},{"id":16,"estimated":2000,"measured":2300,"sourceLabel":"Patient 16"}]},"sleep":{"paperId":"pmid-41257389","citation":"Jan Voth et al. Wearable Monitoring Captures Sleep Disturbances in Patients With Chronic Inflammatory Demyelinating Polyneuropathy. Journal of the peripheral nervous system : JPNS (2025).","sourceUrl":"https://pmc.ncbi.nlm.nih.gov/articles/PMC12536332/","methodNote":"Prospektives EMDA-CIDP-Monitoring mit Withings ScanWatch über etwa sechs Monate in Düsseldorf und Münster. 46 Personen eingeschlossen; nach einem IVIG-Abbruch und fünf Adhärenzausschlüssen 40 ausgewertet. Nachtfenster 22:00–08:00 Uhr; mindestens 75 % Tragezeit in mindestens 75 % der Nächte erforderlich. Pro Person wurden mediane nächtliche Schlafmaße mit Median-Scores aus V1–V3 verglichen. Die sechs Koeffizienten sind Spearman-Korrelationen zwischen diesen Personenmerkmalen. n=40 ist durch die analytische Kohorte und null fehlende Werte für diese Maße in Tabelle 1 gestützt; die Paarplots nennen kein separates n. Keine numerischen ρ-Konfidenzintervalle berichtet. I-RODS ist der Rohscore 0–48; höhere Werte bedeuten weniger Einschränkung.","limitationNote":"Typische, überwiegend stabil IVIG-behandelte CIDP; selektierte kleine Kohorte. Keine Polysomnographie- oder Aktigraphie-Referenz in dieser Analyse. Keine Kausalität, individuelle Prognose oder nachgewiesene Änderungssensitivität aus den Korrelationen ableiten. Die Sensor- und Fragebogenmediane der Einschlaflatenz sind keine Verteilung individueller Differenzen. Das konstruierte Beispiel verwendet feste 480 Minuten Bettzeit und 20 Minuten Latenz sowie keine zusätzliche Wachzeit nach endgültigem Erwachen. Es bildet keinen proprietären Gerätealgorithmus nach.","deviceNote":"Die Uhr schätzt Schlaf aus Sensorsignalen. Die Studie enthielt keine Polysomnographie als Referenz; auch eine hohe rechnerische Schlafeffizienz ist kein Nachweis störungsfreien Schlafs.","latencyNote":"Tabelle 1: Einschlaflatenz laut Uhr median 2 min [IQR 2–2], im Selbstbericht 15 min [10–30]. Das sind zwei Gruppenkennwerte; daraus folgt keine individuelle Differenz von 13 Minuten und kein validierter Gerätefehler.","scores":[{"id":"psqi","label":"PSQI","direction":"Höherer PSQI = schlechtere subjektive Schlafqualität."},{"id":"irods","label":"I-RODS","direction":"Höherer I-RODS = weniger Einschränkung."},{"id":"incat","label":"INCAT","direction":"Höherer INCAT = stärkere Einschränkung."}],"correlations":[{"id":"sleep_efficiency","label":"Schlafeffizienz","psqi":-0.49,"irods":0.46,"incat":-0.39},{"id":"waso","label":"Wachzeit (WASO)","psqi":0.4,"irods":-0.42,"incat":0.34}]},"fatigue":{"paperId":"pmid-42759177","citation":"Lars Masanneck et al. Digital signatures of fatigue and wearing-off symptoms in patients with multiple sclerosis under natalizumab. Neurotherapeutics : the journal of the American Society for Experimental NeuroTherapeutics (2026).","sourceUrl":"https://pmc.ncbi.nlm.nih.gov/articles/PMC13602057/","methodNote":"Prospektive SATURATE-Beobachtungsstudie, sechs Monate, ein Zentrum. 34 Personen eingeschlossen, 28 im Follow-up, 21 mit auswertbaren Smartwatch-Daten. Vor den Natalizumab-Gaben wurden Fragebögen ausgefüllt. Gezeigt sind die publizierten Zähler und Nenner sowie die mittleren, innerhalb der Person z-standardisierten Nachmittagsschritte am Anfang und Ende des Behandlungszyklus. Streuungsangaben: Standardabweichungen der Personenwerte. Keine individuellen Messreihen oder interpolierten Zyklusverläufe.","limitationNote":"Kleine, klinisch stabile und selektierte Kohorte. Mehrere Fragebögen stammen von denselben Personen. Die beiden Häufigkeiten beantworten verschiedene Fragen. Standardisierte Aktivität ist keine Schrittzahl; −0,130 bedeutet weder 13 % noch 130 Schritte weniger. Die Mittelwerte und SD sind keine Unsicherheit des Unterschieds. Der Zusammenhang mit Fatigue belegt keine Ursache; fehlende Assoziationen mit Serum- und MRT-Markern schließen Krankheitsaktivität nicht allgemein aus.","sourceNote":"Abstract und Ergebnisteil; Nachmittagsschritte zusätzlich Abbildung 3. Die weiteren Tageszeiten und die adjustierten Regressionsmodelle werden hier nicht zusammengeführt.","enrolled":34,"followUp":28,"wearableN":21,"afternoonDifference":-0.13,"holmP":0.015,"frequencies":[{"id":"people","label":"Personen mit mindestens einer Episode","positive":19,"total":28,"unit":"Personen","publishedPercent":67.9,"reading":"19 von 28 Personen berichteten im Studienzeitraum mindestens einmal Wearing-off-Symptome."},{"id":"questionnaires","label":"Fragebögen mit Wearing-off-Symptomen","positive":63,"total":177,"unit":"Fragebögen","publishedPercent":35.6,"reading":"63 von 177 beobachteten Fragebögen vor einer Gabe enthielten Wearing-off-Symptome. Eine Person kann mehrere Fragebögen beitragen."}],"afternoon":[{"id":"beginning","label":"Zyklusanfang","mean":0.094,"sd":0.121},{"id":"end","label":"Zyklusende","mean":-0.036,"sd":0.249}],"differenceCi":{"lower":-0.229,"upper":-0.004}},"brisa":{"paperId":"pmid-42868150","citation":"Ann-Sophie Stratil et al. A longitudinal analysis of real world symptom tracking and patient-reported outcomes in Brisa, a German Digital Health App for multiple sclerosis. PLOS digital health (2026).","sourceUrl":"https://journals.plos.org/digitalhealth/article?id=10.1371/journal.pdig.0001751","methodNote":"Retrospektive Brisa-App-Auswertung. Von 8.441 einwilligenden Nutzerinnen und Nutzern erfüllten 4.194 die Einschlusskriterien: mindestens 18 Jahre, Angabe einer DMT der Kategorien 1–3 und kein Medikamentenwechsel. „Neu diagnostiziert“ bedeutet 0–1 Jahre seit Diagnose bei Registrierung. Die dargestellten Behandlungsanteile beziehen sich auf diese Untergruppe, getrennt nach Registrierungszeitraum. Es sind veröffentlichte, auf eine Nachkommastelle gerundete Anteile, keine individuellen Therapieverläufe.","limitationNote":"Selbstberichtete Angaben einer selektierten App-Population. Die Zeiträume vergleichen Gruppen bei Registrierung und zeigen keine Wechsel derselben Personen. Kategorie 2 wird in dieser Ansicht ausgelassen. Die Kategorien folgen der Einordnung des Papers und sind keine individuelle Therapieempfehlung. Registrierung ist nicht gleich fortgesetzte Nutzung; die 4.194 eingeschlossenen Personen sind nicht der Nenner jeder longitudinalen Analyse. Beobachtete Veränderungen belegen keine Wirksamkeit der App.","sourceNote":"Ergebnisteil 2.1–2.2 und Abbildung 1. Prozentpunktdifferenzen werden aus den gerundeten publizierten Anteilen berechnet. Keine Gruppengrößen aus gerundeten Prozenten rekonstruiert.","consen   <script>
(() => {
  'use strict';
  const D = window.LANDMARK_DATA || {};
  const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const num = (value, digits = 2) => new Intl.NumberFormat('de-DE', {maximumFractionDigits:digits}).format(value);
  const definitions = [
    {id:'neuroinflammation', number:'10', author:'Masanneck et al.', label:'Neuroimmunologie', subtitle:'Isochronen · 2023'},
    {id:'memoryclinics', number:'11', author:'Masanneck et al.', label:'Gedächtnisambulanzen', subtitle:'Isochronen · 2023'},
    {id:'neurovascular', number:'12', author:'Vach et al.', label:'Neurovaskuläre Zentren', subtitle:'Isochronen · 2025'},
    {id:'childpsychiatry', number:'13', author:'Masanneck et al.', label:'Kinder- und Jugendpsychiatrie', subtitle:'Isochronen · 2026'},
    {id:'botulinum', number:'14', author:'Koelsche et al.', label:'Botulinumtoxin-Versorgung', subtitle:'Isochronen · 2026'},
    {id:'fees', number:'15', author:'Gelenar Marae et al.', label:'FEES-Zugang', subtitle:'Isochronen · 2026'}
  ];
  const items = definitions.filter(s => D[s.id]);
  const states = new Map();
  const modes = s => [
    ...(s.series.length > 1 ? [{id:'series', label:s.seriesLabel + ' vergleichen'}] : []),
    ...(s.thresholds.length > 1 ? [{id:'times', label:'Fahrzeitgrenzen vergleichen'}] : []),
    ...(s.regions.length > 1 ? [{id:'regions', label:'Regionen vergleichen'}] : [])
  ];
  function stateFor(id) {
    if (!states.has(id)) {
      const s = D[id];
      states.set(id, {minutes:s.defaultMinutes, series:s.defaultSeries, region:'de', view:s.defaultView});
    }
    return states.get(id);
  }
  const percent = (s, region, value) => {
    const digits = region.id === 'de' ? s.precision : s.regionalPrecision;
    return new Intl.NumberFormat('de-DE', {minimumFractionDigits:digits,maximumFractionDigits:digits}).format(value);
  };
  const point = (s, state) => s.regions.find(r => r.id === state.region)?.values.find(v => v.seriesId === state.series && v.minutes === state.minutes);
  const select = (id, label, value, options) => `<label for="${id}">${esc(label)}<select id="${id}">${options.map(o => `<option value="${esc(o.id)}" ${String(o.id) === String(value) ? 'selected' : ''}>${esc(o.label)}</option>`).join('')}</select></label>`;
  const fixed = (label, value) => `<p class="iso-fixed-control"><span>${esc(label)}</span><strong>${esc(value)}</strong></p>`;

  function render(id) {
    const s = D[id], item = items.find(i => i.id === id);
    if (!s || !item) return '';
    const state = stateFor(id), views = modes(s);
    return `<section class="ex-study iso-study" id="isochrone-study" data-iso-study="${id}" aria-labelledby="study-title">

      <div class="ex-layout"><div class="ex-workbench">
        <div class="ex-original-label">Veröffentlichte Modellwerte · keine neuen Routen oder konstruierten Fälle</div>
        <div class="iso-controls">
          ${s.regions.length > 1 ? select('iso-region','Bezugsregion',state.region,s.regions) : fixed('Bezugsregion','Deutschland')}
          ${s.thresholds.length > 1 ? select('iso-minutes','Publizierte Fahrzeitgrenze',state.minutes,s.thresholds.map(t => ({id:t,label:t+' Minuten'}))) : fixed('Publizierte Fahrzeitgrenze',state.minutes+' Minuten')}
          ${s.series.length > 1 ? select('iso-series',s.seriesLabel,state.series,s.series) : fixed(s.seriesLabel,s.series[0].label)}
          ${views.length > 1 ? select('iso-view','Im Diagramm',state.view,views) : fixed('Im Diagramm',views[0].label)}
        </div>
        <p class="ex-compact-note">Kumulativer Anteil: Eine längere Fahrzeitgrenze schließt die kürzer erreichbaren Wohnorte ein. Es werden ausschließlich veröffentlichte Zeitgrenzen verglichen.</p>
        <div id="iso-result" role="status" aria-atomic="true"></div>
        <div id="iso-chart"></div>
        <details class="ex-method"><summary>Originalwerte, Methoden und Grenzen</summary><p>${esc(s.methodNote)}</p><p>${esc(s.sourceNote)}</p><div id="iso-table"></div></details>
      </div><aside class="ex-margin">
        <h3>Was Erreichbarkeit hier bedeutet</h3><div class="ex-reading" id="iso-reading"></div>
        <p class="ex-caveat">${esc(s.limitationNote)}</p>
        <p class="iso-cross-study-note">Die Skala reicht immer von 0 bis 100 %. Verschiedene Arbeiten verwenden jedoch andere Standortverzeichnisse, Bezugsjahre und Angebotsdefinitionen. Ihre Anteile bilden keine gemeinsame Rangliste der Versorgungsqualität.</p>
        <div class="ex-source"><span class="ex-overline">Die Publikation</span><p>${esc(s.citation)}</p><button type="button" data-landmark-paper="${esc(s.paperId)}">Autoren und Publikationsdetails ↗</button>${s.sourceLinks.map(l => `<a href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">${esc(l.label)} öffnen ↗</a>`).join('')}</div>
      </aside></div>
    </section>`;
  }

  function rowsFor(s, state) {
    const selectedRegion = s.regions.find(r => r.id === state.region);
    if (state.view === 'series') return s.series.map(series => ({
      key:series.id, dimension:'series', label:series.label, region:selectedRegion,
      value:point(s,{...state,series:series.id}), selected:series.id === state.series
    }));
    if (state.view === 'regions') return s.regions.map(region => ({
      key:region.id, dimension:'region', label:region.label, region,
      value:point(s,{...state,region:region.id}), selected:region.id === state.region
    }));
    return s.thresholds.map(minutes => ({
      key:String(minutes), dimension:'minutes', label:minutes+' Minuten', region:selectedRegion,
      value:point(s,{...state,minutes}), selected:minutes === state.minutes
    }));
  }

  function update(id) {
    const section = document.getElementById('isochrone-study');
    if (!section || section.dataset.isoStudy !== id) return;
    const s = D[id], state = stateFor(id), value = point(s,state);
    const region = s.regions.find(r => r.id === state.region), series = s.series.find(r => r.id === state.series);
    if (!value || !region || !series) return;
    const pct = percent(s,region,value.percent);
    document.getElementById('iso-result').innerHTML = `<div class="ex-result-line iso-result-line"><strong>${pct}<span>%</span></strong><p>der modellierten Wohnbevölkerung in <b>${esc(region.label)}</b><br>innerhalb ${state.minutes} Minuten Pkw-Fahrzeit<br><b>${esc(series.label)}</b>${value.count !== null ? `<br><small>Publizierte Schätzung: ${num(value.count,0)} Einwohner</small>` : ''}</p></div>`;
    const rows = rowsFor(s,state);
    const title = state.view === 'series' ? `${region.label} · ${state.minutes} Minuten` : state.view === 'regions' ? `${series.label} · ${state.minutes} Minuten` : `${region.label} · ${series.label}`;
    document.getElementById('iso-chart').innerHTML = `<figure class="iso-chart"><figcaption class="iso-chart-heading">${esc(title)}</figcaption><div class="iso-axis" aria-hidden="true"><span>0 %</span><span>50 %</span><span>100 %</span></div><div class="iso-bars">${rows.map(r => `<button type="button" class="iso-bar-row ${r.selected ? 'selected' : ''}" data-iso-dimension="${r.dimension}" data-iso-value="${esc(r.key)}" aria-pressed="${r.selected}" aria-label="${esc(r.label)}: ${percent(s,r.region,r.value.percent)} Prozent. Auswählen"><span class="iso-bar-label"><span>${esc(r.label)}</span><strong>${percent(s,r.region,r.value.percent)} %</strong></span><span class="iso-track" aria-hidden="true"><span style="width:${r.value.percent}%"></span></span></button>`).join('')}</div><p class="ex-help">${state.view === 'regions' ? 'Jeder Balken bezieht sich auf die Bevölkerung der jeweiligen Region. Deutschland ist die separat publizierte Bundesanalyse.' : 'Alle Balken beziehen sich auf dieselbe ausgewählte Region.'} Zeile anklicken oder die Auswahl oben ändern. Die Balken zeigen kumulative Modellanteile, keine beobachteten Behandlungsraten.</p></figure>`;
    const roundedNote = value.percent === 100 ? '<p>Die publizierte Angabe von 100 % ist gerundet und kein Nachweis lückenloser individueller Erreichbarkeit.</p>' : value.percent === 0 && value.count > 0 ? `<p>Der Prozentwert ist auf null gerundet; die Quelle nennt dennoch ${num(value.count,0)} Einwohner.</p>` : '';
    document.getElementById('iso-reading').innerHTML = `<span class="ex-overline">Ihre Auswahl</span><p>${esc(series.description)}</p><p>${pct} % der Bevölkerung der ausgewählten Region liegen im Modell innerhalb dieser Fahrzeitgrenze. Das ist kein Anteil an tatsächlich untersuchten oder behandelten Personen.</p>${roundedNote}`;
    const hasCounts = region.values.some(v => v.count !== null);
    document.getElementById('iso-table').innerHTML = `<div class="ex-table-scroll" tabindex="0" role="region" aria-label="Originaltabelle, bei Bedarf horizontal scrollen"><table><caption>${esc(region.label)} · ${esc(region.sourceLocation)}</caption><thead><tr><th scope="col">${esc(s.seriesLabel)}</th><th scope="col">Pkw-Fahrzeit bis</th><th scope="col">Anteil</th>${hasCounts ? '<th scope="col">Geschätzte Einwohner</th>' : ''}</tr></thead><tbody>${s.series.flatMap(ser => s.thresholds.map(minutes => {
      const v = point(s,{region:region.id,series:ser.id,minutes});
      return `<tr><th scope="row">${esc(ser.label)}</th><td>${minutes} min</td><td>${percent(s,region,v.percent)} %</td>${hasCounts ? `<td>${v.count === null ? 'nicht angegeben' : num(v.count,0)}</td>` : ''}</tr>`;
    })).join('')}</tbody></table></div>`;
  }

  function setSelection(id, dimension, value) {
    const s = D[id], state = stateFor(id);
    if (dimension === 'minutes') {
      const minutes = Number(value);
      if (!s.thresholds.includes(minutes)) return false;
      state.minutes = minutes;
    } else if (dimension === 'series') {
      if (!s.series.some(s => s.id === value)) return false;
      state.series = value;
    } else if (dimension === 'region') {
      if (!s.regions.some(r => r.id === value)) return false;
      state.region = value;
    } else if (dimension === 'view') {
      if (!modes(s).some(m => m.id === value)) return false;
      state.view = value;
    } else return false;
    const control = document.getElementById('iso-'+dimension);
    if (control) control.value = String(state[dimension]);
    update(id);
    return true;
  }
  document.addEventListener('change', event => {
    const section = event.target.closest('[data-iso-study]');
    if (!section || !/^iso-(minutes|series|region|view)$/.test(event.target.id)) return;
    setSelection(section.dataset.isoStudy,event.target.id.slice(4),event.target.value);

  document.addEventListener('click', event => {

    }
  });
  window.IsochroneStudies = {items,render,mount:update};
})();

rbunden.</p><p class="ex-caveat">Die Arbeit berichtet Zusammenhänge mit Fatigue. Die kleine Beobachtungsstudie erlaubt keinen allgemeinen Ausschluss von Krankheitsaktivität bei Wearing-off.</p>${source(s)}</aside></div></section>`;}

  const num=(v,d=1)=>new Intl.NumberFormat('de-DE',{minimumFractionDigits:d,maximumFractionDigits:d}).format(v);
  const source=s=>`<div class="ex-source"><span class="ex-overline">Die Publikation</span><p>${esc(s.citation)}</p><button type="button" data-landmark-paper="${esc(s.paperId)}">Autoren und Publikationsdetails ↗</button><a href="${esc(s.sourceUrl)}" target="_blank" rel="noopener noreferrer">Originalarbeit öffnen ↗</a></div>`;
  const table=(caption,head,rows)=>`<div class="ex-table-scroll" tabindex="0" role="region" aria-label="Datentabelle, bei Bedarf horizontal scrollen"><table><caption>${caption}</caption><thead><tr>${head.map(h=>`<th scope="col">${h}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>`<tr>${row.map((x,i)=>i===0?`<th scope="row">${x}</th>`:`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  const method=(s,content='')=>`<details class="ex-method"><summary>Daten, Methoden und Grenzen</summary><p>${esc(s.methodNote)}</p><p>${esc(s.limitationNote)}</p>${content}</details>`;
  const state={triageModel:'chatgpt4',triageReference:3,triageEstimate:4,triageAssisted:false,participant:1,sort:'id',awake:30,sleepScore:'psqi'};
  const items=[
    {id:'triage',number:'04',label:'KI in der Triage',subtitle:'Triage · 2024'},

  function triage(){const s=D.triage;return `<section class="ex-study" aria-labelledby="study-title"><header class="ex-study-heading"><p class="ex-overline">04 / Manchester-Triage-Benchmark</p><h2 id="study-title">Wie nah liegt eine Einstufung an der Referenz?</h2><p>124 Notfallvignetten wurden mit dem Manchester Triage System bewertet. Die Studie vergleicht Sprachmodelle und Ärztinnen und Ärzte ohne formale MTS-Schulung. Erkunden Sie zuerst die Originalergebnisse.</p></header><div class="ex-layout"><div class="ex-workbench"><div class="ex-original-label">Veröffentlichte Ergebnisse · historische Modellstände</div><div class="ex-panel-select"><label for="triage-model">Konfiguration auswählen<select id="triage-model">${s.models.map(m=>`<option value="${esc(m.id)}" ${m.id===state.triageModel?'selected':''}>${esc(m.label)}</option>`).join('')}</select></label></div><div id="triage-results"></div><div class="ex-observed"><span class="ex-overline">Ärztliche Bewertungen</span><h3 class="ex-subtitle">Was änderte die GPT-4-Zweitmeinung?</h3><div class="ex-condition-switch" role="group" aria-label="Ärztliche Bewertung mit oder ohne KI"><button type="button" data-triage-assisted="false" aria-pressed="${!state.triageAssisted}">Ohne Zweitmeinung</button><button type="button" data-triage-assisted="true" aria-pressed="${state.triageAssisted}">Mit GPT-4-Zweitmeinung</button></div><div id="triage-human"></div></div><div class="ex-observed"><div class="ex-example-label"><span class="ex-overline">Messprinzip</span><strong>Konstruiertes Kategorienpaar · keine Fallvignette</strong></div><p class="ex-compact-note">Ein mathematisches Lehrbeispiel zeigt den Abstand zwischen zwei Kategorien und eine hier gewählte quadratische Normierung. Spielen Sie eine Abweichung in beide Richtungen durch.</p><div class="ex-panel-select"><label for="triage-reference">Referenzkategorie<select id="triage-reference">${s.categories.map(c=>`<option value="${c.value}" ${state.triageReference===c.value?'selected':''}>${c.value} · ${esc(c.label)}</option>`).join('')}</select></label></div><div class="ex-control-block"><label for="triage-estimate">Konstruierte Einstufung <output id="triage-estimate-value" for="triage-estimate"></output></label><input id="triage-estimate" type="range" min="1" max="5" step="1" value="${state.triageEstimate}"><div class="ex-range-stops" aria-hidden="true"><span>1 · höchste Dringlichkeit</span><span>5 · niedrigste</span></div></div><div id="triage-example" role="status" aria-atomic="true"></div></div>${method(s,table('Quadratisch gewichtetes κ, Mittelwert ± Standardabweichung',['Bedingung','Mittelwert','SD'],[...s.models,...s.humans].map(m=>[esc(m.label),num(m.mean,2),num(m.sd,3)])))}</div><aside class="ex-margin"><h3>Übereinstimmung ist kein Sicherheitsnachweis.</h3><p>κ berücksichtigt auch die zufällig erwartete Übereinstimmung. Es ist weder der Anteil exakt richtiger Antworten noch eine Wahrscheinlichkeit für eine sichere Entscheidung.</p><div class="ex-reading" id="triage-reading" aria-live="polite" aria-atomic="true"></div><p>Die Streuung bezieht sich bei Modellen auf vier Durchgänge derselben 124 Vignetten, bei den ärztlichen Bedingungen auf vier Personen. Die Fehlerbalken zeigen Standardabweichungen, keine Konfidenzintervalle.</p><p class="ex-caveat">Die Kategorien im Rechenbeispiel enthalten keine medizinischen Fallinformationen. Das Beispiel bildet weder eine echte Triage noch ein klinisches Assistenzsystem ab.</p>${source(s)}</aside></div></section>`;}
  function updateTriage(){
    const s=D.triage,selected=s.models.find(m=>m.id===state.triageModel)||s.models[0];
    const compact=window.matchMedia('(max-width:620px)').matches, plotWidth=compact?360:700;
    const x=v=>(compact?150:220)+v*(compact?180:420);
    document.getElementById('triage-results').innerHTML=`<div class="ex-result-line"><strong>${num(selected.mean,2)}<span>κ</span></strong><p>${esc(selected.label)}<br><b>SD ${num(selected.sd,3)} · vier Durchgänge</b></p></div><figure class="ex-data-plot"><svg viewBox="0 0 ${plotWidth} ${s.models.length*51+55}" role="img" aria-label="Publizierte Mittelwerte des quadratisch gewichteten Kappa mit Standardabweichungen; alle Werte stehen in der Datentabelle.">${[0,.25,.5,.75,1].map(t=>`<line x1="${x(t)}" x2="${x(t)}" y1="20" y2="${s.models.length*51+10}" stroke="#e0e4e3"/><text x="${x(t)}" y="${s.models.length*51+36}" text-anchor="middle">${num(t,2)}</text>`).join('')}${s.models.map((m,i)=>{const y=30+i*51,col=m.id===selected.id?'#0056b3':'#78858b';return `<text x="5" y="${y+4}" ${m.id===selected.id?'class="ex-selected-text"':''}>${esc(m.shortLabel||m.label)}</text><line x1="${x(m.mean-m.sd)}" x2="${x(m.mean+m.sd)}" y1="${y}" y2="${y}" stroke="${col}" stroke-width="2"/><line x1="${x(m.mean-m.sd)}" x2="${x(m.mean-m.sd)}" y1="${y-7}" y2="${y+7}" stroke="${col}"/><line x1="${x(m.mean+m.sd)}" x2="${x(m.mean+m.sd)}" y1="${y-7}" y2="${y+7}" stroke="${col}"/><circle cx="${x(m.mean)}" cy="${y}" r="${m.id===selected.id?6:4}" fill="${col}"/>`;}).join('')}</svg><figcaption>Punkt: Mittelwert des quadratisch gewichteten κ. Linie: ±1 SD. Gezeigter Achsenausschnitt 0 bis 1; κ kann grundsätzlich auch negativ sein.</figcaption></figure>`;
    const h=s.humans.find(h=>h.assisted===state.triageAssisted);
    document.getElementById('triage-human').innerHTML=`<div class="ex-pair-summary" role="status"><p>Quadratisch gewichtetes κ<strong class="blue">${num(h.mean,2)}</strong>Mittelwert</p><p>Streuung<strong>${num(h.sd,3)}</strong>Standardabweichung</p></div><p class="ex-delta-note">${esc(s.humanComparisonNote)}</p>`;
    document.querySelectorAll('[data-triage-assisted]').forEach(b=>b.setAttribute('aria-pressed',String((b.dataset.triageAssisted==='true')===state.triageAssisted)));
    const diff=state.triageEstimate-state.triageReference,penalty=(diff/4)**2,cat=s.categories.find(c=>c.value===state.triageEstimate);
    document.getElementById('triage-estimate-value').textContent=String(state.triageEstimate);
    document.getElementById('triage-example').innerHTML=`<p class="ex-delta-note"><b>${esc(cat.label)}</b> statt Referenzkategorie ${state.triageReference}: ${diff===0?'gleiche Einstufung':`${Math.abs(diff)} ${Math.abs(diff)===1?'Stufe':'Stufen'} ${diff>0?'weniger dringlich (Untertriage)':'dringlicher (Übertriage)'}`}.</p><div class="ex-pair-summary"><p>Abstand<strong>${Math.abs(diff)}</strong>Kategorien</p><p>Illustratives Fehlergewicht<strong class="rust">${num(penalty,4)}</strong>(Abstand / 4)²</p></div><p class="ex-help">Diese Normierung (Abstand / 4)² dient nur diesem Lehrbeispiel und ist kein κ-Wert. Die konkrete Gewichtsformel der Originalanalyse ist im Paper nicht angegeben. Gleich große Abstände erhalten in beide Richtungen dasselbe Gewicht. Medizinische Konsequenzen werden dadurch nicht gleichgesetzt.</p>`;
    document.getElementById('triage-reading').textContent=`${selected.label}: κ ${num(selected.mean,2)} mit SD ${num(selected.sd,3)}. ${selected.note||'Der Wert fasst die Übereinstimmung mit der Referenz über die Fallserie zusammen.'}`;
  }
  function ambulation(){const s=D.ambulation;return `<section class="ex-study" aria-labelledby="study-title"><header class="ex-study-heading"><p class="ex-overline">05 / Gehfunktion bei Multipler Sklerose</p><h2 id="study-title">Gehstrecken: 16 Schätzungen, 16 Messungen.</h2><p>Die Teilnehmenden schätzten ihre Gehstrecke bis zur ersten nötigen Pause; anschließend wurde sie mit einem Messrad erfasst. Vergleichen Sie die 16 veröffentlichten Wertepaare.</p></header><div class="ex-layout"><div class="ex-workbench"><div class="ex-original-label">Originaldaten · Supplementary Table 3 · keine konstruierten Personen</div><div class="ex-panel-select"><label for="ambulation-person">Veröffentlichte Personen-ID<select id="ambulation-person">${s.pairs.map(p=>`<option value="${p.id}" ${state.participant===p.id?'selected':''}>Person ${p.id}</option>`).join('')}</select></label><label for="ambulation-sort">Reihenfolge im Diagramm<select id="ambulation-sort"><option value="id" ${state.sort==='id'?'selected':''}>Personen-ID</option><option value="difference" ${state.sort==='difference'?'selected':''}>Größte absolute Abweichung zuerst</option><option value="estimate" ${state.sort==='estimate'?'selected':''}>Geschätzte Strecke aufsteigend</option></select></label></div><div id="ambulation-results"></div><p class="ex-compact-note"><a href="${esc(s.supplementUrl)}" target="_blank" rel="noopener noreferrer">Originaltabelle im Supplement öffnen ↗</a></p>${method(s,table('Veröffentlichte Gehstrecken; Meter, Darstellung auf zwei Nachkommastellen',['ID','Geschätzt','Gemessen','Gemessen − geschätzt'],s.pairs.map(p=>[String(p.id),num(p.estimated,2),num(p.measured,2),num(p.measured-p.estimated,2)])))}</div><aside class="ex-margin"><h3>Was 16 Paare zeigen</h3><div class="ex-reading" id="ambulation-reading" aria-live="polite" aria-atomic="true"></div><p>${esc(s.groupNote)}</p><p class="ex-caveat">${esc(s.categoryNote)}</p><p>Die beiden verbundenen Punkte zeigen Schätzung und Messradmessung. Im selben Gehtest korrelierte die Smartwatch-Distanz mit dem Messradwert (Spearman-ρ=0,86; Kohorte n=16, paarweises n nicht separat ausgewiesen). Eine Korrelation belegt keine Austauschbarkeit der Messverfahren.</p>${source(s)}</aside></div></section>`;}
  function updateAmbulation(){
    const s=D.ambulation,p=s.pairs.find(p=>p.id===state.participant),diff=p.measured-p.estimated;
    const sorted=[...s.pairs].sort((a,b)=>state.sort==='difference'?Math.abs(b.measured-b.estimated)-Math.abs(a.measured-a.estimated):state.sort==='estimate'?a.estimated-b.estimated:a.id-b.id);
    const compact=window.matchMedia('(max-width:620px)').matches, plotWidth=compact?360:700, rowHeight=compact?46:38, plotHeight=16*rowHeight+56;
    const max=Math.ceil(Math.max(...s.pairs.flatMap(p=>[p.estimated,p.measured]))/500)*500,x=v=>(compact?38:70)+v/max*(compact?300:560);
    document.getElementById('ambulation-results').innerHTML=`<div class="ex-pair-summary" role="status"><p>Person ${p.id} · Schätzung<strong>${num(p.estimated,2)} m</strong></p><p>Messrad<strong class="blue">${num(p.measured,2)} m</strong></p><p>Gemessen − geschätzt<strong class="rust">${diff>0?'+':''}${num(diff,2)} m</strong></p></div><div class="ex-legend"><span><i style="background:#78858b"></i>Geschätzt</span><span><i style="background:#0056b3;border-radius:50%"></i>Gemessen</span><span>Ausgewählte Person: dunkle Zeile</span></div><figure class="ex-data-plot ex-pair-plot"><svg viewBox="0 0 ${plotWidth} ${plotHeight}" role="group" aria-label="16 veröffentlichte Gehstreckenpaare. Person ${p.id}: geschätzt ${num(p.estimated,2)} Meter, gemessen ${num(p.measured,2)} Meter. Vollständige Werte in der Tabelle.">${[0,.2,.4,.6,.8,1].map(f=>`<line x1="${x(max*f)}" x2="${x(max*f)}" y1="15" y2="${16*rowHeight+10}" stroke="#e0e4e3"/><text x="${x(max*f)}" y="${plotHeight-10}" text-anchor="middle">${num(max*f,0)}</text>`).join('')}${sorted.map((r,i)=>{const y=31+i*rowHeight,sel=r.id===p.id;return `<g role="button" tabindex="0" data-person-id="${r.id}" aria-pressed="${sel}" aria-label="Person ${r.id}: geschätzt ${num(r.estimated,2)} Meter, gemessen ${num(r.measured,2)} Meter. Auswählen"><rect x="0" y="${y-16}" width="${plotWidth}" height="${rowHeight-3}" fill="${sel?'#eaf2f5':'transparent'}"/><text x="8" y="${y+4}" ${sel?'class="ex-selected-text"':''}>${r.id}</text><line x1="${x(r.estimated)}" x2="${x(r.measured)}" y1="${y}" y2="${y}" stroke="${sel?'#151515':'#c0c9cc'}" stroke-width="${sel?3:2}"/><rect x="${x(r.estimated)-4}" y="${y-4}" width="8" height="8" fill="#78858b"/><circle cx="${x(r.measured)}" cy="${y}" r="${sel?6:4}" fill="#0056b3"/>${sel?`<text x="${compact?38:70}" y="${y+18}" class="ex-pair-values">${num(r.estimated,2)} → ${num(r.measured,2)} m</text>`:''}</g>`;}).join('')}</svg><figcaption>Horizontalachse: Meter. Jede Zeile verbindet die beiden Originalwerte einer Person. Quadrat: Schätzung; Kreis: Messrad. Zeile anklicken oder eine Person oben auswählen. Die Achse beginnt bei null.</figcaption></figure>`;
    document.getElementById('ambulation-reading').innerHTML=`<span class="ex-overline">Person ${p.id}</span><p>Die gemessene Strecke war ${num(Math.abs(diff),2)} Meter ${diff>0?'länger':'kürzer'} als geschätzt. Das beschreibt die Abweichung in dieser Messung, keine Ursache und keine Veränderung der Erkrankung.</p>`;
  }
  function sleep(){const s=D.sleep;return `<section class="ex-study" aria-labelledby="study-title"><header class="ex-study-heading"><p class="ex-overline">06 / Schlafmonitoring bei CIDP</p><h2 id="study-title">Acht Stunden im Bett sind nicht acht Stunden Schlaf.</h2><p>Schlafdauer, Wachzeit nach dem Einschlafen und Schlafeffizienz beschreiben unterschiedliche Aspekte einer Nacht. Verändern Sie zunächst ein Rechenbeispiel und betrachten Sie danach die publizierten Zusammenhänge.</p></header><div class="ex-layout"><div class="ex-workbench"><div class="ex-example-label"><span class="ex-overline">Messprinzip</span><strong>Konstruiertes Ein-Nacht-Beispiel · keine Studiendaten</strong></div><p class="ex-compact-note">Zeit im Bett: 8 Stunden. Einschlaflatenz: 20 Minuten. Verändern Sie die gesamte Wachzeit nach dem Einschlafen (WASO).</p><div class="ex-control-block"><label for="sleep-awake">Wachzeit nach dem Einschlafen <output id="sleep-awake-value" for="sleep-awake"></output></label><input id="sleep-awake" type="range" min="0" max="120" step="5" value="${state.awake}"><div class="ex-range-stops" aria-hidden="true"><span>0 min</span><span>60 min</span><span>120 min</span></div></div><div id="sleep-example"></div><div class="ex-observed"><div class="ex-original-label">Veröffentlichte Ergebnisse · sechsmonatiges Monitoring · n=40</div><h3 class="ex-subtitle">Sensorwerte und klinische Fragebögen</h3><p class="ex-compact-note">Die folgenden Korrelationen vergleichen Personen anhand ihrer jeweiligen Median-Schlafmaße und der Median-Scores aus V1–V3. Sie verändern sich nicht mit dem Beispiel darüber.</p><div class="ex-panel-select"><label for="sleep-score">Vergleich mit<select id="sleep-score">${s.scores.map(c=>`<option value="${c.id}" ${state.sleepScore===c.id?'selected':''}>${esc(c.label)}</option>`).join('')}</select></label></div><div id="sleep-correlations" role="status" aria-atomic="true"></div><p class="ex-key-figure">${esc(s.latencyNote)}</p>${method(s,table('Publizierte Spearman-Korrelationen; keine nachträglich geschätzten Konfidenzintervalle',['Schlafmaß',...s.scores.map(c=>esc(c.label))],s.correlations.map(c=>[esc(c.label),...s.scores.map(k=>num(c[k.id],2))])))}</div></div><aside class="ex-margin"><h3>Was das Beispiel voraussetzt</h3><p>Schlafeffizienz ist der Anteil der Zeit im Bett, der als Schlaf zählt. Hier rechnen wir mit festgelegten Zeiten; die Uhr und der Fragebogen sind daran nicht beteiligt.</p><div class="ex-reading" id="sleep-reading" aria-live="polite" aria-atomic="true"></div><p>Das Band zeigt addierte Zeitanteile, keinen zeitlichen Verlauf und keine Schlafstadien. Die Wachzeit wird nicht in einzelne Episoden aufgeteilt.</p><p class="ex-caveat">${esc(s.deviceNote)}</p>${source(s)}</aside></div></section>`;}
  function updateSleep(){
    const s=D.sleep,tst=480-20-state.awake,se=tst/480*100;
    document.getElementById('sleep-awake-value').textContent=`${state.awake} min`;
    document.getElementById('sleep-example').innerHTML=`<div class="ex-night-track" aria-hidden="true"><div class="ex-night-segment latency" style="width:${20/480*100}%"></div><div class="ex-night-segment asleep" style="width:${se}%"></div><div class="ex-night-segment awake" style="width:${state.awake/480*100}%"></div></div><div class="ex-night-scale"><span>0</span><span>480 Minuten im Bett</span></div><div class="ex-legend"><span><i style="background:#7a858b"></i>Einschlafen: 20 min</span><span><i style="background:#0056b3"></i>Schlaf: ${tst} min</span><span><i style="background:#c55a2d"></i>WASO: ${state.awake} min</span></div><p class="ex-night-caption">Zeitanteile, keine zeitliche Abfolge.</p><div class="ex-pair-summary"><p>Konstruierte Schlafdauer<strong>${Math.floor(tst/60)} h ${tst%60} min</strong></p><p>Konstruierte Schlafeffizienz<strong class="blue">${num(se)} %</strong>${tst} / 480 × 100</p></div>`;
    document.getElementById('sleep-reading').innerHTML=`<span class="ex-overline">Ihre Einstellung</span><p>${state.awake} Minuten WASO ergeben hier ${tst} Minuten Schlaf und ${num(se)} % Schlafeffizienz. In diesem Beispiel gibt es keine zusätzliche Wachzeit zwischen endgültigem Erwachen und Aufstehen.</p>`;
    const score=s.scores.find(c=>c.id===state.sleepScore);
    const correlationHtml=`<p class="ex-help">${esc(score.direction)} Spearman-ρ; n=40.</p><div class="ex-correlation-scale"><span>−1</span><span>0</span><span>+1</span></div>${s.correlations.map(c=>`<div class="ex-corr-row"><span>${esc(c.label)}</span><div class="ex-corr-track"><i></i><b style="left:${c[score.id]<0?50+c[score.id]*50:50}%;width:${Math.abs(c[score.id])*50}%;background:${c[score.id]<0?'#c55a2d':'#0056b3'}"></b></div><strong>${num(c[score.id],2)}</strong></div>`).join('')}<p class="ex-help">Zusammenhänge zwischen Personen; keine Vorhersage, wie sich ein Score nach einer unruhigen Nacht verändert.</p>`;
    const correlationRegion=document.getElementById('sleep-correlations');
    if(correlationRegion.dataset.score!==score.id){correlationRegion.innerHTML=correlationHtml;correlationRegion.dataset.score=score.id;}
  }
  function selectPerson(id,focusRow=false){state.participant=Number(id);document.getElementById('ambulation-person').value=String(id);updateAmbulation();if(focusRow)document.querySelector(`[data-person-id="${id}"]`)?.focus({preventScroll:true});}
  document.addEventListener('keydown',e=>{const row=e.target.closest('[data-person-id]');if(row&&['Enter',' '].includes(e.key)){e.preventDefault();selectPerson(row.dataset.personId,true);}});
  document.addEventListener('click',e=>{const row=e.target.closest('[data-person-id]');if(row)return selectPerson(row.dataset.personId,true);const b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-triage-assisted')){state.triageAssisted=b.dataset.triageAssisted==='true';updateTriage();}});
  document.addEventListener('change',e=>{
    const id=e.target.id,value=e.target.value;
    if(id==='triage-model'){state.triageModel=value;updateTriage();}
    if(id==='triage-reference'){state.triageReference=Number(value);updateTriage();}
    if(id==='ambulation-person'){state.participant=Number(value);updateAmbulation();}
    if(id==='ambulation-sort'){state.sort=value;updateAmbulation();}
    if(id==='sleep-score'){state.sleepScore=value;updateSleep();}
  });
  document.addEventListener('input',e=>{if(e.target.id==='triage-estimate'){state.triageEstimate=Number(e.target.value);updateTriage();}if(e.target.id==='sleep-awake'){state.awake=Number(e.target.value);updateSleep();}});
  window.addEventListener('resize',()=>{if(document.getElementById('ambulation-results'))updateAmbulation();else if(document.getElementById('triage-results'))updateTriage();});
  window.AdditionalStudies={items,render:id=>({triage,ambulation,sleep})[id]?.() ?? window.RecentStudies.render(id),mount:id=>{const update=({triage:updateTriage,ambulation:updateAmbulation,sleep:updateSleep})[id];if(update)update();else window.RecentStudies.mount(id);}};
})();

(() => {

  function render() {
    return `<div class="exhibition"><header class="ex-intro"><div><p class="ex-overline">AG MARS · Digitale Translation</p><h1>Studien zum Ausprobieren</h1></div><p>Verändern Sie eine Annahme, vergleichen Sie Antworten oder untersuchen Sie ein Messprinzip. Die veröffentlichten Ergebnisse stehen jeweils daneben.</p></header><nav class="ex-index" aria-label="Interaktive Studie auswählen">${studies.map(s=>`<button type="button" data-study="${s.id}" aria-pressed="${state.study===s.id}"><span class="ex-index-number">${s.number}</span><span><strong>${esc(s.author)} – ${esc(s.label)}</strong><small>${s.subtitle}</small></span></button>`).join('')}</nav><label class="ex-mobile-study" for="ex-study-select">Studie auswählen<select id="ex-study-select">${studies.map(s=>`<option value="${s.id}" ${state.study===s.id?'selected':''}>${esc(s.author)} – ${esc(s.label)}</option>`).join('')}</select></label><div id="exhibit-stage">${studyHtml()}</div><div class="ex-to-archive"><p>${window.RESEARCH_DATA.meta.publicMode ? `Im Verzeichnis finden Sie ${window.RESEARCH_DATA.publications.length} Publikationen aus Digital Health und Neurologie.` : `Die vollständige Sammlung enthält ${window.RESEARCH_DATA.publications.length} Publikationen und ${window.RESEARCH_DATA.projects.length} dokumentierte Projekte.`}</p><button type="button" data-ex-archive>Zum Publikationsverzeichnis →</button></div></div>`;
  }
  function studyHtml() { return state.study==='stroke'?stroke():state.study==='rag'?rag():state.study==='wearables'?wearables():(window.IsochroneStudies.items.some(s=>s.id===state.study)?window.IsochroneStudies.render(state.study):window.AdditionalStudies.render(state.study)); }
  function mount() { update(); }
  function update() {

  function chooseStudy(id) {

    } catch { /* Restricted local previews may not allow URL updates. */ }
    document.getElementById('ex-study-select').value=id;
