    document.getElementById('exhibit-stage').innerHTML=studyHtml();
    update();
    document.getElementById('exhibit-stage').scrollIntoView({block:'start'});
  }
  function stroke() {
    const s=D.stroke;
    return `<section class="ex-study" aria-labelledby="study-title"><header class="ex-study-heading"><p class="ex-overline">01 / Modellierung der Versorgung</p><h2 id="study-title">Der kürzere Weg zur CT kann Zeit sparen.</h2><p>Eine wohnortnahe CT-Klinik mit Telemedizin könnte früheren Zugang zu Diagnostik und IVT ermöglichen. Zusätzliche Abläufe vor Ort können diesen Vorteil aufzehren.</p></header><div class="ex-layout"><div class="ex-workbench"><figure class="ex-routes"><svg viewBox="0 0 720 185" role="img" aria-label="Schematischer Vergleich: direkte Fahrt zur Stroke Unit oder Fahrt zu einer näheren CT-Klinik mit telemedizinischer Unterstützung. Keine maßstäblichen Fahrzeiten."><path d="M95 82L580 36M95 82L380 137" stroke="#ccd0d1" stroke-width="2" fill="none"/><path d="M388 137H590" stroke="#c55a2d" stroke-width="3" stroke-dasharray="5 5"/><circle cx="95" cy="82" r="10" fill="#151515"/><circle cx="580" cy="36" r="10" fill="#0056b3"/><rect x="371" y="128" width="18" height="18" fill="#c55a2d"/><text x="20" y="55">Wohnort</text><text x="315" y="26" fill="#0056b3">Direkt zur Stroke Unit</text><text x="195" y="126">Nähere CT-Klinik</text><text x="408" y="162" fill="#a14622">Telemedizin + Zusatzzeit</text><text x="606" y="42" class="ex-svg-small">CT / IVT</text><text x="606" y="143" class="ex-svg-small">CT / IVT</text></svg><figcaption>Wege schematisch. Betrachteter Endpunkt: Zugang zu CT / IVT.</figcaption></figure><div class="ex-control-block"><label for="stroke-delay">Zusätzliche Verzögerung bis CT / IVT in der näheren Klinik <output id="stroke-delay-value" for="stroke-delay">${state.delay} min</output></label><input id="stroke-delay" type="range" min="0" max="30" step="10" value="${state.delay}" aria-describedby="stroke-delay-help"><div class="ex-range-stops" aria-hidden="true"><span>0 min</span><span>10 min</span><span>20 min</span><span>30 min</span></div><p class="ex-help" id="stroke-delay-help">Vier veröffentlichte Szenarien aus Tabelle 2. Bewegen Sie den Regler mit Maus, Touch oder Pfeiltasten.</p></div><div id="stroke-result"></div><details class="ex-method"><summary>Daten und Definitionen</summary><p>${esc(s.methodNote)}</p><p>${esc(s.denominatorNote)}</p><div class="ex-table-scroll" tabindex="0" role="region" aria-label="Datentabelle, bei Bedarf horizontal scrollen"><table><caption>Anteil mit mindestens 10 Minuten früherem Zugang, laut Publikation</caption><thead><tr><th scope="col">Zusatzzeit</th><th scope="col">Bevölkerungsanteil</th></tr></thead><tbody>${s.scenarios.map(r=>`<tr><th scope="row">${r.delay} min</th><td>${num(r.benefit10)} %</td></tr>`).join('')}</tbody></table></div></details></div><aside class="ex-margin"><h3>Die Annahme hinter dem Ergebnis</h3><p>Die Fahrzeit ist nur ein Teil des Ablaufs. Der Regler verändert die zusätzliche Verzögerung, die das Modell für die nähere Klinik annimmt.</p><p>Die Abbildung zeigt modellierte Bevölkerungsanteile. Sie beschreibt keine gemessenen Behandlungszeiten oder individuellen Therapieentscheidungen.</p><div class="ex-reading" id="stroke-reading" aria-live="polite"></div>${source(s)}</aside></div></section>`;
  }
  function updateStroke() {
    const s=D.stroke, row=s.scenarios.find(r=>r.delay===state.delay);
    document.getElementById('stroke-delay-value').textContent=`${state.delay} min`;
    const max=Math.max(...s.scenarios.flatMap(r=>r.categories.map(c=>c.percent)));
    document.getElementById('stroke-result').innerHTML=`<div class="ex-result-line" role="status"><strong>${num(row.benefit10)}<span>%</span></strong><p>der Bevölkerung mit modelliertem Zugang<br><b>mindestens 10 Minuten früher</b><br><small>Angabe aus dem Ergebnisteil*</small></p></div><figure class="ex-distribution"><figcaption>Verteilung des Zeitgewinns bei ${state.delay} Minuten Zusatzverzögerung</figcaption><div class="ex-distribution-axis"><span>Bevölkerungsanteil</span><span>0–${Math.ceil(max)} %</span></div>${row.categories.map((c,i)=>`<div class="ex-dist-row"><span>${esc(c.label)}</span><div class="ex-dist-track"><div class="ex-dist-bar ${c.kind==='other'?'other':c.kind==='neutral'?'neutral':''}" style="width:${100*c.percent/max}%"></div></div><strong>${num(c.percent)} %</strong></div>`).join('')}<p class="ex-help">* Balken: Tabelle 2; Prozentwerte auf eine Nachkommastelle gerundet. Die Summen stimmen nicht durchgängig mit dem Ergebnisteil überein (siehe Daten und Definitionen). Grau: Erreichbarkeitsgrenzen und Unterschiede unter 10 Minuten. Blau: Zeitgewinne ab 10 Minuten.</p></figure>`;
    const delta=D.stroke.scenarios[0].benefit10-row.benefit10;
    document.getElementById('stroke-reading').innerHTML=`<span class="ex-overline">Ihre Einstellung</span><p>${state.delay===0?'Ohne zusätzliche Verzögerung liegt der modellierte Anteil mit mindestens 10 Minuten Gewinn bei 36,4 %.':`Bei ${state.delay} Minuten Zusatzverzögerung sinkt dieser Anteil um ${num(delta)} Prozentpunkte gegenüber dem Szenario ohne Zusatzverzögerung.`}</p>`;
  }
  function rag() {
    const r=D.rag;
    return `<section class="ex-study" aria-labelledby="study-title"><header class="ex-study-heading"><p class="ex-overline">02 / Leitlinien-Benchmark</p><h2 id="study-title">GPT-4o mit und ohne Leitlinien-RAG.</h2><p>Wir stellten Sprachmodellen 130 Fragen aus neurologischen Leitlinien. Vergleichen Sie GPT-4o ohne Zusatzdokumente mit der Dokument-RAG-Konfiguration.</p></header><div class="ex-layout"><div class="ex-workbench"><div class="ex-condition-switch" role="group" aria-label="GPT-4o-Bedingung"><button type="button" data-rag-condition="${r.baselineId}" aria-pressed="${state.condition===r.baselineId}">GPT-4o · ohne Dokumente</button><button type="button" data-rag-condition="${r.documentId}" aria-pressed="${state.condition===r.documentId}">GPT-4o · mit Leitlinien</button></div><div class="ex-rag-controls"><label for="rag-outcome">Betrachteter Endpunkt<select id="rag-outcome"><option value="accuracy" ${state.ragMetric==='accuracy'?'selected':''}>Antwortkorrektheit</option><option value="hallucinations" ${state.ragMetric==='hallucinations'?'selected':''}>Antworten mit fehlerhaften oder erfundenen Quellen</option></select></label><label for="rag-condition">Weitere Systeme (7 von 9)<select id="rag-condition">${r.conditions.map(c=>`<option value="${esc(c.id)}" ${state.condition===c.id?'selected':''}>${esc(c.label)}</option>`).join('')}</select></label></div><div id="rag-result"></div><details class="ex-method"><summary>Bewertung und vollständige Zahlen</summary><p>${esc(r.methodNote)}</p><p>${esc(r.hallucinationDefinition)}</p><div class="ex-table-scroll" tabindex="0" role="region" aria-label="Datentabelle, bei Bedarf horizontal scrollen"><table><caption>Je ${r.n} Antworten pro Bedingung</caption><thead><tr><th scope="col">System</th><th scope="col">Korrekt</th><th scope="col">Ungenau</th><th scope="col">Falsch</th><th scope="col">Fehlerhafte/erfundene Quellen</th></tr></thead><tbody>${r.conditions.map(c=>`<tr><th scope="row">${esc(c.label)}</th><td>${c.correct}</td><td>${c.imprecise}</td><td>${c.incorrect}</td><td>${c.hallucinations}</td></tr>`).join('')}</tbody></table></div></details></div><aside class="ex-margin"><h3>Dokumente als zusätzliche Quelle</h3><p>Beim Dokument-Retrieval erhält das Modell Zugriff auf abgerufene Leitlinienpassagen. Der Dokumentzugriff umfasste genau die 13 Leitlinien, aus denen die Benchmark-Fragen entstanden.</p><div class="ex-reading" id="rag-reading" aria-live="polite"></div><p>Vier Antworten je Frage ergeben 520 Bewertungen pro Bedingung. Die 130 Fragen bleiben die gemeinsamen Aufgaben. Die Grafik ordnet Antworten nach Bewertung, nicht nach Fragen oder Zeit.</p><p class="ex-caveat">Historische Modellstände, Abfragen bis November 2024. Die Untersuchung prüft einen Leitlinien-Benchmark und belegt keine Sicherheit bei realen Patientenentscheidungen.</p>${source(r)}</aside></div></section>`;
  }
  function updateRag() {
    const r=D.rag, c=r.conditions.find(c=>c.id===state.condition), base=r.conditions.find(c=>c.id===r.baselineId);
    const accuracy=state.ragMetric==='accuracy';
    const groups=accuracy?[{label:'Korrekt',n:c.correct,color:'#0056b3'},{label:'Ungenau',n:c.imprecise,color:'#d6ac59'},{label:'Falsch',n:c.incorrect,color:'#bf512f'}]:[{label:'Mit fehlerhafter/erfundener Quelle',n:c.hallucinations,color:'#bf512f'},{label:'Ohne diesen Befund',n:r.n-c.hallucinations,color:'#ced4d6'}];
    let offset=0;
    const dots=groups.map(g=>{const squares=Array.from({length:g.n},(_,i)=>{const index=offset+i;return `<rect x="${index%26*18}" y="${Math.floor(index/26)*18}" width="13" height="13" fill="${g.color}"/>`;}).join('');offset+=g.n;return squares;}).join('');
    const value=accuracy?c.correct:c.hallucinations;
    document.getElementById('rag-result').innerHTML=`<div class="ex-result-line" role="status"><strong>${value}<span>/${r.n}</span></strong><p>${accuracy?'korrekt bewertete Antworten':'Antworten mit fehlerhaften oder erfundenen Quellen'}<br><b>${num(value/r.n*100)} % · ${esc(c.shortLabel||c.label)}</b></p></div><figure class="ex-answer-grid"><svg viewBox="0 0 468 360" role="img" aria-label="${esc(c.label)}: ${groups.map(g=>`${g.n} ${g.label}`).join(', ')}. Ein Quadrat entspricht einer bewerteten Antwort.">${dots}</svg><figcaption><span>Ein Quadrat = eine bewertete Antwort</span><span>Nach Bewertung sortiert</span></figcaption></figure><div class="ex-legend">${groups.map(g=>`<span><i style="background:${g.color}"></i>${g.label} <b>${g.n}</b></span>`).join('')}</div>`;
    document.querySelectorAll('[data-rag-condition]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.ragCondition===state.condition)));
    document.getElementById('rag-condition').value=state.condition;
    const delta=accuracy?c.correct-base.correct:base.hallucinations-c.hallucinations;
    let explanation;
    if(c.id===r.baselineId) explanation='Dies ist die Referenzbedingung. Wechseln Sie zur Dokument-RAG-Konfiguration. Sie nutzt dieselbe Modellversion, aber einen anderen Antwortablauf.';
    else if(c.id===r.documentId) explanation=accuracy?`${delta} mehr korrekt bewertete Antworten in der Summe als bei GPT-4o ohne Dokumente. Das ist kein Nachweis, dass genau diese einzelnen Antworten durch Retrieval korrigiert wurden.`:`${delta} weniger Antworten mit fehlerhaften oder erfundenen Quellen als bei GPT-4o ohne Dokumente. Auch mit Retrieval bleiben solche Antworten bestehen.`;
    else explanation=`${esc(c.comparisonNote || 'Bei diesem Vergleich wechseln Modell und gegebenenfalls Retrieval-Verfahren. Unterschiede lassen sich daher nicht allein dem Quellenzugriff zuschreiben.')}`;
    document.getElementById('rag-reading').innerHTML=`<span class="ex-overline">Zum Vergleich</span><p>${explanation}</p>`;
  }
  const exampleDays=[3600,4400,5100,3900,6200,5700,4500,4100,5300,6800,4900,7200,4300,5900];
  function wearableExample(values,missing) {
    const observed=values.filter((_,i)=>!(missing&&i===6));
    return {mean:observed.reduce((a,b)=>a+b,0)/observed.length,max:Math.max(...observed),n:observed.length};
  }
  function wearables() {
    const w=D.wearables;
    return `<section class="ex-study" aria-labelledby="study-title"><header class="ex-study-heading"><p class="ex-overline">03 / Digitale Aktivitätsmarker bei CIDP</p><h2 id="study-title">Ein Durchschnitt und ein Maximum beschreiben verschiedene Dinge.</h2><p>Die Auswahl des Aktivitätsmaßes verändert, was wir im Alltag sehen. Prüfen Sie zuerst das Messprinzip und vergleichen Sie anschließend die veröffentlichten Zusammenhänge mit klinischen Scores.</p></header><div class="ex-layout"><div class="ex-workbench"><div class="ex-example-label"><span class="ex-overline">Messprinzip</span><strong>Konstruiertes 14-Tage-Beispiel · keine Studiendaten</strong></div><div id="wearable-example"></div><div class="ex-control-block"><label for="wearable-day">Schritte an Tag 7 <output id="wearable-day-value" for="wearable-day">${num(state.day,0)}</output></label><input id="wearable-day" type="range" min="0" max="14000" step="100" value="${state.day}" ${state.missing?'disabled':''}><div class="ex-range-stops" aria-hidden="true"><span>0</span><span>7.000</span><span>14.000</span></div><label class="ex-check"><input id="wearable-missing" type="checkbox" ${state.missing?'checked':''}>Tag 7 fehlt in der Aufzeichnung</label><button type="button" class="ex-reset" data-example-reset>Beispiel zurücksetzen</button></div><div class="ex-observed"><div class="ex-observed-head"><div><span class="ex-overline">Veröffentlichte Studiendaten</span><h3>Zusammenhang mit klinischer Funktion</h3></div><label for="wearable-score">Klinischer Score<select id="wearable-score"><option value="irods" ${state.score==='irods'?'selected':''}>I-RODS</option><option value="incat" ${state.score==='incat'?'selected':''}>INCAT</option><option value="mrc" ${state.score==='mrc'?'selected':''}>MRC-Summenscore</option></select></label></div><p class="ex-observed-context">Höchste gesamte Tagesschrittzahl über etwa sechs Monate und klinischer Score am Schlussbesuch. Smartwatch-Kohorte, n=43.</p><div id="wearable-correlations"></div><details class="ex-method"><summary>Studiendesign und Werte</summary><p>${esc(w.methodNote)}</p><p>${esc(w.correlationNote)}</p><div class="ex-table-scroll" tabindex="0" role="region" aria-label="Datentabelle, bei Bedarf horizontal scrollen"><table><caption>Spearman-Korrelationen aus der Originalarbeit</caption><thead><tr><th scope="col">Wearable-Maß</th><th scope="col">I-RODS</th><th scope="col">INCAT</th><th scope="col">MRC</th></tr></thead><tbody>${w.correlations.map(c=>`<tr><th scope="row">${esc(c.label)}</th><td>${num(c.irods,2)}</td><td>${num(c.incat,2)}</td><td>${num(c.mrc,2)}</td></tr>`).join('')}</tbody></table></div></details></div></div><aside class="ex-margin"><h3>Was ein einzelner Tag verändert</h3><p>Verändern Sie den orange markierten Tag. Der Mittelwert berücksichtigt jeden aufgezeichneten Tag. Das Maximum ist der höchste aufgezeichnete Tageswert.</p><div class="ex-reading" id="wearable-reading"></div><p id="wearable-announcement" class="sr-only" role="status" aria-atomic="true"></p><p>Eine Messlücke ist kein Tag mit null Schritten. Das Beispiel schließt fehlende Werte aus der Berechnung aus.</p><p class="ex-caveat">Die Studie untersucht Zusammenhänge zwischen Personen. Aus einer einzelnen Tagesänderung folgt keine Änderung eines klinischen Scores.</p>${source(w)}</aside></div></section>`;
  }
  function updateWearables() {
    const values=[...exampleDays];values[6]=state.day;
    const stat=wearableExample(values,state.missing), y=v=>220-v/14000*190;
    document.getElementById('wearable-day-value').textContent=state.missing?'Messlücke':num(state.day,0);
    document.getElementById('wearable-day').disabled=state.missing;
    document.getElementById('wearable-example').innerHTML=`<figure class="ex-daily-plot"><svg viewBox="0 0 700 270" role="img" aria-label="Konstruiertes Beispiel mit ${stat.n} beobachteten Tagen. Mittelwert ${Math.round(stat.mean)} Schritte, Maximum ${stat.max} Schritte.">${[0,7000,14000].map(v=>`<line x1="54" x2="685" y1="${y(v)}" y2="${y(v)}" stroke="#dee1df"/><text x="43" y="${y(v)+4}" text-anchor="end" class="ex-svg-small">${num(v,0)}</text>`).join('')}${values.map((v,i)=>state.missing&&i===6?`<path d="M${64+i*44} 212l16 8m-16 0 16-8" stroke="#c55a2d" stroke-width="2"/>`:`<rect x="${64+i*44}" y="${y(v)}" width="23" height="${220-y(v)}" fill="${i===6?'#c55a2d':'#b5c1d4'}"/>`).join('')}<line x1="54" x2="685" y1="${y(stat.mean)}" y2="${y(stat.mean)}" stroke="#0056b3" stroke-dasharray="5 4" stroke-width="2"/><line x1="54" x2="685" y1="${y(stat.max)}" y2="${y(stat.max)}" stroke="#151515" stroke-dasharray="2 4"/>${values.map((_,i)=>`<text x="${75+i*44}" y="241" text-anchor="middle" class="ex-svg-small">${i+1}</text>`).join('')}<text x="370" y="264" text-anchor="middle" class="ex-svg-small">Tag</text></svg><figcaption>Schritte pro Tag. Orange: Ihr veränderbarer Tag.</figcaption></figure><div class="ex-example-stats"><p><span>Mittelwert · blaue Linie</span><strong>${num(stat.mean,0)}</strong> Schritte / Tag</p><p><span>Maximum · schwarze Linie</span><strong>${num(stat.max,0)}</strong> Schritte an einem Tag</p></div>`;
    document.getElementById('wearable-reading').innerHTML=`<span class="ex-overline">Im konstruierten Beispiel</span><p>${state.missing?`Der Mittelwert verwendet ${stat.n} beobachtete Tage. Würde man die Lücke als null zählen, ergäbe sich ein anderer Wert.`:state.day>7200?'Tag 7 ist jetzt der aktivste Tag. Er verändert sowohl das Maximum als auch den Mittelwert. Ein einzelner ungewöhnlicher Wert kann das Maximum bestimmen.':'Das Maximum bleibt bei 7.200 Schritten. Der veränderte Tag beeinflusst den Mittelwert, obwohl der höchste Tageswert gleich bleibt.'}</p>`;
    const rows=D.wearables.correlations, score=state.score;
    document.getElementById('wearable-announcement').textContent=`Beispiel: ${stat.n} beobachtete Tage. Mittelwert ${num(stat.mean,0)} Schritte pro Tag, Maximum ${num(stat.max,0)} Schritte. Separates Studienergebnis: ${score==='irods'?'I-RODS':score==='incat'?'INCAT':'MRC-Summenscore'}, Spearman-Rho ${num(rows[0][score],2)}, n gleich 43.`;
    const scoreDirection=score==='irods'?'Höherer I-RODS = weniger Einschränkung.':score==='incat'?'Höherer INCAT = stärkere Einschränkung.':'Höherer MRC-Summenscore = mehr Muskelkraft.';
    document.getElementById('wearable-correlations').innerHTML=`<p class="ex-help">${scoreDirection} Spearman-ρ; die Länge zeigt die Stärke, das Vorzeichen die Richtung.</p><div class="ex-correlation-scale"><span>−1</span><span>0</span><span>+1</span></div>${rows.map(c=>`<div class="ex-corr-row"><span>${esc(c.label)}</span><div class="ex-corr-track"><i></i><b style="left:${c[score]<0?50+c[score]*50:50}%;width:${Math.abs(c[score])*50}%;background:${c[score]<0?'#c55a2d':'#0056b3'}"></b></div><strong>${num(c[score],2)}</strong></div>`).join('')}<p class="ex-help">${esc(D.wearables.sampleNote)} Die Koeffizienten bleiben vom konstruierten Beispiel unbeeinflusst.</p>`;
  }
  document.addEventListener('click',event=>{
    const b=event.target.closest('button');if(!b)return;
    if(b.dataset.study) return chooseStudy(b.dataset.study);
    if(b.dataset.landmarkPaper) return dispatch('atlas:open-paper',{id:b.dataset.landmarkPaper});
    if(b.hasAttribute('data-ex-archive')) return dispatch('atlas:navigate',{view:'publications'});
    if(b.dataset.ragCondition){state.condition=b.dataset.ragCondition;return updateRag();}
    if(b.hasAttribute('data-example-reset')){state.day=4500;state.missing=false;document.getElementById('wearable-day').value='4500';document.getElementById('wearable-missing').checked=false;updateWearables();}
  });
  document.addEventListener('input',event=>{
    if(event.target.id==='stroke-delay'){state.delay=Number(event.target.value);updateStroke();}
    if(event.target.id==='wearable-day'){state.day=Number(event.target.value);updateWearables();}
  });
  document.addEventListener('change',event=>{
    if(event.target.id==='ex-study-select')return chooseStudy(event.target.value);
    if(event.target.id==='rag-condition'){state.condition=event.target.value;updateRag();}
    if(event.target.id==='rag-outcome'){state.ragMetric=event.target.value;updateRag();}
    if(event.target.id==='wearable-score'){state.score=event.target.value;updateWearables();}
    if(event.target.id==='wearable-missing'){state.missing=event.target.checked;updateWearables();}
  });
  window.ResearchExhibits={render,mount};
})();

(() => {

  function about() {
    const source=safeUrl(meta.sourceUrl);
    return `${header('DOKUMENTATION','Quellen und Einordnung',publicMode ? 'Herkunft der Publikationsdaten und Methoden der interaktiven Studien.' : 'Herkunft der Publikationsdaten, Auswahl der Beiträge und dokumentierte Projektstände.')}<div class="about-layout"><div><section class="about-block"><h2>Was die Sammlung umfasst</h2><p>${esc((meta.scopeNote || 'Die Sammlung bündelt Publikationen von Lars Masanneck und Marc Pawlitzki aus Digital Health und Neurologie, einschließlich Kooperationen und früherer wissenschaftlicher Arbeiten. Sie ist keine vollständige Mitgliederbibliografie der Arbeitsgruppe.').replace(/^Kuratierte Sammlung/, 'Sammlung'))}</p><p>Forschungsfelder sind redaktionelle Zuordnungen. Mehrfachzuordnungen machen inhaltliche Verbindungen sichtbar. Die Kategorien „Digital Health / Neurologie“, „Kooperationen“ und „Frühe Arbeiten“ dienen der Orientierung und behaupten keine institutionelle Alleinautorschaft.</p></section><section class="about-block"><h2>${publicMode ? 'Publikationsdaten' : 'Publikationen und Projekte'}</h2><p>Publikationstitel, Autor:innen, Journal, Jahr und Identifikatoren sind an den auf jeder Detailseite verlinkten Quellen überprüfbar. Das angezeigte Jahr folgt der bibliografischen Zuordnung; ein früheres Online-Publikationsjahr wird in den Details ausgewiesen, wenn es abweicht.</p>${publicMode ? '' : '<p>Projektkarten bilden den zuletzt dokumentierten Stand ab. Ein vorbereitetes Manuskript oder Einreichungspaket gilt nicht als veröffentlichte Arbeit. Nächste Schritte wurden aus den dokumentierten offenen Punkten abgeleitet; sie sind keine verbindliche Terminplanung.</p>'}</section><section class="about-block"><h2>Interaktive Studien</h2><p>Die Studienansichten verwenden geprüfte Zahlen aus den Originalpublikationen. Die Schlaganfallansicht zeigt vier publizierte Szenarien; der Leitlinien-Benchmark zeigt aggregierte Bewertungen von Antworten. Das veränderbare 14-Tage-Wearable-Beispiel ist ausdrücklich konstruiert. Die daneben gezeigten klinischen Korrelationen stammen separat aus der Originalarbeit. Hinzu kommen die veröffentlichten Triage-Übereinstimmungen, 16 Originalpaare geschätzter und gemessener Gehstrecken sowie ein konstruiertes Schlafzeitbudget mit separat dargestellten Originalkorrelationen.</p><p>Methoden, Quellen und bekannte Inkonsistenzen stehen direkt bei jeder Studienansicht. Drei weitere Ansichten zeigen Wearing-off-Häufigkeiten und standardisierte Aktivität (SATURATE), Therapieangaben nach Brisa-Registrierungszeitraum sowie Web-RAG mit und ohne Quellenbeschränkung. Veränderungen eines Beispiels sind keine neuen Studienergebnisse.</p><button type="button" class="quiet-link" data-view="studies">Studien erkunden →</button></section><section class="about-block"><h2>Mit dem Atlas arbeiten</h2><ul><li>Nach Titel, Autor:in, Stichwort, DOI oder PMID suchen; mit <kbd>/</kbd> direkt ins Suchfeld springen.</li><li>Autorenschaft, Forschungsfelder, Jahre, Beitragstypen und Zuordnung kombinieren.</li><li>Eine persönliche Merkliste über das Lesezeichen anlegen. Sie wird ausschließlich in diesem Browser gespeichert.</li><li>Die aktuell gefilterte Auswahl als BibTeX oder JSON exportieren.</li></ul><p>Die HTML-Datei benötigt keine Netzwerkverbindung. Externe DOI- und Quellenlinks benötigen Internetzugang. Die Merkliste ist browserabhängig; der Export ist die portable Sicherung Ihrer Auswahl.</p></section></div><aside class="about-panel"><h2>Datenbestand</h2><dl><dt>Beiträge</dt><dd>${publications.length} Publikationen in der Bibliothek</dd>${publicMode ? '' : `<dt>Dokumentierte Projekte</dt><dd>${projects.length} laufende oder geplante Vorhaben</dd>`}<dt>Zeitraum</dt><dd>${years.length?`${Math.min(...years)}–${Math.max(...years)}`:'—'}</dd><dt>Redaktioneller Stand</dt><dd>${dateLabel(meta.asOf)}</dd><dt>Arbeitsgruppe</dt><dd>AG Digitale Translation<br>Klinik für Neurologie · Düsseldorf${source?`<br><a class="source-link" href="${esc(source)}" target="_blank" rel="noopener noreferrer">Offizielle Arbeitsgruppenseite ${icon('external',12)}</a>`:''}</dd></dl><button type="button" class="primary" data-export="all">Gesamte Sammlung als JSON</button></aside></div>`;
  }
  function render() {
    const previousFocus=document.activeElement;
    const focusId=previousFocus?.id;
    const focusAttribute=previousFocus?.tagName==='BUTTON'?[...previousFocus.attributes].find(a=>a.name.startsWith('data-')):null;
    renderNav();
    const views={studies:() => window.ResearchExhibits?.render() || '<section class="page-header"><div><h1>Studien erkunden</h1><p class="page-intro">Die Studienansichten werden vorbereitet.</p></div></section>',publications:library,saved:library,timeline,fields,projects:projectView,about};
    app.innerHTML=views[state.view]();
    if(state.view==='studies')window.ResearchExhibits?.mount?.();
    if (state.view==='publications'||state.view==='saved') renderResults();
    document.title=`${({studies:'Studien erkunden',publications:'Publikationen',saved:'Merkliste',timeline:'Zeitachse',fields:'Forschungsfelder',projects:'Projekte',about:'Über die Sammlung'})[state.view]} · AG MARS Forschungsatlas`;
    if(previousFocus&&!previousFocus.isConnected){
      const nextFocus=focusId?document.getElementById(focusId):focusAttribute?[...document.querySelectorAll('button')].find(b=>b.getAttribute(focusAttribute.name)===focusAttribute.value):null;
      nextFocus?.focus({preventScroll:true});
    }
  }
  function setView(view, scroll=true) {
    if (!validViews.includes(view)) return;
    state.view=view;
    try { history.replaceState(null,'',`#${view}`); } catch { /* Local preview may restrict history. */ }
    render();
    if(scroll){window.scrollTo({top:0,behavior:'auto'});document.getElementById('main').focus({preventScroll:true});}
  }
  function resetFilters(){state.query='';state.author='';state.topic='';state.year='';state.type='';state.scope='';render();}
  function notify(message){const el=document.getElementById('toast');el.textContent=message;el.classList.add('toast-show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('toast-show'),2600);}
  function toggleSave(id){
    if(!paperMap.has(id)) return;
    if(saved.has(id))saved.delete(id);else saved.add(id);
    try {localStorage.setItem('digital-translation-atlas-saved',JSON.stringify([...saved]));storageAvailable=true;} catch {storageAvailable=false;}
    const savedButtonHadFocus = document.activeElement?.getAttribute('data-save') === id && !dialog.open;
    renderNav();renderResults();
    if (savedButtonHadFocus) {
      const replacement = [...document.querySelectorAll('#paper-results [data-save]')].find(b => b.dataset.save === id);
      (replacement || document.getElementById('paper-search'))?.focus({preventScroll:true});
    }
    if(dialog.open&&modalPaperId===id){const b=dialog.querySelector('[data-save]');if(b){b.setAttribute('aria-pressed',String(saved.has(id)));b.innerHTML=`${icon(saved.has(id)?'check':'bookmark',14)} ${saved.has(id)?'Gemerkt':'Merken'}`;}}
    notify(`${saved.has(id)?'Zur Merkliste hinzugefügt':'Aus Merkliste entfernt'}${storageAvailable?'':' · nur für diese Sitzung'}`);
  }
  function openPaper(id,trigger){
    const p=paperMap.get(id);if(!p)return;
    modalPaperId=id;modalTrigger=trigger||document.activeElement;
    const url=paperUrl(p);
    const sources=[...new Set([...(p.sourceUrls||[]),p.url].map(safeUrl).filter(Boolean))];
    const associatedProjects=projects.filter(pr=>(pr.relatedPublicationIds||[]).includes(id));
    document.getElementById('dialog-content').innerHTML=`<div class="dialog-inner"><div class="dialog-top"><span class="dialog-kicker">${esc(p.journal)} · ${esc(p.year)}</span><button type="button" class="dialog-close" data-close aria-label="Details schließen">${icon('close',18)}</button></div><h2 id="dialog-title">${esc(p.title)}</h2><p class="dialog-authors">${esc(authorList(p).join(' · '))}</p><div class="paper-tags"><span class="tag type">${esc(p.type||'Publikation')}</span>${topicTags(p.topics)}${p.scope?`<span class="tag type">${esc(scopeLabel(p.scope))}</span>`:''}</div>${p.summaryDe||p.evidenceNote?`<section class="dialog-section"><h3>Fragestellung &amp; Einordnung</h3>${p.summaryDe?`<p>${esc(p.summaryDe)}</p>`:''}${p.evidenceNote?`<p class="verification-note"><strong>Aussagegrenzen:</strong> ${esc(p.evidenceNote)}</p>`:''}</section>`:''}${p.groupRelation||p.verificationNotes||p.onlineYear||paperPmid(p)?`<section class="dialog-section"><h3>Bibliografischer Kontext</h3>${p.groupRelation?`<p>${esc(p.groupRelation)}</p>`:''}${p.onlineYear&&Number(p.onlineYear)!==Number(p.year)?`<p class="verification-note">Online veröffentlicht: ${esc(p.onlineYear)} · Bibliografisches Jahr: ${esc(p.year)}</p>`:''}${p.verificationNotes?`<p class="verification-note">${esc(plain(p.verificationNotes))}</p>`:''}${paperPmid(p)?`<p class="verification-note">PMID: ${esc(paperPmid(p))}</p>`:''}</section>`:''}<div class="dialog-actions">${url?`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${paperDoi(p)?'Zur Publikation':url.startsWith('https://pubmed.ncbi.nlm.nih.gov/')?'In PubMed öffnen':'Originalquelle'} ${icon('external',13)}</a>`:''}<button type="button" data-save="${esc(p.id)}" aria-pressed="${saved.has(p.id)}">${icon(saved.has(p.id)?'check':'bookmark',14)} ${saved.has(p.id)?'Gemerkt':'Merken'}</button><button type="button" data-paper-export="${esc(p.id)}">${icon('download',14)} BibTeX</button></div>${paperDoi(p)?`<p class="dialog-note">DOI: ${esc(paperDoi(p))}</p>`:''}${associatedProjects.length?`<section class="dialog-section"><h3>Thematisch verwandte Projekte</h3><div class="paper-links">${associatedProjects.map(pr=>`<button type="button" data-linked-project="${esc(pr.id)}">${esc(pr.title)} ${icon('arrow',13)}</button>`).join('')}</div></section>`:''}${sources.length?`<section class="dialog-section"><h3>Quellen</h3><ul class="dialog-sources">${sources.map((s,i)=>`<li><a href="${esc(s)}" target="_blank" rel="noopener noreferrer">${esc(new URL(s).hostname.replace(/^www\./,''))} · Quelle ${i+1} ↗</a></li>`).join('')}</ul></section>`:''}</div>`;
    if(!dialog.open)dialog.showModal();
    dialog.scrollTop=0;
    dialog.querySelector('[data-close]').focus({preventScroll:true});
  }
  function closeDialog(){dialog.close();modalPaperId=null;if(modalTrigger?.isConnected)modalTrigger.focus({preventScroll:true});}
  function bibEscape(value){return String(value??'').replace(/\\/g,'\\textbackslash{}').replace(/[{}]/g,c=>`\\${c}`).replace(/[%&#_$]/g,c=>`\\${c}`);}
  function bibtex(items){return items.map(p=>`@article{${String(p.id).replace(/[^a-zA-Z0-9_-]/g,'')},\n  title = {{${bibEscape(p.title)}}},\n  author = {${authorList(p).map(bibEscape).join(' and ')}},\n  journal = {${bibEscape(p.journal)}},\n  year = {${p.year}}${p.volume?`,\n  volume = {${bibEscape(p.volume)}}`:''}${p.issue?`,\n  number = {${bibEscape(p.issue)}}`:''}${p.pages?`,\n  pages = {${bibEscape(p.pages)}}`:''}${paperDoi(p)?`,\n  doi = {${bibEscape(paperDoi(p))}}`:''}${paperPmid(p)?`,\n  pmid = {${paperPmid(p)}}`:''}${paperUrl(p)?`,\n  url = {${bibEscape(paperUrl(p))}}`:''}\n}`).join('\n\n')+'\n';}
  function download(content,name,mime){const blob=new Blob([content],{type:mime});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);}
  function exportPapers(format,items=filteredPapers()){
    if(format==='all'){download(JSON.stringify(data,null,2),'forschungsatlas-sammlung.json','application/json;charset=utf-8');notify('Gesamte Sammlung exportiert');return;}
    if(!items.length){notify('Keine Beiträge für den Export ausgewählt');return;}
    const stamp=String(meta.asOf||'').slice(0,10);
    if(format==='bib')download(bibtex(items),`publikationen-${stamp}.bib`,'application/x-bibtex;charset=utf-8');
    else download(JSON.stringify({meta:{collection:meta.title||'AG Digitale Translation · Forschungsatlas',exportedAt:new Date().toISOString(),sourceAsOf:meta.asOf},publications:items},null,2),`publikationen-${stamp}.json`,'application/json;charset=utf-8');
    notify(`${items.length} Beiträge als ${format==='bib'?'BibTeX':'JSON'} exportiert`);
    document.getElementById('export-menu')?.setAttribute('hidden','');
    document.getElementById('export-toggle')?.setAttribute('aria-expanded','false');
  }
  document.addEventListener('click',event=>{
    const button=event.target.closest('button');
    if(button){
      if(button.hasAttribute('data-view'))return setView(button.dataset.view);
      if(button.hasAttribute('data-paper'))return openPaper(button.dataset.paper,button);
      if(button.hasAttribute('data-save'))return toggleSave(button.dataset.save);
      if(button.hasAttribute('data-close'))return closeDialog();
      if(button.hasAttribute('data-reset'))return resetFilters();
      if(button.hasAttribute('data-author-filter')){if(authorFilters.some(([value])=>value===button.dataset.authorFilter)){state.author=button.dataset.authorFilter;render();}return;}
      if(button.hasAttribute('data-topic-filter')){state.topic=button.dataset.topicFilter;render();return;}
      if(button.hasAttribute('data-layout')){state.layout=button.dataset.layout;render();return;}
      if(button.hasAttribute('data-timeline-year')){state.timelineYear=button.dataset.timelineYear;render();return;}
      if(button.hasAttribute('data-explore-topic')){state.query='';state.author='';state.year='';state.type='';state.scope='';state.topic=button.dataset.exploreTopic;setView('publications');document.getElementById('library-title')?.scrollIntoView({block:'start'});return;}
      if(button.hasAttribute('data-project-topic')){state.projectTopic=button.dataset.projectTopic;return setView('projects');}
      if(button.hasAttribute('data-project-filter')){state.projectTopic=button.dataset.projectFilter;render();return;}
      if(button.hasAttribute('data-linked-project')){closeDialog();state.projectTopic='';setView('projects');document.getElementById(`project-${button.dataset.linkedProject}`)?.scrollIntoView({block:'center'});return;}
      if(button.hasAttribute('data-export'))return exportPapers(button.dataset.export);
      if(button.hasAttribute('data-paper-export'))return exportPapers('bib',[paperMap.get(button.dataset.paperExport)]);
      if(button.id==='export-toggle'){const menu=document.getElementById('export-menu');const opening=menu.hidden;menu.hidden=!opening;button.setAttribute('aria-expanded',String(opening));return;}
    }
    if(!event.target.closest('.export-wrap')){document.getElementById('export-menu')?.setAttribute('hidden','');document.getElementById('export-toggle')?.setAttribute('aria-expanded','false');}
  });
  document.addEventListener('input',event=>{if(event.target.id==='paper-search'){state.query=event.target.value;renderResults();}});
  document.addEventListener('change',event=>{const keys={'year-filter':'year','type-filter':'type','scope-filter':'scope','sort-select':'sort'};if(keys[event.target.id]){state[keys[event.target.id]]=event.target.value;renderResults();}});
  document.addEventListener('keydown',event=>{
    const typing=/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||'')||document.activeElement?.isContentEditable;
    if(event.key==='/'&&!typing&&!dialog.open){event.preventDefault();if(!['publications','saved'].includes(state.view))setView('publications');document.getElementById('paper-search')?.focus();}
    if(event.key==='Escape'){document.getElementById('export-menu')?.setAttribute('hidden','');document.getElementById('export-toggle')?.setAttribute('aria-expanded','false');}
  });
  dialog.addEventListener('cancel',event=>{event.preventDefault();closeDialog();});
  dialog.addEventListener('click',event=>{if(event.target===dialog){const rect=dialog.getBoundingClientRect();if(event.clientX<rect.left||event.clientX>rect.right||event.clientY<rect.top||event.clientY>rect.bottom)closeDialog();}});
  window.addEventListener('hashchange',()=>{const view=location.hash.slice(1);if(validViews.includes(view))setView(view);});
  window.addEventListener('atlas:open-paper',event=>{if(event.detail?.id)openPaper(event.detail.id);});
  window.addEventListener('atlas:navigate',event=>{if(event.detail?.view)setView(event.detail.view);});
  // Optional iframe integration. Only height metadata is sent, to one explicit
  // parent origin (query parameter or referrer); never to the wildcard origin.
  if (embedded && window.parent !== window) {
    let parentOrigin = null;
    try {
      const supplied = new URLSearchParams(location.search).get('parentOrigin');
      const parentUrl = new URL(supplied || document.referrer);
      if (['https:', 'http:'].includes(parentUrl.protocol)) parentOrigin = parentUrl.origin;
    } catch { /* A fixed-height iframe still works without a known parent. */ }
    if (parentOrigin) {
      let previousHeight = 0;
      let resizeFrame = 0;
      const reportSize = () => {
        cancelAnimationFrame(resizeFrame);
        resizeFrame = requestAnimationFrame(() => {
          const height = Math.ceil(document.querySelector('.app-shell').getBoundingClientRect().height) + 1;
          if (height > 0 && height !== previousHeight) {
            previousHeight = height;
            window.parent.postMessage({type:'research-atlas:resize', version:1, height}, parentOrigin);
          }
        });
      };
      if ('ResizeObserver' in window) new ResizeObserver(reportSize).observe(document.querySelector('.app-shell'));
      window.addEventListener('resize', reportSize);
      window.addEventListener('load', reportSize);
      window.addEventListener('message', event => {
        if (event.source === window.parent && event.origin === parentOrigin && event.data?.type === 'research-atlas:request-size') {
          previousHeight = 0;
          reportSize();
        }
      });
      reportSize();
    }
  }
  render();
})();

</script>
</body>
</html>
