:"https://pmc.ncbi.nlm.nih.gov/articles/PMC12516250/","methodNote":"Prospektive Smartwatch-Kohorte aus Düsseldorf und Münster: 46 Personen mit CIDP unter stabiler intravenöser Immunglobulintherapie eingeschlossen, 43 in der Aktivitätsanalyse. Withings ScanWatch über etwa sechs Monate. Gezeigt ist pro Person die höchste gesamte Tagesschrittzahl im Beobachtungszeitraum, korreliert mit den klinischen Scores am Studienende. Ein gültiger Tag erforderte mindestens 75 % Tragezeit zwischen 06:00 und 23:00 Uhr; Personen mit verfehltem Kriterium an mehr als 25 % der Tage wurden ausgeschlossen. Das 14-Tage-Beispiel darüber erklärt ausschließlich die Berechnung und bildet dieses Studienprotokoll nicht nach.","correlationNote":"I-RODS: Rohscore 0–48, höher bedeutet weniger Einschränkung. INCAT: 0–10, höher bedeutet stärkere Behinderung. MRC-Summenscore: 0–60, höher bedeutet mehr Muskelkraft. Spearman-Korrelationen zwischen Personen belegen weder Kausalität noch eine validierte Vorhersage des individuellen Verlaufs. Das Maximum hängt auch von der Beobachtungsdauer ab. Die separate retrospektive Smartphone-Kohorte (n=20) wird hier nicht mit der Smartwatch-Kohorte vermischt. Konfidenzintervalle werden nicht nachträglich aus den gerundeten Koeffizienten konstruiert.","sampleNote":"Smartwatch-Kohorte, Aktivitätsanalyse n=43; höchste Tagesschrittzahl über etwa sechs Monate.","correlations":[{"label":"Maximale Tagesschritte","irods":0.74,"incat":-0.54,"mrc":0.37}]},"triage":{"paperId":"pmid-38875696","citation":"Lars Masanneck et al. Triage Performance Across Large Language Models, ChatGPT, and Untrained Doctors in Emergency Medicine: Comparative Study. Journal of medical Internet research (2024).","sourceUrl":"https://www.jmir.org/2024/1/e53297/","methodNote":"124 anonymisierte und bearbeitete englische Vignetten aus einem Tag der Notaufnahme Düsseldorf; Manchester Triage System, deutsche fünfte Ausgabe. Zwei erfahrene MTS-Instruierende bildeten mit Moderation bei Uneinigkeit die Konsensreferenz. Jedes Modell bewertete alle 124 Vignetten viermal: 496 Bewertungen, aber 124 verschiedene Fälle. Vier Assistenzärztinnen und -ärzte aus dem zweiten oder dritten Weiterbildungsjahr mit Notaufnahmeerfahrung, ohne formale MTS-Schulung, bewerteten dieselben Fälle. Gezeigt sind die sechs Modellkonfigurationen und zwei ärztlichen Bedingungen; die am Referenzkonsens beteiligten Rater sowie die retrospektiv optimale Kombination bleiben getrennte Befunde und werden hier nicht als Vergleichsgruppen angezeigt.","limitationNote":"Historische Produkt- und API-Stände, unter anderem ChatGPT vom 24.05.2023; keine Aussage zu heutigen Modellen. Für die Zweitmeinung wurde nachträglich die beste der vier GPT-4-ChatGPT-Wiederholungen ausgewählt. Die gleichen ärztlichen Personen überdachten danach ihre ursprünglichen Antworten. Mittelwerte und SD beziehen sich auf vier Durchgänge bzw. vier Personen. Der Tukey-Kontrast wird wie publiziert wiedergegeben, ohne neue Analyse der gepaarten Daten. Nichtsignifikanz belegt keine Äquivalenz. Die publizierte Differenz 0,025 beruht auf ungerundeten Werten; 0,70−0,68 ergibt dagegen 0,02. Die Vignettenstudie zeigt keine klinische Sicherheit oder verbesserte Patienten-Outcomes. Das konstruierte Kategorienpaar verwendet eine ausdrücklich für die Illustration gewählte Normierung; die konkrete Gewichtsformel der Originalanalyse ist im Paper nicht angegeben.","humanComparisonNote":"Dieselben vier Personen und 124 Vignetten. Publizierter Unterschied Δκ=0,025; Tukey-95%-KI −0,0515 bis 0,1015; p=0,9675. Ein statistisch signifikanter Gewinn wurde nicht nachgewiesen. Verwendet wurde die nachträglich beste GPT-4-ChatGPT-Wiederholung.","categories":[{"value":1,"label":"Rot · höchste Dringlichkeit"},{"value":2,"label":"Orange"},{"value":3,"label":"Gelb"},{"value":4,"label":"Grün"},{"value":5,"label":"Blau · niedrigste Dringlichkeit"}],"models":[{"id":"chatgpt35","label":"ChatGPT / GPT‑3.5","shortLabel":"ChatGPT / GPT‑3.5","mean":0.54,"sd":0.024,"note":"Vier neue Chats; genaue Backend-Version und Sampling-Parameter nicht angegeben."},{"id":"chatgpt4","label":"ChatGPT / GPT‑4","shortLabel":"ChatGPT / GPT‑4","mean":0.67,"sd":0.037,"note":"Vier neue Chats; genaue Backend-Version und Sampling-Parameter nicht angegeben. Die nachträglich beste Wiederholung wurde als Zweitmeinung für die ärztliche Assistenzbedingung ausgewählt."},{"id":"gpt4_api","label":"GPT‑4 / API","shortLabel":"GPT‑4 / API","mean":0.65,"sd":0.01,"note":"API-Modell und Prompt unterscheiden sich vom früheren ChatGPT-Produkt; kein isolierter Vergleich der Benutzeroberflächen."},{"id":"gemini15","label":"Gemini 1.5 / API","shortLabel":"Gemini 1.5 / API","mean":0.6,"sd":0.01,"note":""},{"id":"llama3","label":"Llama 3 70B / API","shortLabel":"Llama 3 70B / API","mean":0.52,"sd":0.004,"note":""},{"id":"mixtral","label":"Mixtral 8×7B / API","shortLabel":"Mixtral 8×7B / API","mean":0.42,"sd":0,"note":"Alle vier Durchgänge lieferten identische Triage-Zuordnungen. SD = 0,000 beschreibt diese Wiederholungen und belegt keine allgemeine Sicherheit."}],"humans":[{"id":"residents","label":"Assistenzärzt*innen allein","mean":0.68,"sd":0.056,"assisted":false},{"id":"residents_assisted","label":"Dieselben Ärzt*innen + GPT‑4-Zweitmeinung","mean":0.7,"sd":0.047,"assisted":true}],"comparison":{"from":"residents","to":"residents_assisted","direction":"to_minus_from","meanDifference":0.025,"pAdjusted":0.9675,"sourceId":"appendix","sourceLocation":"Table S2, PDF-Seite 8","recomputed":false,"confidenceInterval":{"level":0.95,"lower":-0.0515,"upper":0.1015,"method":"Tukey HSD","target":"Differenz der Gruppenmittelwerte von κ"}}},"ambulation":{"paperId":"pmid-42286763","citation":"Noah M Werner et al. Rethinking EDSS-based ambulation assessment in multiple sclerosis using continuous variable monitoring. Neurological research and practice (2026).","sourceUrl":"https://link.springer.com/article/10.1186/s42466-026-00501-8","methodNote":"Prospektive Beobachtungsstudie mit 16 Personen mit schubförmig-remittierender MS, je acht aus Düsseldorf und der Sauerlandklinik Hachen. Vor V1 wurde die mögliche Gehstrecke bis zur ersten erforderlichen Pause geschätzt; die tatsächliche Strecke wurde mit einem digitalen Messrad erfasst. Die veröffentlichten anonymen Tabellenbezeichnungen „Patient 1“ bis „Patient 16“ werden hier als „Person 1“ bis „Person 16“ gezeigt. Die Oberfläche berechnet ausschließlich Differenzen und Sortierung aus diesen Originalpaaren. 7 höhere und 9 niedrigere Messwerte sind aus den veröffentlichten Paaren abgeleitet; Median der absoluten Abweichung 299,92 m und Spearman-ρ=0,60 sind zusätzlich im Paper berichtet.","supplementUrl":"https://media.springernature.com/original/springer-static/esm/art%3A10.1186%2Fs42466-026-00501-8/MediaObjects/42466_2026_501_MOESM1_ESM.pdf","limitationNote":"Kleine explorative Stichprobe. EDSS wurde aus einer höchstens 30 Tage zurückliegenden Untersuchung übernommen und nicht vollständig an V1/V2 neu erhoben. Hilfsmittel sind im öffentlichen Material nicht personenbezogen dokumentiert. Aus Metern allein wird keine EDSS berechnet. Spearman-Korrelation ist ein Rangzusammenhang und kein Nachweis von Messübereinstimmung oder Austauschbarkeit. Gehtest und Alltagsaktivität erfassen unterschiedliche Aspekte; Testzeitpunkt und vorherige Belastung waren nicht standardisiert.","groupNote":"Aus den 16 publizierten Paaren: 7 gemessene Strecken waren höher, 9 niedriger als geschätzt. Die mediane absolute Abweichung beträgt 299,92 m. Der publizierte Rangzusammenhang beträgt Spearman-ρ=0,60.","categoryNote":"Die Autoren berichten für 12 von 16 Personen unterschiedliche EDSS-relevante Distanzkategorien. Die vollständige Zuordnungsregel und Grenzkonvention sind nicht dokumentiert; eine einfache Nachrechnung mit 100/200/500 m reproduziert den Befund nicht exakt. Deshalb werden hier keine individuellen EDSS-Kategorien zugewiesen.","medianAbsoluteDifference":299.92,"pairs":[{"id":1,"estimated":100,"measured":672.28,"sourceLabel":"Patient 1"},{"id":2,"estimated":200,"measured":742.16,"sourceLabel":"Patient 2"},{"id":3,"estimated":500,"measured":348.84,"sourceLabel":"Patient 3"},{"id":4,"estimated":500,"measured":56.64,"sourceLabel":"Patient 4"},{"id":5,"estimated":700,"measured":276.7,"sourceLabel":"Patient 5"},{"id":6,"estimated":10,"measured":234.28,"sourceLabel":"Patient 6"},{"id":7,"estimated":500,"measured":174.36,"sourceLabel":"Patient 7"},{"id":8,"estimated":5,"measured":8.36,"sourceLabel":"Patient 8"},{"id":9,"estimated":300,"measured":135.7,"sourceLabel":"Patient 9"},{"id":10,"estimated":2000,"measured":1489.1,"sourceLabel":"Patient 10"},{"id":11,"estimated":400,"measured":100.16,"sourceLabel":"Patient 11"},{"id":12,"estimated":1500,"measured":716.88,"sourceLabel":"Patient 12"},{"id":13,"estimated":25,"measured":123.44,"sourceLabel":"Patient 13"},{"id":14,"estimated":10,"measured":10.32,"sourceLabel":"Patient 14"},{"id":15,"estimated":400,"measured":194.38,"sourceLabel":"Patient 15"},{"id":16,"estimated":2000,"measured":2300,"sourceLabel":"Patient 16"}]},"sleep":{"paperId":"pmid-41257389","citation":"Jan Voth et al. Wearable Monitoring Captures Sleep Disturbances in Patients With Chronic Inflammatory Demyelinating Polyneuropathy. Journal of the peripheral nervous system : JPNS (2025).","sourceUrl":"https://pmc.ncbi.nlm.nih.gov/articles/PMC12536332/","methodNote":"Prospektives EMDA-CIDP-Monitoring mit Withings ScanWatch über etwa sechs Monate in Düsseldorf und Münster. 46 Personen eingeschlossen; nach einem IVIG-Abbruch und fünf Adhärenzausschlüssen 40 ausgewertet. Nachtfenster 22:00–08:00 Uhr; mindestens 75 % Tragezeit in mindestens 75 % der Nächte erforderlich. Pro Person wurden mediane nächtliche Schlafmaße mit Median-Scores aus V1–V3 verglichen. Die sechs Koeffizienten sind Spearman-Korrelationen zwischen diesen Personenmerkmalen. n=40 ist durch die analytische Kohorte und null fehlende Werte für diese Maße in Tabelle 1 gestützt; die Paarplots nennen kein separates n. Keine numerischen ρ-Konfidenzintervalle berichtet. I-RODS ist der Rohscore 0–48; höhere Werte bedeuten weniger Einschränkung.","limitationNote":"Typische, überwiegend stabil IVIG-behandelte CIDP; selektierte kleine Kohorte. Keine Polysomnographie- oder Aktigraphie-Referenz in dieser Analyse. Keine Kausalität, individuelle Prognose oder nachgewiesene Änderungssensitivität aus den Korrelationen ableiten. Die Sensor- und Fragebogenmediane der Einschlaflatenz sind keine Verteilung individueller Differenzen. Das konstruierte Beispiel verwendet feste 480 Minuten Bettzeit und 20 Minuten Latenz sowie keine zusätzliche Wachzeit nach endgültigem Erwachen. Es bildet keinen proprietären Gerätealgorithmus nach.","deviceNote":"Die Uhr schätzt Schlaf aus Sensorsignalen. Die Studie enthielt keine Polysomnographie als Referenz; auch eine hohe rechnerische Schlafeffizienz ist kein Nachweis störungsfreien Schlafs.","latencyNote":"Tabelle 1: Einschlaflatenz laut Uhr median 2 min [IQR 2–2], im Selbstbericht 15 min [10–30]. Das sind zwei Gruppenkennwerte; daraus folgt keine individuelle Differenz von 13 Minuten und kein validierter Gerätefehler.","scores":[{"id":"psqi","label":"PSQI","direction":"Höherer PSQI = schlechtere subjektive Schlafqualität."},{"id":"irods","label":"I-RODS","direction":"Höherer I-RODS = weniger Einschränkung."},{"id":"incat","label":"INCAT","direction":"Höherer INCAT = stärkere Einschränkung."}],"correlations":[{"id":"sleep_efficiency","label":"Schlafeffizienz","psqi":-0.49,"irods":0.46,"incat":-0.39},{"id":"waso","label":"Wachzeit (WASO)","psqi":0.4,"irods":-0.42,"incat":0.34}]}};</script>
  <script>
(() => {
  'use strict';
  const D=window.LANDMARK_DATA;
  const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const num=(v,d=1)=>new Intl.NumberFormat('de-DE',{minimumFractionDigits:d,maximumFractionDigits:d}).format(v);
  const source=s=>`<div class="ex-source"><span class="ex-overline">Die Publikation</span><p>${esc(s.citation)}</p><button type="button" data-landmark-paper="${esc(s.paperId)}">Autoren und Publikationsdetails ↗</button><a href="${esc(s.sourceUrl)}" target="_blank" rel="noopener noreferrer">Originalarbeit öffnen ↗</a></div>`;
  const table=(caption,head,rows)=>`<div class="ex-table-scroll" tabindex="0" role="region" aria-label="Datentabelle, bei Bedarf horizontal scrollen"><table><caption>${caption}</caption><thead><tr>${head.map(h=>`<th scope="col">${h}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>`<tr>${row.map((x,i)=>i===0?`<th scope="row">${x}</th>`:`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  const method=(s,content='')=>`<details class="ex-method"><summary>Daten, Methoden und Grenzen</summary><p>${esc(s.methodNote)}</p><p>${esc(s.limitationNote)}</p>${content}</details>`;
  const state={triageModel:'chatgpt4',triageReference:3,triageEstimate:4,triageAssisted:false,participant:1,sort:'id',awake:30,sleepScore:'psqi'};
  const items=[
    {id:'triage',number:'04',label:'Dringlichkeit richtig einordnen',subtitle:'Triage · 2024'},
    {id:'ambulation',number:'05',label:'Gehstrecke: geschätzt und gemessen',subtitle:'Wearables · MS · 2026'},
    {id:'sleep',number:'06',label:'Schlafdauer und Wachzeit',subtitle:'Wearables · CIDP · 2025'}
  ];
  function triage(){const s=D.triage;return `<section class="ex-study" aria-labelledby="study-title"><header class="ex-study-heading"><p class="ex-overline">04 / Manchester-Triage-Benchmark</p><h2 id="study-title">Wie nah liegt eine Einstufung an der Referenz?</h2><p>124 Notfallvignetten wurden mit dem Manchester Triage System bewertet. Die Studie vergleicht Sprachmodelle und Ärztinnen und Ärzte ohne formale MTS-Schulung. Erkunden Sie zuerst die Originalergebnisse.</p></header><div class="ex-layout"><div class="ex-workbench"><div class="ex-original-label">Veröffentlichte Ergebnisse · historische Modellstände</div><div class="ex-panel-select"><label for="triage-model">Konfiguration auswählen<select id="triage-model">${s.models.map(m=>`<option value="${esc(m.id)}" ${m.id===state.triageModel?'selected':''}>${esc(m.label)}</option>`).join('')}</select></label></div><div id="triage-results"></div><div class="ex-observed"><span class="ex-overline">Ärztliche Bewertungen</span><h3 class="ex-subtitle">Was änderte die GPT-4-Zweitmeinung?</h3><div class="ex-condition-switch" role="group" aria-label="Ärztliche Bewertung mit oder ohne KI"><button type="button" data-triage-assisted="false" aria-pressed="${!state.triageAssisted}">Ohne Zweitmeinung</button><button type="button" data-triage-assisted="true" aria-pressed="${state.triageAssisted}">Mit GPT-4-Zweitmeinung</button></div><div id="triage-human"></div></div><div class="ex-observed"><div class="ex-example-label"><span class="ex-overline">Messprinzip</span><strong>Konstruiertes Kategorienpaar · keine Fallvignette</strong></div><p class="ex-compact-note">Ein mathematisches Lehrbeispiel zeigt den Abstand zwischen zwei Kategorien und eine hier gewählte quadratische Normierung. Spielen Sie eine Abweichung in beide Richtungen durch.</p><div class="ex-panel-select"><label for="triage-reference">Referenzkategorie<select id="triage-reference">${s.categories.map(c=>`<option value="${c.value}" ${state.triageReference===c.value?'selected':''}>${c.value} · ${esc(c.label)}</option>`).join('')}</select></label></div><div class="ex-control-block"><label for="triage-estimate">Konstruierte Einstufung <output id="triage-estimate-value" for="triage-estimate"></output></label><input id="triage-estimate" type="range" min="1" max="5" step="1" value="${state.triageEstimate}"><div class="ex-range-stops" aria-hidden="true"><span>1 · höchste Dringlichkeit</span><span>5 · niedrigste</span></div></div><div id="triage-example" role="status" aria-atomic="true"></div></div>${method(s,table('Quadratisch gewichtetes κ, Mittelwert ± Standardabweichung',['Bedingung','Mittelwert','SD'],[...s.models,...s.humans].map(m=>[esc(m.label),num(m.mean,2),num(m.sd,3)])))}</div><aside class="ex-margin"><h3>Übereinstimmung ist kein Sicherheitsnachweis.</h3><p>κ berücksichtigt auch die zufällig erwartete Übereinstimmung. Es ist weder der Anteil exakt richtiger Antworten noch eine Wahrscheinlichkeit für eine sichere Entscheidung.</p><div class="ex-reading" id="triage-reading" aria-live="polite" aria-atomic="true"></div><p>Die Streuung bezieht sich bei Modellen auf vier Durchgänge derselben 124 Vignetten, bei den ärztlichen Bedingungen auf vier Personen. Die Fehlerbalken zeigen Standardabweichungen, keine Konfidenzintervalle.</p><p class="ex-caveat">Die Kategorien im Rechenbeispiel enthalten keine medizinischen Fallinformationen. Das Beispiel bildet weder eine echte Triage noch ein klinisches Assistenzsystem ab.</p>${source(s)}</aside></div></section>`;}
  function updateTriage(){
    const s=D.triage,selected=s.models.find(m=>m.id===state.triageModel)||s.models[0];
    const compact=window.matchMedia('(max-width:620px)').matches, plotWidth=compact?360:700;
    const x=v=>(compact?150:220)+v*(compact?180:420);
    document.getElementById('triage-results').innerHTML=`<div class="ex-result-line"><strong>${num(selected.mean,2)}<span>κ</span></strong><p>${esc(selected.label)}<br><b>SD ${num(selected.sd,3)} · vier Durchgänge</b></p></div><figure class="ex-data-plot"><svg viewBox="0 0 ${plotWidth} ${s.models.length*51+55}" role="img" aria-label="Publizierte Mittelwerte des quadratisch gewichteten Kappa mit Standardabweichungen; alle Werte stehen in der Datentabelle.">${[0,.25,.5,.75,1].map(t=>`<line x1="${x(t)}" x2="${x(t)}" y1="20" y2="${s.models.length*51+10}" stroke="#e0e4e3"/><text x="${x(t)}" y="${s.models.length*51+36}" text-anchor="middle">${num(t,2)}</text>`).join('')}${s.models.map((m,i)=>{const y=30+i*51,col=m.id===selected.id?'#244bc3':'#78858b';return `<text x="5" y="${y+4}" ${m.id===selected.id?'class="ex-selected-text"':''}>${esc(m.shortLabel||m.label)}</text><line x1="${x(m.mean-m.sd)}" x2="${x(m.mean+m.sd)}" y1="${y}" y2="${y}" stroke="${col}" stroke-width="2"/><line x1="${x(m.mean-m.sd)}" x2="${x(m.mean-m.sd)}" y1="${y-7}" y2="${y+7}" stroke="${col}"/><line x1="${x(m.mean+m.sd)}" x2="${x(m.mean+m.sd)}" y1="${y-7}" y2="${y+7}" stroke="${col}"/><circle cx="${x(m.mean)}" cy="${y}" r="${m.id===selected.id?6:4}" fill="${col}"/>`;}).join('')}</svg><figcaption>Punkt: Mittelwert des quadratisch gewichteten κ. Linie: ±1 SD. Gezeigter Achsenausschnitt 0 bis 1; κ kann grundsätzlich auch negativ sein.</figcaption></figure>`;
    const h=s.humans.find(h=>h.assisted===state.triageAssisted);
    document.getElementById('triage-human').innerHTML=`<div class="ex-pair-summary" role="status"><p>Quadratisch gewichtetes κ<strong class="blue">${num(h.mean,2)}</strong>Mittelwert</p><p>Streuung<strong>${num(h.sd,3)}</strong>Standardabweichung</p></div><p class="ex-delta-note">${esc(s.humanComparisonNote)}</p>`;
    document.querySelectorAll('[data-triage-assisted]').forEach(b=>b.setAttribute('aria-pressed',String((b.dataset.triageAssisted==='true')===state.triageAssisted)));
    const diff=state.triageEstimate-state.triageReference,penalty=(diff/4)**2,cat=s.categories.find(c=>c.value===state.triageEstimate);
    document.getElementById('triage-estimate-value').textContent=String(state.triageEstimate);
    document.getElementById('triage-example').innerHTML=`<p class="ex-delta-note"><b>${esc(cat.label)}</b> statt Referenzkategorie ${state.triageReference}: ${diff===0?'gleiche Einstufung':`${Math.abs(diff)} ${Math.abs(diff)===1?'Stufe':'Stufen'} ${diff>0?'weniger dringlich (Untertriage)':'dringlicher (Übertriage)'}`}.</p><div class="ex-pair-summary"><p>Abstand<strong>${Math.abs(diff)}</strong>Kategorien</p><p>Illustratives Fehlergewicht<strong class="rust">${num(penalty,4)}</strong>(Abstand / 4)²</p></div><p class="ex-help">Diese Normierung (Abstand / 4)² dient nur diesem Lehrbeispiel und ist kein κ-Wert. Die konkrete Gewichtsformel der Originalanalyse ist im Paper nicht angegeben. Gleich große Abstände erhalten in beide Richtungen dasselbe Gewicht. Medizinische Konsequenzen werden dadurch nicht gleichgesetzt.</p>`;
    document.getElementById('triage-reading').textContent=`${selected.label}: κ ${num(selected.mean,2)} mit SD ${num(selected.sd,3)}. ${selected.note||'Der Wert fasst die Übereinstimmung mit der Referenz über die Fallserie zusammen.'}`;
  }

ben Gehtest korrelierte die Smartwatch-Distanz mit dem Messradwert (Spearman-ρ=0,86; Kohorte n=16, paarweises n nicht separat ausgewiesen). Eine Korrelation belegt keine Austauschbarkeit der Messverfahren.</p>${source(s)}</aside></div></section>`;}

erson. Quadrat: Schätzung; Kreis: Messrad. Zeile anklicken oder eine Person oben auswählen. Die Achse beginnt bei null.</figcaption></figure>`;

e Spearman-Korrelationen; keine nachträglich geschätzten Konfidenzintervalle',['Schlafmaß',...s.scores.map(c=>esc(c.label))],s.correlations.map(c=>[esc(c.label),...s.scores.map(k=>num(c[k.id],2))])))}</div></div><aside class="ex-margin"><h3>Was das Beispiel voraussetzt</h3><p>Schlafeffizienz ist der Anteil der Zeit im Bett, der als Schlaf zählt. Hier rechnen wir mit festgelegten Zeiten; die Uhr und der Fragebogen sind daran nicht beteiligt.</p><div class="ex-reading" id="sleep-reading" aria-live="polite" aria-atomic="true"></div><p>Das Band zeigt addierte Zeitanteile, keinen zeitlichen Verlauf und keine Schlafstadien. Die Wachzeit wird nicht in einzelne Episoden aufgeteilt.</p><p class="ex-caveat">${esc(s.deviceNote)}</p>${source(s)}</aside></div></section>`;}

d>${c.imprecise}</td><td>${c.incorrect}</td><td>${c.hallucinations}</td></tr>`).join('')}</tbody></table></div></details></div><aside class="ex-margin"><h3>Dokumente als zusätzliche Quelle</h3><p>Beim Dokument-Retrieval erhält das Modell Zugriff auf abgerufene Leitlinienpassagen. Der Dokumentzugriff umfasste genau die 13 Leitlinien, aus denen die Benchmark-Fragen entstanden.</p><div class="ex-reading" id="rag-reading" aria-live="polite"></div><p>Vier Antworten je Frage ergeben 520 Bewertungen pro Bedingung. Die 130 Fragen bleiben die gemeinsamen Aufgaben. Die Grafik ordnet Antworten nach Bewertung, nicht nach Fragen oder Zeit.</p><p class="ex-caveat">Historische Modellstände, Abfragen bis November 2024. Die Untersuchung prüft einen Leitlinien-Benchmark und belegt keine Sicherheit bei realen Patientenentscheidungen.</p>${source(r)}</aside></div></section>`;

  function updateRag() {

  const exampleDays=[3600,4400,5100,3900,6200,5700,4500,4100,5300,6800,4900,7200,4300,5900];

  function wearables() {

/div><details class="ex-method"><summary>Studiendesign und Werte</summary><p>${esc(w.methodNote)}</p><p>${esc(w.correlationNote)}</p><div class="ex-table-scroll" tabindex="0" role="region" aria-label="Datentabelle, bei Bedarf horizontal scrollen"><table><caption>Spearman-Korrelationen aus der Originalarbeit</caption><thead><tr><th scope="col">Wearable-Maß</th><th scope="col">I-RODS</th><th scope="col">INCAT</th><th scope="col">MRC</th></tr></thead><tbody>${w.correlations.map(c=>`<tr><th scope="row">${esc(c.label)}</th><td>${num(c.irods,2)}</td><td>${num(c.incat,2)}</td><td>${num(c.mrc,2)}</td></tr>`).join('')}</tbody></table></div></details></div></div><aside class="ex-margin"><h3>Was ein einzelner Tag verändert</h3><p>Verändern Sie den orange markierten Tag. Der Mittelwert berücksichtigt jeden aufgezeichneten Tag. Das Maximum ist der höchste aufgezeichnete Tageswert.</p><div class="ex-reading" id="wearable-reading"></div><p id="wearable-announcement" class="sr-only" role="status" aria-atomic="true"></p><p>Eine Messlücke ist kein Tag mit null Schritten. Das Beispiel schließt fehlende Werte aus der Berechnung aus.</p><p class="ex-caveat">Die Studie untersucht Zusammenhänge zwischen Personen. Aus einer einzelnen Tagesänderung folgt keine Änderung eines klinischen Scores.</p>${source(w)}</aside></div></section>`;

  function updateWearables() {

    document.getElementById('wearable-reading').innerHTML=`<span class="ex-overline">Im konstruierten Beispiel</span><p>${state.missing?`Der Mittelwert verwendet ${stat.n} beobachtete Tage. Würde man die Lücke als null zählen, ergäbe sich ein anderer Wert.`:state.day>7200?'Tag 7 ist jetzt der aktivste Tag. Er verändert sowohl das Maximum als auch den Mittelwert. Ein einzelner ungewöhnlicher Wert kann das Maximum bestimmen.':'Das Maximum bleibt bei 7.200 Schritten. Der veränderte Tag beeinflusst den Mittelwert, obwohl der höchste Tageswert gleich bleibt.'}</p>`;

    document.getElementById('wearable-announcement').textContent=`Beispiel: ${stat.n} beobachtete Tage. Mittelwert ${num(stat.mean,0)} Schritte pro Tag, Maximum ${num(stat.max,0)} Schritte. Separates Studienergebnis: ${score==='irods'?'I-RODS':score==='incat'?'INCAT':'MRC-Summenscore'}, Spearman-Rho ${num(rows[0][score],2)}, n gleich 43.`;
    const scoreDirection=score==='irods'?'Höherer I-RODS = weniger Einschränkung.':score==='incat'?'Höherer INCAT = stärkere Einschränkung.':'Höherer MRC-Summenscore = mehr Muskelkraft.';
    document.getElementById('wearable-correlations').innerHTML=`<p class="ex-help">${scoreDirection} Spearman-ρ; die Länge zeigt die Stärke, das Vorzeichen die Richtung.</p><div class="ex-correlation-scale"><span>−1</span><span>0</span><span>+1</span></div>${rows.map(c=>`<div class="ex-corr-row"><span>${esc(c.label)}</span><div class="ex-corr-track"><i></i><b style="left:${c[score]<0?50+c[score]*50:50}%;width:${Math.abs(c[score])*50}%;background:${c[score]<0?'#c55a2d':'#244bc3'}"></b></div><strong>${num(c[score],2)}</strong></div>`).join('')}<p class="ex-help">${esc(D.wearables.sampleNote)} Die Koeffizienten bleiben vom konstruierten Beispiel unbeeinflusst.</p>`;

  function library() {

rst</option><option value="oldest" ${state.sort==='oldest'?'selected':''}>Älteste zuerst</option><option value="title" ${state.sort==='title'?'selected':''}>Titel A–Z</option></select></label><div class="view-switch" aria-label="Darstellung"><button type="button" class="${state.layout==='grid'?'active':''}" data-layout="grid" aria-label="Kartenansicht" aria-pressed="${state.layout==='grid'}">${icon('grid',14)}</button><button type="button" class="${state.layout==='list'?'active':''}" data-layout="list" aria-label="Listenansicht" aria-pressed="${state.layout==='list'}">${icon('list',14)}</button></div><div class="export-wrap"><button type="button" class="export-button" id="export-toggle" aria-label="Gefilterte Publikationen exportieren" aria-expanded="false" aria-controls="export-menu">${icon('download',14)}<span>Exportieren</span></button><div class="export-menu" id="export-menu" hidden><button type="button" data-export="bib">Als BibTeX (.bib)</button><button type="button" data-export="json">Als JSON (.json)</button></div></div></div></div><div id="paper-results" class="paper-grid ${state.layout==='list'?'list':''}"></div></section>`;

  const stageOrder = [['planned','Geplant'],['analysis','Analyse'],['manuscript','Manuskript'],['review','Prüfung & Revision']];

  function projectView() {
    const filtered=projects.filter(p=>!state.projectTopic||(p.topics||[]).includes(state.projectTopic));
    return `${header('ARBEITSSTAND','Projekte und offene Arbeit','Laufende Analysen, Manuskripte und geplante Vorhaben mit ihren nächsten offenen Schritten.')}<p class="view-note">Projektstatus nach den angegebenen Unterlagen. „Prüfung & Revision“ bedeutet nicht automatisch eine bestätigte Journal-Einreichung; die konkrete Einordnung steht auf der Projektkarte.</p><div class="project-filters" aria-label="Projekte nach Forschungsfeld filtern"><button type="button" class="chip ${!state.projectTopic?'active':''}" data-project-filter="" aria-pressed="${!state.projectTopic}">Alle Projekte · ${projects.length}</button>${topics.map(t=>`<button type="button" class="chip ${state.projectTopic===t.id?'active':''}" data-project-filter="${esc(t.id)}" aria-pressed="${state.projectTopic===t.id}"><span class="chip-dot" style="--topic-color:${safeColor(t.color)}"></span>${esc(t.label)}</button>`).join('')}</div><div class="project-board">${stageOrder.map(([stage,label])=>{const stageProjects=filtered.filter(p=>p.status===stage);return `<section><h2 class="project-column-head"><span class="stage-dot ${stage}"></span>${label}<span class="column-count">${stageProjects.length}</span></h2><div class="project-stack">${stageProjects.length?stageProjects.map(projectCard).join(''):`<div class="empty-column">${state.projectTopic?'Für dieses Forschungsfeld ist hier aktuell kein Projekt dokumentiert.':'Für diese Phase ist in der aktuellen Sammlung kein Projekt dokumentiert.'}</div>`}</div></section>`;}).join('')}</div>`;

  function about() {
    const source=safeUrl(meta.sourceUrl);
    return `${header('DOKUMENTATION','Quellen und Einordnung',publicMode ? 'Herkunft der Publikationsdaten und Methoden der interaktiven Studien.' : 'Herkunft der Publikationsdaten, Auswahl der Beiträge und dokumentierte Projektstände.')}<div class="about-layout"><div><section class="about-block"><h2>Was die Sammlung umfasst</h2><p>${esc((meta.scopeNote || 'Die Sammlung bündelt Publikationen aus Digital Health und Neurologie mit Beteiligung von Lars Masanneck sowie ausgewählte Kooperationen und frühe wissenschaftliche Arbeiten. Sie ist keine vollständige Mitgliederbibliografie der Arbeitsgruppe.').replace(/^Kuratierte Sammlung/, 'Sammlung'))}</p><p>Forschungsfelder sind redaktionelle Zuordnungen. Mehrfachzuordnungen machen inhaltliche Verbindungen sichtbar. Die Kategorien „Digital Health / Neurologie“, „Kooperationen“ und „Frühe Arbeiten“ dienen der Orientierung und behaupten keine institutionelle Alleinautorschaft.</p></section><section class="about-block"><h2>${publicMode ? 'Publikationsdaten' : 'Publikationen und Projekte'}</h2><p>Publikationstitel, Autor:innen, Journal, Jahr und Identifikatoren sind an den auf jeder Detailseite verlinkten Quellen überprüfbar. Das angezeigte Jahr folgt der bibliografischen Zuordnung; ein früheres Online-Publikationsjahr wird in den Details ausgewiesen, wenn es abweicht.</p>${publicMode ? '' : '<p>Projektkarten bilden den zuletzt dokumentierten Stand ab. Ein vorbereitetes Manuskript oder Einreichungspaket gilt nicht als veröffentlichte Arbeit. Nächste Schritte wurden aus den dokumentierten offenen Punkten abgeleitet; sie sind keine verbindliche Terminplanung.</p>'}</section><section class="about-block"><h2>Interaktive Studien</h2><p>Die sechs Studienansichten verwenden geprüfte Zahlen aus den Originalpublikationen. Die Schlaganfallansicht zeigt vier publizierte Szenarien; der Leitlinien-Benchmark zeigt aggregierte Bewertungen von Antworten. Das veränderbare 14-Tage-Wearable-Beispiel ist ausdrücklich konstruiert. Die daneben gezeigten klinischen Korrelationen stammen separat aus der Originalarbeit. Hinzu kommen die veröffentlichten Triage-Übereinstimmungen, 16 Originalpaare geschätzter und gemessener Gehstrecken sowie ein konstruiertes Schlafzeitbudget mit separat dargestellten Originalkorrelationen.</p><p>Methoden, Quellen und bekannte Inkonsistenzen stehen direkt bei jeder Studienansicht. Veränderungen eines Beispiels sind keine neuen Studienergebnisse.</p><button type="button" class="quiet-link" data-view="studies">Studien erkunden →</button></section><section class="about-block"><h2>Mit dem Atlas arbeiten</h2><ul><li>Nach Titel, Autor:in, Stichwort oder DOI suchen; mit <kbd>/</kbd> direkt ins Suchfeld springen.</li><li>Forschungsfelder, Jahre, Beitragstypen und Zuordnung kombinieren.</li><li>Eine persönliche Merkliste über das Lesezeichen anlegen. Sie wird ausschließlich in diesem Browser gespeichert.</li><li>Die aktuell gefilterte Auswahl als BibTeX oder JSON exportieren.</li></ul><p>Die HTML-Datei benötigt keine Netzwerkverbindung. Externe DOI- und Quellenlinks benötigen Internetzugang. Die Merkliste ist browserabhängig; der Export ist die portable Sicherung Ihrer Auswahl.</p></section></div><aside class="about-panel"><h2>Datenbestand</h2><dl><dt>Beiträge</dt><dd>${publications.length} Publikationen in der Bibliothek</dd>${publicMode ? '' : `<dt>Dokumentierte Projekte</dt><dd>${projects.length} laufende oder geplante Vorhaben</dd>`}<dt>Zeitraum</dt><dd>${years.length?`${Math.min(...years)}–${Math.max(...years)}`:'—'}</dd><dt>Redaktioneller Stand</dt><dd>${dateLabel(meta.asOf)}</dd><dt>Arbeitsgruppe</dt><dd>AG Digitale Translation<br>Klinik für Neurologie · Düsseldorf${source?`<br><a class="source-link" href="${esc(source)}" target="_blank" rel="noopener noreferrer">Offizielle Arbeitsgruppenseite ${icon('external',12)}</a>`:''}</dd></dl><button type="button" class="primary" data-export="all">Gesamte Sammlung als JSON</button></aside></div>`;
  }
  function render() {

    if (state.view==='publications'||state.view==='saved') renderResults();
    document.title=`${({studies:'Studien erkunden',publications:'Publikationen',saved:'Merkliste',timeline:'Zeitachse',fields:'Forschungsfelder',projects:'Projekte',about:'Über die Sammlung'})[state.view]} · Forschungsatlas`;

      const nextFocus=focusId?document.getElementById(focusId):focusAttribute?[...document.querySelectorAll('button')].find(b=>b.getAttribute(focusAttribute.name)===focusAttribute.value):null;

  function resetFilters(){state.query='';state.topic='';state.year='';state.type='';state.scope='';render();}

  function toggleSave(id){
    if(!paperMap.has(id)) return;

="paper-links">${associatedProjects.map(pr=>`<button type="button" data-linked-project="${esc(pr.id)}">${esc(pr.title)} ${icon('arrow',13)}</button>`).join('')}</div></section>`:''}${sources.length?`<section class="dialog-section"><h3>Quellen</h3><ul class="dialog-sources">${sources.map((s,i)=>`<li><a href="${esc(s)}" target="_blank" rel="noopener noreferrer">${esc(new URL(s).hostname.replace(/^www\./,''))} · Quelle ${i+1} ↗</a></li>`).join('')}</ul></section>`:''}</div>`;
    if(!dialog.open)dialog.showModal();
    dialog.scrollTop=0;
    dialog.querySelector('[data-close]').focus({preventScroll:true});
  }
  function closeDialog(){dialog.close();modalPaperId=null;if(modalTrigger?.isConnected)modalTrigger.focus({preventScroll:true});}
  function bibEscape(value){return String(value??'').replace(/\\/g,'\\textbackslash{}').replace(/[{}]/g,c=>`\\${c}`).replace(/[%&#_$]/g,c=>`\\${c}`);}
  function bibtex(items){return items.map(p=>`@article{${String(p.id).replace(/[^a-zA-Z0-9_-]/g,'')},\n  title = {{${bibEscape(p.title)}}},\n  author = {${authorList(p).map(bibEscape).join(' and ')}},\n  journal = {${bibEscape(p.journal)}},\n  year = {${p.year}}${p.volume?`,\n  volume = {${bibEscape(p.volume)}}`:''}${p.issue?`,\n  number = {${bibEscape(p.issue)}}`:''}${p.pages?`,\n  pages = {${bibEscape(p.pages)}}`:''}${p.doi?`,\n  doi = {${bibEscape(p.doi)}}`:''}${paperUrl(p)?`,\n  url = {${bibEscape(paperUrl(p))}}`:''}\n}`).join('\n\n')+'\n';}
  function download(content,name,mime){const blob=new Blob([content],{type:mime});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);}
  function exportPapers(format,items=filteredPapers()){
    if(format==='all'){download(JSON.stringify(data,null,2),'forschungsatlas-sammlung.json','application/json;charset=utf-8');notify('Gesamte Sammlung exportiert');return;}
    if(!items.length){notify('Keine Beiträge für den Export ausgewählt');return;}
    const stamp=String(meta.asOf||'').slice(0,10);
    if(format==='bib')download(bibtex(items),`publikationen-${stamp}.bib`,'application/x-bibtex;charset=utf-8');
    else download(JSON.stringify({meta:{collection:meta.title||'AG Digitale Translation · Forschungsatlas',exportedAt:new Date().toISOString(),sourceAsOf:meta.asOf},publications:items},null,2),`publikationen-${stamp}.json`,'application/json;charset=utf-8');
    notify(`${items.length} Beiträge als ${format==='bib'?'BibTeX':'JSON'} exportiert`);
    document.getElementById('export-menu')?.setAttribute('hidden','');
    document.getElementById('export-toggle')?.setAttribute('aria-expanded','false');
  }
  document.addEventListener('click',event=>{
    const button=event.target.closest('button');
    if(button){
      if(button.hasAttribute('data-view'))return setView(button.dataset.view);
      if(button.hasAttribute('data-paper'))return openPaper(button.dataset.paper,button);
      if(button.hasAttribute('data-save'))return toggleSave(button.dataset.save);
      if(button.hasAttribute('data-close'))return closeDialog();
      if(button.hasAttribute('data-reset'))return resetFilters();
      if(button.hasAttribute('data-topic-filter')){state.topic=button.dataset.topicFilter;render();return;}
      if(button.hasAttribute('data-layout')){state.layout=button.dataset.layout;render();return;}
      if(button.hasAttribute('data-timeline-year')){state.timelineYear=button.dataset.timelineYear;render();return;}
      if(button.hasAttribute('data-explore-topic')){state.query='';state.year='';state.type='';state.scope='';state.topic=button.dataset.exploreTopic;setView('publications');document.getElementById('library-title')?.scrollIntoView({block:'start'});return;}
      if(button.hasAttribute('data-project-topic')){state.projectTopic=button.dataset.projectTopic;return setView('projects');}
      if(button.hasAttribute('data-project-filter')){state.projectTopic=button.dataset.projectFilter;render();return;}
      if(button.hasAttribute('data-linked-project')){closeDialog();state.projectTopic='';setView('projects');document.getElementById(`project-${button.dataset.linkedProject}`)?.scrollIntoView({block:'center'});return;}
      if(button.hasAttribute('data-export'))return exportPapers(button.dataset.export);
      if(button.hasAttribute('data-paper-export'))return exportPapers('bib',[paperMap.get(button.dataset.paperExport)]);
      if(button.id==='export-toggle'){const menu=document.getElementById('export-menu');const opening=menu.hidden;menu.hidden=!opening;button.setAttribute('aria-expanded',String(opening));return;}
    }
    if(!event.target.closest('.export-wrap')){document.getElementById('export-menu')?.setAttribute('hidden','');document.getElementById('export-toggle')?.setAttribute('aria-expanded','false');}
  });
  document.addEventListener('input',event=>{if(event.target.id==='paper-search'){state.query=event.target.value;renderResults();}});
  document.addEventListener('change',event=>{const keys={'year-filter':'year','type-filter':'type','scope-filter':'scope','sort-select':'sort'};if(keys[event.target.id]){state[keys[event.target.id]]=event.target.value;renderResults();}});
  document.addEventListener('keydown',event=>{
    const typing=/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||'')||document.activeElement?.isContentEditable;
    if(event.key==='/'&&!typing&&!dialog.open){event.preventDefault();if(!['publications','saved'].includes(state.view))setView('publications');document.getElementById('paper-search')?.focus();}
    if(event.key==='Escape'){document.getElementById('export-menu')?.setAttribute('hidden','');document.getElementById('export-toggle')?.setAttribute('aria-expanded','false');}
  });
  dialog.addEventListener('cancel',event=>{event.preventDefault();closeDialog();});
  dialog.addEventListener('click',event=>{if(event.target===dialog){const rect=dialog.getBoundingClientRect();if(event.clientX<rect.left||event.clientX>rect.right||event.clientY<rect.top||event.clientY>rect.bottom)closeDialog();}});
  window.addEventListener('hashchange',()=>{const view=location.hash.slice(1);if(validViews.includes(view))setView(view);});
  window.addEventListener('atlas:open-paper',event=>{if(event.detail?.id)openPaper(event.detail.id);});
  window.addEventListener('atlas:navigate',event=>{if(event.detail?.view)setView(event.detail.view);});
  // Optional iframe integration. Only height metadata is sent, to one explicit
  // parent origin (query parameter or referrer); never to the wildcard origin.
  if (embedded && window.parent !== window) {
    let parentOrigin = null;
    try {
      const supplied = new URLSearchParams(location.search).get('parentOrigin');
      const parentUrl = new URL(supplied || document.referrer);
      if (['https:', 'http:'].includes(parentUrl.protocol)) parentOrigin = parentUrl.origin;
    } catch { /* A fixed-height iframe still works without a known parent. */ }
    if (parentOrigin) {
      let previousHeight = 0;
      let resizeFrame = 0;
      const reportSize = () => {
        cancelAnimationFrame(resizeFrame);
        resizeFrame = requestAnimationFrame(() => {
          const height = Math.ceil(document.querySelector('.app-shell').getBoundingClientRect().height) + 1;
          if (height > 0 && height !== previousHeight) {
            previousHeight = height;
            window.parent.postMessage({type:'research-atlas:resize', version:1, height}, parentOrigin);
          }
        });
      };
      if ('ResizeObserver' in window) new ResizeObserver(reportSize).observe(document.querySelector('.app-shell'));
      window.addEventListener('resize', reportSize);
      window.addEventListener('load', reportSize);
      window.addEventListener('message', event => {
        if (event.source === window.parent && event.origin === parentOrigin && event.data?.type === 'research-atlas:request-size') {
          previousHeight = 0;
          reportSize();
        }
      });
      reportSize();
    }
  }
  render();
})();

</script>
